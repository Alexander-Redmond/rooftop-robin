// A value that wanders between 0 and 1 along a lap and ends where it began.
function wander(rand, knots) {
  const marks = Array.from({ length: knots }, () => rand());
  return (at) => {
    const place = at * knots;
    const i = Math.floor(place);
    const ease = (1 - Math.cos((place - i) * Math.PI)) / 2;
    return lerp(marks[i % knots], marks[(i + 1) % knots], ease);
  };
}

// Each curtain is painted once for the size of the screen, as a sheet of fine rays one playfield
// wide and sharp to the pixel. A frame then only has to slide the sheet along and hang it in a wave.
function hangLights() {
  const px = view.scale * view.dpr;
  const wide = Math.round(W * px);
  for (const curtain of AURORA) {
    const rand = mulberry32(Math.round(curtain.y * 100));
    const bunch = wander(rand, 9);
    const streak = wander(rand, 46);
    const fine = wander(rand, 150);
    const high = Math.ceil(curtain.tall * view.h * px);
    curtain.sheet.width = wide + 8;
    curtain.sheet.height = high;
    const sheet = curtain.sheet.getContext('2d');
    for (let col = 0; col < wide; col++) {
      const at = col / wide;
      const turn = at * TAU;
      const patch = 0.5 + 0.5 * Math.sin(turn * curtain.beats[0] + curtain.phase) * Math.sin(turn * curtain.beats[1] + curtain.phase);
      // The curtain itself is lit all the way along, so that it hangs in one piece.
      const body = high * (0.86 + 0.14 * bunch(at));
      sheet.globalAlpha = 0.52 + 0.1 * patch;
      sheet.drawImage(curtain.ray, col, high - body, 1, body);
      // The rays stand in it, each a little taller and brighter or shorter and dimmer than the next.
      const ray = 0.45 * streak(at) + 0.55 * fine(at);
      const tall = high * (0.52 + 0.2 * patch + 0.28 * ray);
      sheet.globalAlpha = 0.05 + 0.5 * ray ** 1.5;
      sheet.drawImage(curtain.ray, col, high - tall, 1, tall);
    }
    // The sheet wraps round, so its first few columns are repeated at its far edge.
    sheet.globalAlpha = 1;
    sheet.drawImage(curtain.sheet, 0, 0, 8, high, wide, 0, 8, high);
  }
}

const streak = { at: -99, x: 0, y: 0, lean: 1, wait: 3 };

function paintSky(g, metres) {
  let i = 0;
  while (i < SKY.length - 2 && metres >= SKY[i + 1].at) i++;
  const low = SKY[i];
  const high = SKY[i + 1];
  const t = clamp((metres - low.at) / (high.at - low.at), 0, 1);

  g.fillStyle = blend(low.bands[0], high.bands[0], t);
  g.fillRect(0, 0, view.sw, view.sh);
  for (let k = 1; k < 5; k++) {
    const y = view.sh * (0.16 + k * 0.17);
    g.fillStyle = blend(low.bands[k], high.bands[k], t);
    g.beginPath();
    g.moveTo(0, y + SWAY[k][0]);
    g.quadraticCurveTo(view.sw / 2, y + SWAY[k][1], view.sw, y + SWAY[k][2]);
    g.lineTo(view.sw, view.sh);
    g.lineTo(0, view.sh);
    g.closePath();
    g.fill();
  }
}

// Everything behind the ledges, farthest first.
// The backdrop is drawn 400 across. Where the playfield is wider, the parts of it that there can
// be more of, the stars, the clouds and the land, are drawn again either side as mirror images,
// so that they run on across the joins. "top" is where the screen's top edge is in the pen's own
// measure.
function tiled(g, paint, top = 0) {
  const part = (left, wide, about) => {
    g.save();
    g.beginPath();
    g.rect(left, top, wide, view.h);
    g.clip();
    if (about !== null) {
      g.translate(about * 2, 0);
      g.scale(-1, 1);
    }
    paint();
    g.restore();
  };
  part(0, W, null);
  if (field.lo < 0) {
    part(field.lo, -field.lo, 0);
    part(W, field.hi - W, W);
  }
}

// What there is only one of, the moon and the star among them, is drawn once and wherever it is.
// So are the northern lights, whose curtains go round and simply run on to either edge.
function paintFar(g, travel, metres) {
  tiled(g, () => {
    paintNebula(g, travel, metres);
    paintStars(g, travel, metres);
  });
  paintGalaxy(g, metres);
  paintChristmasStar(g, metres);
  paintStreak(g, metres);
  paintAurora(g, metres);
  paintPlanet(g, metres);
  paintComet(g, metres);
  paintMoon(g, metres);
  paintBeacon(g);
  paintEarth(g, metres);
  tiled(g, () => {
    paintClouds(g, travel, metres);
    paintLand(g, travel);
  });
}

function paintStars(g, travel, metres) {
  // Stars stay small and pale so nothing in the sky reads as a pickup.
  const low = clamp((metres - 120) / 900, 0.12, 0.45);
  const high = ramp(metres, 1300, 2400) * 0.9;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    // The first 64 show from the rooftops. The rest only come out above the clouds.
    const shine = i < 64 ? Math.max(low, high) : high;
    if (!shine) break;
    const y = ((s.y + travel * s.depth) % 1400) - 100;
    if (y > view.h) continue;
    g.globalAlpha = s.size > 1 && !calm ? shine * (0.7 + 0.3 * Math.sin(clock * 1.6 + s.wink)) : shine;
    g.fillStyle = s.tint;
    if (s.size < 0.8) g.fillRect(s.x, y, s.size * 2, s.size * 2);
    else disc(g, s.x, y, s.size);
  }
  g.globalAlpha = 1;
}

function paintGalaxy(g, metres) {
  const glow = during(metres, 1850, 2300, 3300, 3700);
  if (!glow) return;
  g.save();
  g.translate(W / 2, lerp(-240, view.h + 240, ramp(metres, 1850, 3700)));
  g.rotate(-0.95);
  g.fillStyle = '#8fa4ff';
  for (const [size, alpha] of [[1.5, 0.035], [1, 0.045], [0.55, 0.06]]) {
    g.globalAlpha = glow * alpha;
    puffs(g, 0, 0, size, galaxy.lumps.map(([along, across, r]) => [along / size, across / size, r]));
  }
  g.fillStyle = '#060f1f';
  g.globalAlpha = glow * 0.28;
  bar(g, -300, -10, 420, 8, 4);
  bar(g, -40, 7, 330, 6, 3);
  g.fillStyle = C.snow;
  g.globalAlpha = glow * 0.75;
  for (const s of galaxy.stars) g.fillRect(s.along, s.across, s.size * 2, s.size * 2);
  g.restore();
}

function paintNebula(g, travel, metres) {
  const glow = during(metres, 5900, 6800, 9900, 10800);
  if (!glow) return;
  for (const [x, y, r, ink, tilt] of NEBULA) {
    const sy = ((y + travel * 0.04) % 1800) - 300;
    if (sy - r * 2.6 > view.h) continue;
    g.save();
    g.translate(x, sy);
    g.rotate(tilt);
    // Three sizes of the same shape, the smallest palest, stand in for a glow.
    g.fillStyle = NEBULA_INK[ink][0];
    g.globalAlpha = glow * 0.07;
    puffs(g, 0, 0, r * 1.35, GAS);
    g.globalAlpha = glow * 0.1;
    puffs(g, 0, 0, r, GAS);
    g.fillStyle = NEBULA_INK[ink][1];
    g.globalAlpha = glow * 0.09;
    puffs(g, 0, 0, r * 0.55, GAS);
    g.restore();
  }
}

// The Christmas star: a soft glow, eight thin rays and a bright heart, at any size.
function paintRays(g, x, y, size, bright, pulse) {
  g.save();
  g.translate(x, y);
  g.scale(size, size);
  g.fillStyle = '#ffd98a';
  for (const [r, alpha] of [[170, 0.045], [105, 0.06], [58, 0.09]]) {
    g.globalAlpha = bright * alpha;
    disc(g, 0, 0, r * pulse);
  }
  // Each ray is a long thin triangle, painted wide and faint and then narrow and bright.
  for (const [wide, alpha, colour] of [[7, 0.24, '#ffd98a'], [2.6, 0.92, '#fff6dd']]) {
    g.fillStyle = colour;
    g.globalAlpha = bright * alpha;
    for (const [turn, long] of RAYS) {
      const a = turn * TAU;
      const sx = -Math.sin(a) * wide;
      const sy = Math.cos(a) * wide;
      shape(g, [sx, sy, Math.cos(a) * long * pulse, Math.sin(a) * long * pulse, -sx, -sy]);
    }
  }
  g.globalAlpha = bright;
  disc(g, 0, 0, 9 * pulse);
  g.restore();
}

function paintChristmasStar(g, metres) {
  const rise = ramp(metres, 9200, 10000);
  if (!rise) return;
  // When a climber arrives the star swells, and it beats faster.
  const flare = glory ? ramp(glory.t, 0.3, 2.6) : 0;
  const pulse = calm ? 1 : 1 + Math.sin(clock * 1.5 + flare * 14) * lerp(0.05, 0.1, flare);
  paintRays(g, W / 2, lerp(-90, view.h * 0.2, rise), 1 + flare * 0.6, rise, pulse);
}

// The same star as it looks from the roof: small, a long way up and never quite still, with a few
// glints coming and going around it. It is there on the home screen and fades when a climb starts.
function paintBeacon(g) {
  if (beacon < 0.01) return;
  const twinkle = calm ? 1 : 1 + Math.sin(clock * 2.3) * 0.09 + Math.sin(clock * 5.9) * 0.05;
  paintRays(g, BEACON.x, BEACON.y, 0.27, beacon, twinkle);
  g.fillStyle = '#fff6dd';
  BEACON.glints.forEach(([dx, dy], i) => {
    const blink = calm ? 0.5 : Math.max(0, Math.sin(clock * 1.9 + i * 2.2));
    g.globalAlpha = beacon * blink;
    glint(g, BEACON.x + dx, BEACON.y + dy, 0.6 + blink * 1.3);
  });
  g.globalAlpha = 1;
}

// Now and then a shooting star crosses the upper sky.
function paintStreak(g, metres) {
  if (calm || metres < 1500) return;
  const age = clock - streak.at;
  if (age > streak.wait) {
    Object.assign(streak, {
      at: clock, x: 60 + Math.random() * 280, y: 30 + Math.random() * view.h * 0.4,
      lean: Math.random() < 0.5 ? -1 : 1, wait: 4 + Math.random() * 8
    });
    return;
  }
  if (age > 0.7) return;
  const gone = age / 0.7;
  const x = streak.x + streak.lean * gone * 150;
  const y = streak.y + gone * 90;
  g.strokeStyle = C.snow;
  g.lineCap = 'round';
  // Three strokes, each shorter and brighter than the last, give the tail its taper.
  for (const [back, wide, alpha] of [[70, 1, 0.25], [40, 1.4, 0.45], [16, 1.8, 0.9]]) {
    g.globalAlpha = alpha * (1 - gone);
    g.lineWidth = wide;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x - streak.lean * back * 0.86, y - back * 0.51);
    g.stroke();
  }
  g.globalAlpha = 1;
}

function paintAurora(g, metres) {
  const glow = during(metres, 1050, 1300, 2000, 2400);
  if (!glow) return;
  const drift = calm ? 0 : clock;
  // The sheets go on in upright slices eight screen pixels wide, copied pixel for pixel: whole
  // pixels keep the rays sharp and leave no faint line where two slices meet.
  const px = view.scale * view.dpr;
  const left = Math.round(view.left * view.dpr);
  // A sheet is one playfield wide and goes round, so a wider playfield takes it more than once.
  const from = Math.floor((field.lo * px) / 8) * 8;
  const to = field.hi * px;
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = glow;
  for (const c of AURORA) {
    const wide = c.sheet.width - 8;
    const high = c.sheet.height;
    const slide = Math.floor(drift * c.speed * 9 * px);
    for (let sx = from; sx < to; sx += 8) {
      const x = sx / px;
      const wave = Math.sin(x * 0.012 + drift * c.speed * 0.6 + c.phase) * 24 + Math.sin(x * 0.031 - drift * c.speed * 0.35 + c.phase * 2) * 10 + ((x - field.lo) / field.across - 0.5) * c.tilt;
      g.drawImage(c.sheet, (((sx + slide) % wide) + wide) % wide, 0, 8, high, left + sx, Math.round((view.h * c.y + wave) * px) - high, 8, high);
    }
  }
  g.restore();
}

function paintPlanet(g, metres) {
  const y = -90 + (metres - 6300) * 0.24;
  if (metres < 6300 || y > view.h + 110) return;
  const ring = (from, to) => {
    g.globalAlpha = 0.85;
    g.strokeStyle = '#e7d2b8';
    g.lineWidth = 6;
    g.beginPath();
    g.ellipse(0, 0, 78, 17, 0, from, to);
    g.stroke();
    g.strokeStyle = '#b99a7e';
    g.lineWidth = 2;
    g.beginPath();
    g.ellipse(0, 0, 64, 12.5, 0, from, to);
    g.stroke();
    g.globalAlpha = 1;
  };
  g.save();
  g.translate(104, y);
  g.rotate(-0.38);
  g.lineCap = 'butt';
  // The far half of the ring goes behind the globe and the near half in front of it.
  ring(Math.PI, TAU);
  g.save();
  g.beginPath();
  g.arc(0, 0, 46, 0, TAU);
  g.clip();
  g.fillStyle = '#c98a6b';
  g.fillRect(-46, -46, 92, 92);
  g.fillStyle = '#b3734f';
  g.fillRect(-46, -30, 92, 9);
  g.fillRect(-46, 6, 92, 13);
  g.fillStyle = '#dba486';
  g.fillRect(-46, -14, 92, 10);
  g.fillRect(-46, 26, 92, 7);
  g.fillStyle = 'rgba(8, 6, 20, 0.5)';
  disc(g, -30, 12, 52);
  g.restore();
  ring(0, Math.PI);
  g.restore();
}

function paintComet(g, metres) {
  const glow = during(metres, 7200, 7500, 9000, 9300);
  if (!glow) return;
  const x = 330 - (metres - 7200) * 0.07;
  const y = 120 + (metres - 7200) * 0.16;
  g.fillStyle = '#dff6ff';
  // The tail streams up and to the right.
  for (const [long, wide, alpha] of [[190, 13, 0.07], [130, 9, 0.11], [70, 5, 0.2]]) {
    g.globalAlpha = glow * alpha;
    shape(g, [x + 0.3 * wide, y + 0.4 * wide, x - 0.3 * wide, y - 0.4 * wide, x + 0.8 * long, y - 0.6 * long]);
  }
  g.globalAlpha = glow * 0.25;
  disc(g, x, y, 8);
  g.globalAlpha = glow * 0.95;
  disc(g, x, y, 3.4);
  g.globalAlpha = 1;
}

function paintMoon(g, metres) {
  const r = track(MOON_R, metres);
  const x = track(MOON_X, metres);
  const y = track(MOON_Y, metres);
  if (y - r > view.h) return;
  // Up close the moon is dimmer and half in shadow, so pale ledges still stand out against it.
  const close = ramp(r, 45, 170);
  if (close < 1) {
    g.fillStyle = C.snow;
    g.globalAlpha = 0.05 * (1 - close);
    disc(g, x, y, r * 2.3);
    disc(g, x, y, r * 1.6);
    g.fillStyle = C.ink;
    g.globalAlpha = 0.35 * (1 - close);
    disc(g, x + r * 0.1, y + r * 0.13, r);
    g.globalAlpha = 1;
  }
  g.fillStyle = blend(MOON_LIT[0], MOON_LIT[1], close);
  disc(g, x, y, r);
  g.fillStyle = blend(MOON_PIT[0], MOON_PIT[1], close);
  if (close) {
    g.globalAlpha = close * 0.6;
    for (const [mx, my, wide, tall, tilt] of MARIA) oval(g, x + mx * r, y + my * r, wide * r, tall * r, tilt);
    g.globalAlpha = 1;
  }
  for (const [cx, cy, size, from] of CRATERS) if (r >= from) disc(g, x + cx * r, y + cy * r, size * r);
  if (close) {
    g.save();
    g.beginPath();
    g.arc(x, y, r, 0, TAU);
    g.clip();
    g.fillStyle = `rgba(5, 9, 16, ${0.72 * close})`;
    disc(g, x + r * 0.5, y + r * 0.42, r * 1.02);
    g.restore();
  }
  if (r < 44) paintSleigh(g, x, y);
}

// How far across the sky the sleigh is, from 0 to 1, or -1 between its passes.
function sleighPass() {
  const t = (clock + 20) % 24;
  return calm || t > 8 ? -1 : t / 8;
}

// Every so often a sleigh crosses the face of the moon. It is ink on a dark sky, so it shows most
// clearly while it is in front of the moon.
function paintSleigh(g, mx, my) {
  const pass = sleighPass();
  if (pass < 0 || flypast) return;
  // It comes in from off the left of the playfield, climbs across the face of the moon and goes
  // off to the right.
  const x = lerp(-80, W + 40, pass);
  g.save();
  g.translate(x, my - 4 - (x + 30 - mx) * 0.12 + Math.sin(pass * 9) * 3);
  g.rotate(-0.12);
  g.globalAlpha = 0.92;
  paintTeam(g, C.ink);
  g.restore();
}

// The body of the sleigh: over the high back, along the seat, up and over the curl of the dash,
// and home along the belly.
function sleighBody(g) {
  g.moveTo(-10.2, -8.6);
  g.quadraticCurveTo(-9.4, -10.4, -7.9, -8.8);
  g.bezierCurveTo(-8.1, -6, -7.4, -3.2, -5.4, -2.6);
  g.lineTo(4.2, -2.6);
  g.bezierCurveTo(6.4, -2.6, 7.6, -4, 6.9, -6);
  g.quadraticCurveTo(7.8, -7.5, 8.9, -6);
  g.bezierCurveTo(10.4, -3, 8.9, 0.4, 6.2, 1.3);
  g.quadraticCurveTo(-1.2, 3.1, -8.2, 1.1);
  g.bezierCurveTo(-10.5, -1, -11.3, -5.4, -10.2, -8.6);
  g.closePath();
}

// A leg from its joint, swung by an angle from straight down: broad at the top, fine at the hoof
// and bowed a little along the way.
function limb(g, x, y, angle, length, bow) {
  const dx = Math.sin(angle);
  const dy = Math.cos(angle);
  const fx = x + dx * length;
  const fy = y + dy * length;
  const kx = (x + fx) / 2 + dy * bow * length;
  const ky = (y + fy) / 2 - dx * bow * length;
  g.moveTo(x + dy * 0.85, y - dx * 0.85);
  g.quadraticCurveTo(kx + dy * 0.55, ky - dx * 0.55, fx + dy * 0.3, fy - dx * 0.3);
  g.lineTo(fx - dy * 0.3, fy + dx * 0.3);
  g.quadraticCurveTo(kx - dy * 0.55, ky + dx * 0.55, x - dy * 0.85, y + dx * 0.85);
  g.closePath();
}

// The sleigh and its three reindeer in one colour, drawn around the middle of the sleigh. A
// climber being carried sits in the driver's place.
function paintTeam(g, colour, carrying = false) {
  g.fillStyle = g.strokeStyle = colour;
  g.lineCap = g.lineJoin = 'round';
  const blob = (x, y, rx, ry, turn = 0) => {
    g.moveTo(x + rx * Math.cos(turn), y + rx * Math.sin(turn));
    g.ellipse(x, y, rx, ry, turn, 0, TAU);
  };
  const deer = [0, 1, 2].map((k) => [22 + k * 15.5, -2.6 - k * 1.3, (Math.sin(clock * 9 + k * 1.3) + 1) / 2]);
  // Father Christmas drives, unless he is the one out climbing or a climber has his seat.
  const driven = !carrying && save.hero !== 'father';

  // Everything solid is one shape, and every outline in it runs the same way round, so that
  // where two parts overlap they join instead of cutting a hole in each other.
  g.beginPath();
  sleighBody(g);
  // The sack, tied at the neck, rides behind the seat.
  blob(-6.2, -8, 3.4, 3.4);
  blob(-5, -11.6, 0.85, 0.85);
  if (driven) {
    blob(1.4, -5.5, 2.7, 3.2);
    blob(2.3, -9.8, 1.8, 1.8);
    blob(3.2, -8.2, 1.4, 1.1);
    g.moveTo(0.7, -10.2);
    g.quadraticCurveTo(-0.2, -12.8, -1.9, -13.3);
    g.quadraticCurveTo(1.6, -13.6, 4, -10.6);
    g.closePath();
    blob(-2.2, -13.3, 0.85, 0.85);
  }
  for (const [x, y, reach] of deer) {
    g.moveTo(x - 5.3, y - 0.9);
    g.bezierCurveTo(x - 5.4, y - 3, x - 2.6, y - 3.3, x - 0.2, y - 2.9);
    g.bezierCurveTo(x + 1.5, y - 2.6, x + 2.9, y - 2.9, x + 4.1, y - 4);
    g.bezierCurveTo(x + 4.9, y - 4.9, x + 5.8, y - 6.2, x + 6.9, y - 6.9);
    g.bezierCurveTo(x + 7.8, y - 7.6, x + 9.1, y - 7.5, x + 10.4, y - 6.6);
    g.quadraticCurveTo(x + 11, y - 6.1, x + 10.3, y - 5.6);
    g.bezierCurveTo(x + 9.4, y - 5.2, x + 8.6, y - 5, x + 8, y - 5.2);
    g.bezierCurveTo(x + 7.4, y - 3.9, x + 6.6, y - 2.4, x + 5.5, y - 1.2);
    g.bezierCurveTo(x + 5.1, y + 0.6, x + 3.5, y + 1.9, x + 1.2, y + 2);
    g.bezierCurveTo(x - 1, y + 2, x - 2.6, y + 1, x - 4, y + 1.5);
    g.bezierCurveTo(x - 5, y + 1.8, x - 5.4, y + 0.6, x - 5.3, y - 0.9);
    g.closePath();
    blob(x + 6.4, y - 7.7, 1.3, 0.5, 0.8);
    blob(x - 5.7, y - 2.1, 1.1, 0.55, 0.9);
    // A flying gallop: all four legs reach out together and gather in together.
    const fore = lerp(-0.3, 1, reach);
    const hind = lerp(0.35, -1, reach);
    limb(g, x + 3.3, y + 0.6, fore, 6.6, 0.1);
    limb(g, x + 2.3, y + 0.9, fore - 0.3, 6.4, 0.1);
    limb(g, x - 3.5, y + 0.5, hind, 6.8, -0.14);
    limb(g, x - 4.3, y + 0.2, hind + 0.28, 6.6, -0.14);
  }
  g.fill();

  // The runner with its curl, the driver's arm and the antlers.
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(-10.8, 3.5);
  g.quadraticCurveTo(-10.2, 4.9, -8, 4.9);
  g.lineTo(6, 4.9);
  g.bezierCurveTo(10, 4.9, 12.2, 2.6, 11.2, -0.2);
  g.quadraticCurveTo(10.8, -1.3, 9.9, -0.7);
  g.moveTo(-5.5, 2);
  g.lineTo(-5.5, 4.9);
  g.moveTo(3, 2.2);
  g.lineTo(3, 4.9);
  if (driven) {
    g.moveTo(2.2, -6.4);
    g.lineTo(6.2, -5.4);
  }
  g.stroke();
  g.lineWidth = 0.8;
  g.beginPath();
  for (const [x, y] of deer) {
    g.moveTo(x + 6.8, y - 7.2);
    g.quadraticCurveTo(x + 6, y - 10.3, x + 3.9, y - 11.8);
    g.moveTo(x + 6.3, y - 9.3);
    g.quadraticCurveTo(x + 7.5, y - 10.4, x + 7.5, y - 12);
    g.moveTo(x + 5.3, y - 10.9);
    g.lineTo(x + 5.5, y - 12.7);
    g.moveTo(x + 7.2, y - 7.5);
    g.quadraticCurveTo(x + 8.6, y - 8.4, x + 9.2, y - 10);
  }
  g.stroke();

  // The traces, from the driver's hand, or from the dash when he is not there, to each collar.
  g.lineWidth = 0.55;
  g.beginPath();
  let [hx, hy] = driven ? [6.2, -5.4] : [7.9, -6.9];
  for (const [x, y] of deer) {
    g.moveTo(hx, hy);
    g.quadraticCurveTo((hx + x + 4.6) / 2, (hy + y - 3.2) / 2 + 1.5, x + 4.6, y - 3.2);
    [hx, hy] = [x + 4.6, y - 3.2];
  }
  g.stroke();
}

// The sleigh on its way over after a new best: close, pale against the sky and haloed in gold.
function paintFlypast(g) {
  if (!flypast) return;
  const [x, y, u] = flypastAt();
  g.save();
  g.translate(x, y);
  g.rotate(0.12 * Math.cos(u * Math.PI));
  g.scale(2.2, 2.2);
  g.shadowColor = C.gold;
  g.shadowBlur = 16;
  paintTeam(g, C.snow);
  g.restore();
}

function paintEarth(g, metres) {
  if (metres < 2600) return;
  const r = track(EARTH_R, metres);
  const x = track(EARTH_X, metres);
  const y = view.h - track(EARTH_TOP, metres) + r;
  // The thin shell of air: a wide faint ring, a narrower one, and a bright line on the edge itself.
  const haze = clamp(r / 240, 0.1, 1);
  g.lineCap = 'butt';
  for (const [out, wide, alpha, colour] of [[10, 20, 0.1, '#4aa8ff'], [4, 9, 0.22, '#6cc4ff'], [0.5, 2.4, 0.75, '#c9eeff']]) {
    g.globalAlpha = alpha;
    g.strokeStyle = colour;
    g.lineWidth = wide * haze;
    g.beginPath();
    g.arc(x, y, r + out * haze, 0, TAU);
    g.stroke();
  }
  g.globalAlpha = 1;
  g.save();
  g.beginPath();
  g.arc(x, y, r, 0, TAU);
  g.clip();
  g.fillStyle = '#0f3a66';
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.fillStyle = '#17538c';
  disc(g, x - r * 0.2, y - r * 0.3, r * 0.92);
  g.fillStyle = '#2e7a5c';
  for (const [lx, ly, wide, tall, tilt] of LANDS) oval(g, x + lx * r, y + ly * r, wide * r, tall * r, tilt);
  // The pole leans away to the upper left, as the real one does, so close up the horizon is all sea.
  g.fillStyle = '#9fc0d0';
  disc(g, x - r * 0.44, y - r * 0.87, r * 0.17);
  g.fillStyle = '#d6e8ee';
  disc(g, x - r * 0.46, y - r * 0.9, r * 0.1);
  g.fillStyle = '#dcecf2';
  g.globalAlpha = 0.55;
  for (const [sx, sy, wide, tall, tilt] of SWIRLS) oval(g, x + sx * r, y + sy * r, wide * r, tall * r, tilt);
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(3, 7, 15, 0.55)';
  disc(g, x + r * 0.6, y + r * 0.5, r * 1.05);
  g.restore();
}

// A cloud with a paler edge along its top, as if the moon were catching it.
function rimCloud(g, x, y, w, body, rim) {
  g.fillStyle = rim;
  paintCloud(g, x, y - 3, w);
  g.fillStyle = body;
  paintCloud(g, x, y, w);
}

function paintClouds(g, travel, metres) {
  const drift = calm ? 0 : clock;
  const high = during(metres, 150, 350, 800, 1100);
  if (high) {
    g.fillStyle = '#bfe0e0';
    g.globalAlpha = high * 0.09;
    for (const [x, y, w] of WISPS) {
      const wx = ((x + drift * 5) % (W + w)) - w / 2;
      const wy = ((y + travel * 0.14) % 1200) - 100;
      bar(g, wx - w / 2, wy, w, 5, 2.5);
      bar(g, wx - w * 0.3, wy + 9, w * 0.5, 3, 1.5);
    }
  }
  const bank = during(metres, 420, 620, 1400, 1700);
  if (bank) {
    g.globalAlpha = bank * 0.5;
    for (const [x, y, w] of FAR_BANK) {
      rimCloud(g, ((x + drift * 3) % (W + w)) - w / 2, ((y + travel * 0.16) % 1300) - 120, w, '#234f5e', '#3d7885');
    }
    g.globalAlpha = bank * 0.62;
    for (const [x, y, w] of BANK) {
      rimCloud(g, ((x + drift * 6) % (W + w)) - w / 2, ((y + travel * 0.3) % 1560) - 140, w, '#2e6670', '#5f9aa2');
    }
  }
  g.globalAlpha = 1;
  paintDeck(g, metres, drift);
}

// The deck of cloud the climb breaks through. It comes down the screen about 2 px for every metre
// climbed: first its dark underside, then the body of it, then the moonlit tops dropping away below.
function paintDeck(g, metres, drift) {
  const top = -480 + (metres - 620) * 2;
  if (metres < 600 || top - 70 > view.h) return;
  const under = top + 420;
  const slide = (x, speed) => ((x + drift * speed) % (W + 120)) - 60;
  g.fillStyle = '#1f4c58';
  for (const [x, r] of DECK_UNDER) disc(g, slide(x, 5), under - 8, r);
  g.fillStyle = '#8fc0c2';
  for (const [x, r] of DECK_TOP) disc(g, slide(x, 8), top + 20, r);
  g.fillStyle = '#2c616d';
  for (const [x, r] of DECK_TOP) disc(g, slide(x, 8), top + 25, r);
  g.fillRect(0, top + 25, W, 380);
  // Paler and darker patches inside the deck keep it from looking like a flat wall.
  g.fillStyle = '#346f7b';
  for (const [x, r] of DECK_UNDER) disc(g, slide(x + 40, 11), top + 150, r * 0.9);
  g.fillStyle = '#285966';
  for (const [x, r] of DECK_TOP) disc(g, slide(x + 20, 7), top + 300, r);
}

// One shape of a skyline, standing on the horizon at "base".
function paintPart(g, base, [kind, ...n]) {
  if (kind === 'box') {
    const [x, w, h, from = 0] = n;
    g.fillRect(x, base - h, w, h - from);
  } else if (kind === 'peak' || kind === 'dome') {
    const [x, w, h, rise, from = 0] = n;
    g.fillRect(x, base - h, w, h - from);
    g.beginPath();
    if (kind === 'peak') {
      g.moveTo(x, base - h);
      g.lineTo(x + w / 2, base - h - rise);
      g.lineTo(x + w, base - h);
    } else {
      g.ellipse(x + w / 2, base - h, w / 2, rise, 0, Math.PI, TAU);
    }
    g.fill();
  } else if (kind === 'onion') {
    const [x, r, h] = n;
    const neck = base - h;
    g.fillRect(x - r / 2, neck, r, h);
    g.beginPath();
    g.moveTo(x - r * 0.5, neck);
    g.bezierCurveTo(x - r * 1.5, neck - r * 0.9, x - r * 0.9, neck - r * 1.9, x, neck - r * 2.6);
    g.bezierCurveTo(x + r * 0.9, neck - r * 1.9, x + r * 1.5, neck - r * 0.9, x + r * 0.5, neck);
    g.fill();
  } else if (kind === 'eave') {
    const [x, w, h, rise, top] = n;
    paintEave(g, x, base - h, w, rise, top);
  } else if (kind === 'pagoda') {
    // Seven storeys, each a little narrower than the one below, and a finial.
    const [x, w, h] = n;
    const storey = (h - 60) / 7;
    for (let tier = 0; tier < 7; tier++) {
      const wide = w - tier * 3.2;
      const top = base - 40 - (tier + 1) * storey;
      g.fillRect(x - wide / 2, top, wide, tier ? storey : storey + 40);
      paintEave(g, x, top, wide + 14, 7, wide * 0.7);
    }
    g.fillRect(x - 1.5, base - h, 3, 22);
  } else if (kind === 'wall') {
    const [x, w, h] = n;
    g.fillRect(x, base - h, w, h);
    for (let along = x; along < x + w - 4; along += 9) g.fillRect(along, base - h - 6, 5, 6);
  } else if (kind === 'line') {
    const [x1, h1, x2, h2, sag, thick = 2] = n;
    g.lineWidth = thick;
    g.beginPath();
    g.moveTo(x1, base - h1);
    g.quadraticCurveTo((x1 + x2) / 2, base - (h1 + h2) / 2 + sag * 2, x2, base - h2);
    g.stroke();
  } else {
    g.beginPath();
    for (let i = 0; i < n.length; i += 2) g.lineTo(n[i], base - n[i + 1]);
    g.fill();
  }
}

// A swept roof: wide at the eaves, which turn up at the tips, and narrow at the ridge.
function paintEave(g, x, eaves, wide, rise, top) {
  g.beginPath();
  g.moveTo(x - wide / 2, eaves - 2.5);
  g.quadraticCurveTo(x - wide * 0.22, eaves - rise * 0.25, x - top / 2, eaves - rise);
  g.lineTo(x + top / 2, eaves - rise);
  g.quadraticCurveTo(x + wide * 0.22, eaves - rise * 0.25, x + wide / 2, eaves - 2.5);
  g.lineTo(x + wide / 2 - 3, eaves + 1.5);
  g.lineTo(x - wide / 2 + 3, eaves + 1.5);
  g.fill();
}

// A city along the horizon, in place of the mountains: its shapes, its lit windows and its lights.
function paintSkyline(g, base) {
  // Everything is drawn twice, the first time paler and a little higher, which leaves a line of
  // snow along every roof, spire and dome.
  for (const [colour, lift] of [['#8fb1b1', 1.7], ['#285966', 0]]) {
    g.fillStyle = colour;
    g.strokeStyle = colour;
    g.globalAlpha = lift ? 0.7 : 1;
    g.fillRect(0, base - 42 - lift, W, 42 + lift);
    for (const part of city.parts) paintPart(g, base - lift, part);
  }
  g.fillStyle = '#16414b';
  g.fillRect(0, base, W, view.h + 4 - base);
  g.fillStyle = C.gold;
  g.globalAlpha = 0.8;
  for (const [x, up] of city.lit) g.fillRect(x, base - up, 1.8, 2.6);
  g.globalAlpha = 1;
  for (const [x, up, r, colour] of city.glow) {
    g.fillStyle = colour;
    disc(g, x, base - up, r);
  }
}

function paintLand(g, travel) {
  const far = view.h * rest.title + 96 + travel * 0.22;
  if (city.parts) {
    if (far - 240 < view.h) paintSkyline(g, far);
  } else if (far - 170 < view.h) {
    g.fillStyle = '#16414b';
    g.beginPath();
    for (let i = 0; i < RANGE.length; i += 2) g.lineTo(RANGE[i], far - RANGE[i + 1]);
    g.lineTo(W, view.h + 4);
    g.lineTo(0, view.h + 4);
    g.closePath();
    g.fill();
    g.fillStyle = '#8fb1b1';
    g.globalAlpha = 0.5;
    for (let i = 0; i < RANGE.length; i += 2) {
      const x = RANGE[i];
      const peak = far - RANGE[i + 1];
      if (RANGE[i + 1] > 110) shape(g, [x, peak, x + 11, peak + 17, x + 4, peak + 12, x - 2, peak + 19, x - 10, peak + 15]);
    }
    g.fillStyle = C.gold;
    g.globalAlpha = 0.85;
    for (const [x, up] of VILLAGE) g.fillRect(x, far - up, 1.7, 1.7);
    g.globalAlpha = 1;
  }

  const base = view.h * rest.title + 160 + travel * 0.45;
  if (base - 130 < view.h) {
    g.fillStyle = '#0d2b34';
    g.beginPath();
    g.moveTo(0, base - 34);
    g.quadraticCurveTo(110, base - 78, 220, base - 40);
    g.quadraticCurveTo(320, base - 8, W, base - 56);
    g.lineTo(W, view.h + 4);
    g.lineTo(0, view.h + 4);
    g.closePath();
    g.fill();
    for (const [x, tall] of PINES) {
      const foot = base - 30;
      g.fillStyle = '#0a222a';
      for (let k = 0; k < 3; k++) {
        const top = foot - tall + k * tall * 0.26;
        const half = tall * (0.16 + k * 0.09);
        shape(g, [x, top, x + half, top + tall * 0.46, x - half, top + tall * 0.46]);
      }
      g.fillStyle = C.snowShade;
      shape(g, [x, foot - tall, x + tall * 0.07, foot - tall * 0.8, x - tall * 0.07, foot - tall * 0.8]);
    }
  }
}

// Mist in front of the ledges while the climb is inside the cloud deck.
function paintNear(g, travel, metres) {
  const mist = during(metres, 640, 760, 1120, 1260);
  if (!mist) return;
  g.fillStyle = '#a9cdd0';
  g.globalAlpha = mist * 0.17;
  for (const [x, y, w] of NEAR_BANK) {
    paintCloud(g, ((x + (calm ? 0 : clock) * 14) % (W + w)) - w / 2, ((y + travel * 1.35) % 2300) - 300, w);
  }
  g.globalAlpha = 1;
}

// Snow falls below the clouds. Far above them a thin drift of stardust takes its place.
// A wide playfield has every flake twice: where it is, and half a field and half a screen away.
function paintWeather(g, metres, twin = false) {
  const snow = 1 - ramp(metres, 850, 1300);
  const dust = ramp(metres, 2300, 3200);
  if (!snow && !dust) return;
  g.fillStyle = metres > 9300 ? '#ffe2a6' : C.snow;
  for (const f of flakes) {
    const x = twin ? field.lo + ((f.x - field.lo + field.across / 2) % field.across) : f.x;
    const y = twin ? (f.y + view.h / 2) % view.h : f.y;
    if (snow) {
      g.globalAlpha = (f.r > 1.8 ? 0.85 : 0.5) * snow;
      disc(g, x, y, f.r);
    } else {
      g.globalAlpha = 0.45 * dust;
      g.fillRect(x, y, f.r * 0.7, f.r * 0.7);
    }
  }
  g.globalAlpha = 1;
}

// The print finish lies over the picture: corners darkened a little to draw the eye to the middle,
// the bars beside the playfield on a wide screen, and paper grain. None of it moves, so it has a
// canvas of its own and is painted once per resize instead of over every frame.
function paintFinish() {
  const g = finishPen;
  finish.width = canvas.width;
  finish.height = canvas.height;
  g.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  const wash = g.createRadialGradient(W / 2, view.h * 0.46, view.h * 0.32, W / 2, view.h * 0.5, view.h * 0.78);
  wash.addColorStop(0, 'rgba(4, 12, 16, 0)');
  wash.addColorStop(1, 'rgba(4, 12, 16, 0.45)');
  g.save();
  g.translate(view.left, 0);
  g.scale(view.scale, view.scale);
  g.fillStyle = wash;
  g.fillRect(field.lo, 0, field.across, view.h);
  g.restore();
  const beside = view.left + field.lo * view.scale;
  if (beside > 0.5) {
    g.fillStyle = 'rgba(6, 20, 26, 0.62)';
    g.fillRect(0, 0, beside, view.sh);
    g.fillRect(view.sw - beside, 0, beside, view.sh);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = grain;
  g.fillRect(0, 0, finish.width, finish.height);
}

function paintStreet(g) {
  const cx = W / 2;

  g.fillStyle = '#0c2831';
  shape(g, [28, 96, 178, 201, 178, 900, -122, 900, -122, 201]);
  shape(g, [384, 70, 554, 189, 554, 900, 214, 900, 214, 189]);
  g.fillStyle = C.gold;
  g.fillRect(8, 190, 18, 24);
  g.fillRect(352, 170, 18, 24);

  g.fillStyle = '#33292c';
  g.fillRect(cx + 40, -30, 24, 60);
  g.fillStyle = C.snow;
  bar(g, cx + 36, -35, 32, 8, 4);
  g.fillStyle = C.cloudShade;
  for (let k = 0; k < 3; k++) {
    const rise = calm ? k * 22 : (clock * 9 + k * 22) % 66;
    g.globalAlpha = 0.5 * (1 - rise / 66);
    disc(g, cx + 52 + Math.sin(clock * 0.9 + k) * 4, -46 - rise, 6 + rise * 0.12);
  }
  g.globalAlpha = 1;

  g.fillStyle = '#0a2029';
  shape(g, [cx - 78, 2, cx + 78, 2, cx + 152, 106, cx - 152, 106]);
  g.strokeStyle = '#12333d';
  g.lineWidth = 2;
  g.beginPath();
  for (const y of [34, 64, 92]) {
    const half = 78 + (y - 2) * (74 / 104) - 8;
    g.moveTo(cx - half, y);
    g.lineTo(cx + half, y);
  }
  g.stroke();

  g.fillStyle = C.snowShade;
  bar(g, cx - 76, 0, 156, 9, 4.5);
  g.fillStyle = C.snow;
  bar(g, cx - 78, -3, 156, 9, 4.5);
  disc(g, cx - 40, 6, 3);
  disc(g, cx + 12, 6.5, 3.4);
  disc(g, cx + 50, 6, 2.6);
  bar(g, cx - 156, 100, 312, 9, 4.5);

  g.fillStyle = '#113039';
  g.fillRect(cx - 136, 109, 272, 800);
  // A string of fairy lights hangs in loops under the eaves, and every bulb twinkles in its own time.
  g.strokeStyle = C.ink;
  g.lineWidth = 1;
  g.beginPath();
  for (let k = 0; k < 4; k++) {
    g.moveTo(cx - 132 + k * 66, 111);
    g.quadraticCurveTo(cx - 99 + k * 66, 126, cx - 66 + k * 66, 111);
  }
  g.stroke();
  for (let n = 0; n < 16; n++) {
    const along = (n % 4) / 4 + 0.125;
    g.fillStyle = FAIRY[n % 4];
    g.globalAlpha = calm ? 1 : 0.6 + 0.4 * Math.sin(clock * 2.4 + n * 1.9);
    disc(g, cx - 132 + (Math.floor(n / 4) + along) * 66, 111 + 30 * along * (1 - along) + 2, 2.3);
  }
  g.globalAlpha = 1;
  for (const x of [cx - 98, cx + 50]) {
    g.fillStyle = C.gold;
    g.fillRect(x, 138, 48, 58);
    g.fillStyle = C.ink;
    g.fillRect(x + 22, 138, 4, 58);
    g.fillRect(x, 164, 48, 4);
    g.fillStyle = C.snow;
    bar(g, x - 4, 194, 56, 7, 3.5);
  }

  g.fillStyle = '#c3d3cf';
  g.beginPath();
  g.moveTo(0, 268);
  g.quadraticCurveTo(120, 244, 230, 262);
  g.quadraticCurveTo(330, 278, W, 250);
  g.lineTo(W, 1000);
  g.lineTo(0, 1000);
  g.closePath();
  g.fill();
  // The lit windows throw two warm patches on the snow.
  g.fillStyle = C.gold;
  g.globalAlpha = 0.16;
  oval(g, cx - 82, 286, 44, 9, -0.04);
  oval(g, cx + 82, 284, 44, 9, 0.04);
  g.globalAlpha = 1;
}

// Fills several discs as one shape, so a see-through cloud has no darker patches where they overlap.
function puffs(g, x, y, r, list) {
  g.beginPath();
  for (const [dx, dy, size] of list) {
    g.moveTo(x + (dx + size) * r, y + dy * r);
    g.arc(x + dx * r, y + dy * r, size * r, 0, TAU);
  }
  g.fill();
}

function paintCloud(g, x, y, w) {
  const r = w * 0.2;
  const left = x - w / 2;
  const top = y + r - 2;
  const low = top + r + 4;
  const round = r / 2 + 2;
  g.beginPath();
  g.moveTo(left + round, top);
  g.arcTo(left + w, top, left + w, low, round);
  g.arcTo(left + w, low, left, low, round);
  g.arcTo(left, low, left, top, round);
  g.arcTo(left, top, left + w, top, round);
  g.closePath();
  for (const [dx, dy, size] of [[-0.22, r - 1, 0.82], [0.04, r - 4, 1], [0.27, r, 0.78]]) {
    g.moveTo(x + w * dx + r * size, y + dy);
    g.arc(x + w * dx, y + dy, r * size, 0, TAU);
  }
  g.fill();
}

function paintLedge(g, p) {
  const y = p.y + p.dip * 3;
  const left = p.x - p.w / 2;
  if (p.type === 'cloud') {
    g.fillStyle = C.cloudShade;
    paintCloud(g, p.x + 2, y + 4, p.w);
    g.fillStyle = C.cloud;
    paintCloud(g, p.x, y, p.w);
  } else if (p.type === 'storm') {
    // Dark, with its silver lining showing along the top.
    g.fillStyle = C.stormShade;
    paintCloud(g, p.x + 2, y + 4, p.w);
    g.fillStyle = C.snow;
    paintCloud(g, p.x, y - 1.6, p.w);
    g.fillStyle = C.storm;
    paintCloud(g, p.x, y, p.w);
  } else if (p.type === 'ice') {
    const pane = (l, top) => shape(g, [l + 3, top, l + p.w - 2, top, l + p.w, top + 4, l + p.w - 6, top + 10, l + 5, top + 10, l, top + 5]);
    g.fillStyle = C.iceShade;
    pane(left + 2, y + 3);
    g.fillStyle = C.ice;
    pane(left, y);
    g.strokeStyle = C.iceShade;
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(p.x + 5, y);
    g.lineTo(p.x - 2, y + 5);
    g.lineTo(p.x + 4, y + 10);
    g.stroke();
  } else if (p.type === 'chime') {
    g.fillStyle = C.goldShade;
    bar(g, left + 2, y + 3, p.w, 9, 4.5);
    g.fillStyle = C.gold;
    bar(g, left, y, p.w, 9, 4.5);
    g.fillStyle = C.ink;
    disc(g, left + 8, y + 4.5, 1.6);
    disc(g, left + p.w - 8, y + 4.5, 1.6);
  } else {
    g.fillStyle = C.slab;
    bar(g, left + 4, y + 4, p.w - 8, 11, 5);
    g.fillStyle = C.snowShade;
    bar(g, left + 1.5, y + 1, p.w, 8, 4);
    g.fillStyle = C.snow;
    bar(g, left, y - 2, p.w, 8, 4);
    disc(g, left + p.w * 0.22, y + 5, 2.6);
    disc(g, left + p.w * 0.56, y + 5.5, 3);
    disc(g, left + p.w * 0.8, y + 5, 2.3);
  }
}

// A four-pointed glint.
function glint(g, x, y, r) {
  shape(g, [x, y - r * 2.2, x + r * 0.5, y - r * 0.5, x + r * 2.2, y, x + r * 0.5, y + r * 0.5, x, y + r * 2.2, x - r * 0.5, y + r * 0.5, x - r * 2.2, y, x - r * 0.5, y - r * 0.5]);
}

// Two berries on a holly leaf, at any size and in any two colours.
function paintSprig(g, x, y, k, colour, shade) {
  g.fillStyle = C.holly;
  oval(g, x + 5 * k, y - 6 * k, 6 * k, 3 * k, -0.6);
  g.fillStyle = shade;
  disc(g, x - 1.8 * k, y + 1.4 * k, 5 * k);
  g.fillStyle = colour;
  disc(g, x - 3 * k, y, 5 * k);
  disc(g, x + 4 * k, y + 2 * k, 4.4 * k);
  g.fillStyle = C.snow;
  disc(g, x - 4.6 * k, y - 1.6 * k, 1.2 * k);
}

function paintBerry(g, it) {
  const y = it.y + Math.sin(clock * 3 + it.bob) * 2.5;
  if (!it.gold) {
    paintSprig(g, it.x, y, 1, C.berry, C.berryShade);
    return;
  }
  // The golden berry sits in a glow and turns a glint over, so it catches the eye on the way past.
  const beat = Math.sin(clock * 4 + it.bob);
  const fade = g.globalAlpha;
  g.globalAlpha = fade * 0.3;
  g.fillStyle = C.gold;
  disc(g, it.x + 0.5, y + 1, 17 + beat * 2);
  g.globalAlpha = fade;
  paintSprig(g, it.x, y, 1.3, C.gold, C.goldShade);
  g.fillStyle = C.snow;
  glint(g, it.x + 9, y - 8, 2 + 1.6 * Math.abs(beat));
}

// A power-up floats inside a gold ring, so it reads as something to grab whatever it is.
function paintFind(g, it) {
  const y = it.y + Math.sin(clock * 2 + it.bob) * 4;
  const turn = clock * 2.6 + it.bob;
  g.strokeStyle = C.gold;
  g.lineWidth = 2;
  g.beginPath();
  g.arc(it.x, y, 15 + Math.sin(clock * 4) * 1.5, 0, TAU);
  g.stroke();
  // A glint runs round the ring.
  g.fillStyle = C.snow;
  disc(g, it.x + Math.cos(turn) * 15, y + Math.sin(turn) * 15, 1.8);
  paintToken(g, it.kind, it.x, y);
}

// The picture of each power-up, as it floats on the climb and as it sits in the wardrobe.
function paintToken(g, kind, x, y) {
  g.save();
  g.translate(x, y);
  if (kind === 'feather') {
    g.rotate(-0.6);
    g.fillStyle = C.gold;
    oval(g, 0, -1, 4.5, 9.5, 0);
    g.strokeStyle = C.goldShade;
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(0, -9);
    g.lineTo(0, 12);
    g.stroke();
  } else if (kind === 'cane') {
    g.rotate(0.3);
    for (const [colour, dash] of [[C.snow, []], [C.berry, [2.6, 3.4]]]) {
      g.strokeStyle = colour;
      g.lineWidth = 4.4;
      g.lineCap = dash.length ? 'butt' : 'round';
      g.setLineDash(dash);
      g.beginPath();
      g.moveTo(-2.5, 10);
      g.lineTo(-2.5, -3.5);
      g.arc(2, -3.5, 4.5, Math.PI, 0);
      g.lineTo(6.5, -1.5);
      g.stroke();
    }
    g.setLineDash([]);
  } else if (kind === 'gift') {
    g.fillStyle = C.berryShade;
    bar(g, -8, -3, 16, 12, 2);
    g.fillStyle = C.berry;
    bar(g, -9.5, -6.5, 19, 5.5, 1.5);
    g.fillStyle = C.gold;
    g.fillRect(-1.8, -6.5, 3.6, 15.5);
    oval(g, -4, -9, 4, 2.6, 0.5);
    oval(g, 4, -9, 4, 2.6, -0.5);
  } else {
    g.fillStyle = C.goldShade;
    shape(g, [-7.5, 11, 7.5, 11, 5.5, 6, -5.5, 6]);
    g.fillStyle = C.ice;
    disc(g, 0, -1, 9.5);
    g.fillStyle = C.holly;
    shape(g, [0, -8, 4.6, 4.5, -4.6, 4.5]);
    g.fillStyle = C.snow;
    disc(g, -5.5, -2, 1);
    disc(g, 5, -4.5, 1);
    disc(g, 5.5, 3, 1);
    disc(g, -4.5, 5, 1);
  }
  g.restore();
}

// A power-up about to wear off blinks for its last two seconds.
const fading = (left) => left < 2 && !calm && Math.floor(clock * 8) % 2 === 1;

// While a candy cane is pulling, a striped ring round the climber shows how long is left.
function paintPull(g) {
  if (fading(player.pull)) return;
  // The stripes run round the ring like a turning stick of rock.
  g.lineDashOffset = calm ? 0 : -clock * 36;
  for (const [colour, dash] of [[C.snow, []], [C.berry, [4, 5]]]) {
    g.strokeStyle = colour;
    g.lineWidth = 3;
    g.lineCap = 'butt';
    g.setLineDash(dash);
    g.beginPath();
    g.arc(0, -15, 28, -Math.PI / 2, -Math.PI / 2 + (player.pull / kit('cane')) * TAU);
    g.stroke();
  }
  g.setLineDash([]);
  g.lineDashOffset = 0;
}

// The snow globe is a glass ball round the climber, with a little snow falling inside it. Its rim
// runs down like a clock as the globe wears off.
function paintGlass(g) {
  if (fading(player.globe)) return;
  // A globe just caught swells onto the climber, a little too far, and settles.
  const since = Math.min(1, (kit('globe') - player.globe) / 0.3);
  const swell = 1 + 2.7 * (since - 1) ** 3 + 1.7 * (since - 1) ** 2;
  g.save();
  g.translate(0, -15);
  g.scale(swell, swell);
  g.translate(0, 15);
  g.fillStyle = 'rgba(191, 227, 234, 0.16)';
  disc(g, 0, -15, 23);
  g.strokeStyle = 'rgba(243, 238, 226, 0.25)';
  g.lineWidth = 1.6;
  g.beginPath();
  g.arc(0, -15, 23, 0, TAU);
  g.stroke();
  g.strokeStyle = 'rgba(243, 238, 226, 0.9)';
  g.lineWidth = 2.2;
  g.beginPath();
  g.arc(0, -15, 23, -Math.PI / 2, -Math.PI / 2 + (player.globe / kit('globe')) * TAU);
  g.stroke();
  g.strokeStyle = C.snow;
  g.lineWidth = 2.4;
  g.lineCap = 'round';
  g.beginPath();
  g.arc(0, -15, 18.5, Math.PI * 1.1, Math.PI * 1.42);
  g.stroke();
  g.fillStyle = C.snow;
  for (let k = 0; k < 5; k++) {
    const fall = calm ? k * 7 : (clock * 10 + k * 7) % 34;
    disc(g, Math.sin(k * 2.4 + clock * 0.7) * 13, -32 + fall, 1);
  }
  g.restore();
}

function paintFrostling(g, f) {
  const spikes = (cx, cy) => {
    g.beginPath();
    for (let k = 0; k < 12; k++) {
      const reach = k % 2 ? 7.5 : 15;
      const angle = (calm ? 0 : f.spin) + (k * Math.PI) / 6;
      g.lineTo(cx + Math.cos(angle) * reach, cy + Math.sin(angle) * reach);
    }
    g.closePath();
    g.fill();
  };
  g.fillStyle = C.frostShade;
  spikes(f.x + 2, f.y + 3);
  g.fillStyle = C.frost;
  spikes(f.x, f.y);
  g.fillStyle = C.ink;
  disc(g, f.x - 3.5, f.y - 0.5, 1.5);
  disc(g, f.x + 3.5, f.y - 0.5, 1.5);
  g.strokeStyle = C.ink;
  g.lineWidth = 1.3;
  g.beginPath();
  g.moveTo(f.x - 6.5, f.y - 4.5);
  g.lineTo(f.x - 2, f.y - 2.8);
  g.moveTo(f.x + 6.5, f.y - 4.5);
  g.lineTo(f.x + 2, f.y - 2.8);
  g.stroke();
  g.beginPath();
  g.arc(f.x, f.y + 5.5, 2.6, Math.PI * 1.15, Math.PI * 1.85);
  g.stroke();
}

function paintHat(g, id, x, y) {
  if (id === 'no-hat') return;
  g.save();
  g.translate(x, y);
  g.rotate(0.14);
  if (id === 'acorn') {
    g.fillStyle = '#8a5a2b';
    g.beginPath();
    g.ellipse(0, 0, 10, 6.5, 0, Math.PI, 0);
    g.closePath();
    g.fill();
    g.strokeStyle = '#5d3a17';
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(0, -6.5);
    g.lineTo(1.5, -10.5);
    g.stroke();
  } else if (id === 'bobble') {
    g.fillStyle = C.holly;
    g.beginPath();
    g.ellipse(0, 0, 9.5, 9.5, 0, Math.PI, 0);
    g.closePath();
    g.fill();
    g.fillStyle = C.snow;
    g.fillRect(-10, -3, 20, 4.2);
    disc(g, 0, -10.5, 3.6);
  } else if (id === 'topper') {
    g.fillStyle = C.ink;
    g.fillRect(-11.5, -2.4, 23, 3);
    g.fillRect(-7, -15, 14, 13);
    g.fillStyle = C.gold;
    g.fillRect(-7, -6.4, 14, 3);
  } else if (id === 'holly') {
    g.fillStyle = C.holly;
    oval(g, -5, -3, 6.5, 3, -0.5);
    oval(g, 5, -3, 6.5, 3, 0.5);
    g.fillStyle = C.berry;
    disc(g, -1.8, -1.6, 2.3);
    disc(g, 2, -1.3, 2.3);
    disc(g, 0.2, -4.2, 2.1);
  } else if (id === 'santa') {
    g.fillStyle = C.robin;
    shape(g, [-8.5, -1, 8.5, -1, 5, -9, -3, -14, -11, -11]);
    g.fillStyle = C.snow;
    bar(g, -9.5, -3, 19, 4.6, 2.3);
    disc(g, -11.5, -11, 3);
  } else if (id === 'antlers') {
    g.strokeStyle = '#8a5a2b';
    g.lineWidth = 2.2;
    g.lineCap = 'round';
    g.beginPath();
    for (const side of [-1, 1]) {
      g.moveTo(side * 4, 0);
      g.lineTo(side * 7, -9);
      g.lineTo(side * 5.5, -14);
      g.moveTo(side * 6.3, -6);
      g.lineTo(side * 11, -9.5);
      g.moveTo(side * 6.8, -10);
      g.lineTo(side * 10.5, -14);
    }
    g.stroke();
  } else if (id === 'star') {
    g.fillStyle = C.goldShade;
    g.fillRect(-1.3, -2.5, 2.6, 3);
    g.fillStyle = C.gold;
    g.beginPath();
    for (let k = 0; k < 10; k++) {
      const reach = k % 2 ? 3.6 : 8.5;
      const angle = -Math.PI / 2 + (k * Math.PI) / 5;
      g.lineTo(Math.cos(angle) * reach, -9.5 + Math.sin(angle) * reach);
    }
    g.closePath();
    g.fill();
  } else if (id === 'crown') {
    g.fillStyle = C.gold;
    shape(g, [-9, 0, -9, -9, -4.5, -4.5, 0, -10, 4.5, -4.5, 9, -9, 9, 0]);
  }
  g.restore();
}

function paintScarf(g, id, [dx, lift, wide]) {
  const scarf = SCARVES.find((piece) => piece.id === id) || SCARVES[0];
  if (!scarf.colours) return;
  const flutter = calm ? 0 : Math.sin(clock * 10) * 2;
  const left = dx - 12 * wide;
  const right = dx + 13 * wide;
  const tail = [dx - 10 * wide - 9, -5 - lift + flutter, dx - 10 * wide - 15, -7 - lift - flutter];
  const wrap = () => {
    g.beginPath();
    g.moveTo(left, -9 - lift);
    g.quadraticCurveTo(dx + 1, -3.5 - lift, right, -9.5 - lift);
    g.moveTo(dx - 10 * wide, -8 - lift);
    g.lineTo(tail[0], tail[1]);
    g.lineTo(tail[2], tail[3]);
    g.stroke();
  };
  if (scarf.bulbs) {
    // Fairy lights: a thin flex with bulbs strung along it, each twinkling in its own time.
    g.strokeStyle = C.ink;
    g.lineWidth = 1.6;
    g.lineCap = 'round';
    wrap();
    const bulbs = [0.08, 0.3, 0.5, 0.7, 0.92].map((t) => [
      lerp(lerp(left, dx + 1, t), lerp(dx + 1, right, t), t),
      lerp(lerp(-9, -3.5, t), lerp(-3.5, -9.5, t), t) - lift
    ]);
    bulbs.push([tail[0], tail[1]], [tail[2], tail[3]]);
    bulbs.forEach(([x, y], n) => {
      g.fillStyle = FAIRY[n % 4];
      g.globalAlpha = calm ? 1 : 0.65 + 0.35 * Math.sin(clock * 3 + n * 1.9);
      disc(g, x, y, 1.9);
    });
    g.globalAlpha = 1;
    return;
  }
  [[scarf.colours[0], 'round', []], [scarf.colours[1], 'butt', [2.5, 5]]].forEach(([colour, cap, dash]) => {
    g.strokeStyle = colour;
    g.lineWidth = 5;
    g.lineCap = cap;
    g.setLineDash(dash);
    wrap();
  });
  g.setLineDash([]);
}

// Paints whichever climber is asked for, in whatever they have on.
function paintClimber(g, on, frozen, beat) {
  const hero = HEROES.find((one) => one.id === on.hero) || HEROES[0];
  hero.paint(g, on, hero, frozen, beat);
}

function paintRobin(g, on, hero, frozen, beat) {
  const coat = frozen ? ICE : [C.umber, C.umberDark, C.robin, C.snow];

  g.strokeStyle = C.ink;
  g.lineWidth = 1.7;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-3, -3);
  g.lineTo(-3, 0);
  g.lineTo(0, 0);
  g.moveTo(4, -3);
  g.lineTo(4, 0);
  g.lineTo(7, 0);
  g.stroke();

  g.fillStyle = coat[1];
  shape(g, [-11, -17, -23, -23, -20, -12]);
  g.fillStyle = coat[0];
  disc(g, 0, -14, 14);

  g.save();
  g.beginPath();
  g.arc(0, -14, 14, 0, TAU);
  g.clip();
  g.fillStyle = coat[3];
  oval(g, 3, -7.5, 9, 6.4, 0);
  g.fillStyle = coat[2];
  oval(g, 5.5, -15.5, 9.5, 8.6, 0);
  g.restore();

  paintScarf(g, on.scarf, hero.neck);

  g.fillStyle = coat[1];
  oval(g, -5, -13 - beat * 4, 7.6, 5, -0.35 - beat * 1.1);

  g.fillStyle = C.ink;
  disc(g, 8.5, -19.5, 2);
  g.fillStyle = C.snow;
  disc(g, 9.1, -20.1, 0.7);
  g.fillStyle = C.gold;
  shape(g, [13, -18, 19.5, -15.8, 13, -13.6]);

  paintHat(g, on.hat, hero.crown[0], hero.crown[1]);
}

function paintFather(g, on, hero, frozen, beat) {
  const suit = frozen ? ['#9cc7d3', '#7fb0be'] : [C.robin, '#b3351f'];

  g.fillStyle = frozen ? '#7fb0be' : '#8a5a2b';
  oval(g, -12, -17, 7, 8.5, 0.25);
  g.fillStyle = C.ink;
  oval(g, -4, -1.5, 4.6, 2.6, 0);
  oval(g, 5, -1.5, 4.6, 2.6, 0);

  g.fillStyle = suit[0];
  disc(g, 0, -14, 13.5);
  g.save();
  g.beginPath();
  g.arc(0, -14, 13.5, 0, TAU);
  g.clip();
  g.fillStyle = C.snow;
  g.fillRect(-14, -5.5, 28, 6);
  g.fillStyle = C.ink;
  g.fillRect(-14, -13, 28, 3.6);
  g.restore();
  g.fillStyle = C.gold;
  g.fillRect(4.5, -14.2, 6, 6);
  g.fillStyle = C.ink;
  g.fillRect(6.3, -12.4, 2.4, 2.4);

  paintScarf(g, on.scarf, hero.neck);

  g.save();
  g.translate(-2, -15 - beat * 3);
  g.rotate(-0.4 + beat * 1.5);
  g.fillStyle = suit[1];
  oval(g, -4, 0, 6, 3.3, 0);
  g.fillStyle = C.ink;
  disc(g, -9.5, 0, 2.6);
  g.restore();

  g.fillStyle = frozen ? '#cfe9ef' : '#f0c4a0';
  disc(g, 4.5, -25, 6.8);
  g.fillStyle = C.snow;
  oval(g, 6.5, -20.5, 7.6, 5.8, 0);
  oval(g, 9, -23, 3.4, 1.7, 0);
  g.fillStyle = frozen ? '#9cc7d3' : '#e2806f';
  disc(g, 11, -24.6, 1.7);
  g.fillStyle = C.ink;
  disc(g, 7.6, -26.6, 1.2);

  if (on.hat !== 'no-hat') {
    paintHat(g, on.hat, hero.crown[0], hero.crown[1]);
    return;
  }
  g.fillStyle = suit[0];
  shape(g, [-2.5, -30, 11, -29.5, 3, -40, -8, -37]);
  g.fillStyle = C.snow;
  bar(g, -3.5, -31.6, 15.5, 3.8, 1.9);
  disc(g, -9, -36.5, 3);
}

function paintSnowman(g, on, hero, frozen, beat) {
  const coat = frozen ? [ICE[2], ICE[0]] : [C.snow, C.snowShade];

  g.strokeStyle = frozen ? ICE[1] : C.umberDark;
  g.lineWidth = 1.6;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-8, -13);
  g.lineTo(-16, -18 - beat * 6);
  g.moveTo(-13.5, -16.5 - beat * 4.5);
  g.lineTo(-16.5, -14 - beat * 4);
  g.moveTo(8, -12);
  g.lineTo(15, -15);
  g.stroke();

  g.fillStyle = coat[1];
  disc(g, 1.5, -9.5, 10.5);
  disc(g, 2.7, -24.4, 7.5);
  g.fillStyle = coat[0];
  disc(g, 0, -10.5, 10.5);
  disc(g, 1.5, -25, 7.5);

  paintScarf(g, on.scarf, hero.neck);

  g.fillStyle = C.ink;
  disc(g, 4.5, -13, 1.3);
  disc(g, 5, -7.5, 1.3);
  disc(g, 3.4, -27, 1.1);
  disc(g, 7, -26.8, 1.1);
  g.fillStyle = frozen ? ICE[1] : '#e8862c';
  shape(g, [7.6, -25.4, 15, -23.6, 7.6, -22.6]);

  paintHat(g, on.hat, hero.crown[0], hero.crown[1]);
}

function paintPenguin(g, on, hero, frozen, beat) {
  const coat = frozen ? [ICE[0], ICE[1], ICE[3]] : ['#4a6478', '#33495a', C.snow];

  g.fillStyle = frozen ? ICE[2] : C.gold;
  oval(g, -4, -1.2, 4.6, 2.2, 0);
  oval(g, 5, -1.2, 4.6, 2.2, 0);

  g.fillStyle = coat[0];
  oval(g, 0, -14.5, 12, 14, 0);
  g.save();
  g.beginPath();
  g.ellipse(0, -14.5, 12, 14, 0, 0, TAU);
  g.clip();
  g.fillStyle = coat[2];
  oval(g, 4.5, -9.5, 8.5, 10.5, 0);
  oval(g, 6.5, -21, 5.2, 4.6, 0);
  g.restore();

  paintScarf(g, on.scarf, hero.neck);

  g.save();
  g.translate(-6, -19);
  g.rotate(0.3 + beat * 1.2);
  g.fillStyle = coat[1];
  oval(g, -1.5, 7, 3.8, 8.5, 0);
  g.restore();

  g.fillStyle = C.ink;
  disc(g, 7.2, -21.6, 1.7);
  g.fillStyle = C.snow;
  disc(g, 7.7, -22.2, 0.6);
  g.fillStyle = frozen ? ICE[2] : C.gold;
  shape(g, [11, -20.4, 17.5, -18.4, 11, -16.6]);

  paintHat(g, on.hat, hero.crown[0], hero.crown[1]);
}

function paintReindeer(g, on, hero, frozen, beat) {
  const coat = frozen ? [ICE[0], ICE[1], ICE[3]] : ['#9a6a3c', '#6f4a26', '#e6d3b3'];

  g.fillStyle = coat[1];
  for (const x of [-7.5, -2.5, 3, 7.5]) g.fillRect(x - 1.3, -4, 2.6, 4 - beat * 2);
  g.fillStyle = coat[2];
  disc(g, -12, -15, 2.6);

  g.fillStyle = coat[0];
  disc(g, 0, -13.5, 11.5);
  g.save();
  g.beginPath();
  g.arc(0, -13.5, 11.5, 0, TAU);
  g.clip();
  g.fillStyle = coat[2];
  oval(g, 2.5, -6.5, 8.5, 5, 0);
  g.restore();

  paintScarf(g, on.scarf, hero.neck);

  g.strokeStyle = coat[1];
  g.lineWidth = 1.9;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(4.5, -30);
  g.lineTo(1.5, -37.5);
  g.lineTo(-2.5, -40);
  g.moveTo(2.4, -35);
  g.lineTo(5.5, -39.5);
  g.moveTo(9.5, -30.5);
  g.lineTo(11.5, -37.5);
  g.lineTo(9.5, -41.5);
  g.moveTo(11, -35.5);
  g.lineTo(15, -38.5);
  g.stroke();

  g.fillStyle = coat[1];
  oval(g, 1.5, -28.5 - beat, 3.8, 2.1, -0.7 - beat * 0.6);
  g.fillStyle = coat[0];
  disc(g, 7, -24, 7.5);
  g.fillStyle = coat[2];
  oval(g, 12.5, -21.8, 4.6, 3.6, 0);
  g.fillStyle = frozen ? ICE[1] : '#3d2a1a';
  disc(g, 16, -22.6, 1.9);
  g.fillStyle = C.ink;
  disc(g, 9.6, -26, 1.3);

  paintHat(g, on.hat, hero.crown[0], hero.crown[1]);
}

function paintElf(g, on, hero, frozen, beat) {
  const suit = frozen ? [ICE[0], ICE[1]] : [C.holly, '#1f5a39'];
  const skin = frozen ? ICE[2] : '#f0c4a0';

  g.fillStyle = suit[1];
  oval(g, -4, -1.5, 4.6, 2.6, 0);
  oval(g, 5, -1.5, 4.6, 2.6, 0);
  shape(g, [8, -3.4, 13.5, -5.5, 9.8, -0.4]);

  g.fillStyle = suit[0];
  disc(g, 0, -13, 12);
  g.save();
  g.beginPath();
  g.arc(0, -13, 12, 0, TAU);
  g.clip();
  g.fillStyle = C.ink;
  g.fillRect(-13, -12.4, 26, 3.4);
  g.restore();
  g.fillStyle = C.gold;
  g.fillRect(4.2, -13.5, 5.6, 5.6);
  g.fillStyle = C.ink;
  g.fillRect(5.8, -11.9, 2.4, 2.4);

  paintScarf(g, on.scarf, hero.neck);

  g.save();
  g.translate(-2, -14.5 - beat * 3);
  g.rotate(-0.4 + beat * 1.5);
  g.fillStyle = suit[1];
  oval(g, -4, 0, 5.6, 3.1, 0);
  g.fillStyle = skin;
  disc(g, -9, 0, 2.4);
  g.restore();

  g.fillStyle = skin;
  shape(g, [-0.5, -25.5, -6.5, -29, 0.5, -21.5]);
  disc(g, 4.5, -23.5, 6.6);
  g.fillStyle = frozen ? ICE[0] : '#e2806f';
  disc(g, 9.2, -21.8, 1.6);
  g.fillStyle = C.ink;
  disc(g, 7.4, -24.8, 1.2);

  if (on.hat !== 'no-hat') {
    paintHat(g, on.hat, hero.crown[0], hero.crown[1]);
    return;
  }
  g.fillStyle = suit[0];
  shape(g, [-2.4, -27.6, 11.2, -27, 6.5, -40.5]);
  g.fillStyle = frozen ? suit[1] : C.berry;
  bar(g, -3.2, -29.4, 15, 3.4, 1.7);
  g.fillStyle = frozen ? ICE[3] : C.gold;
  disc(g, 6.5, -41.3, 2.1);
}

function paintGinger(g, on, hero, frozen, beat) {
  const dough = frozen ? ICE[0] : '#b8733a';
  const icing = frozen ? ICE[3] : C.snow;
  const wave = beat * 6;

  g.strokeStyle = dough;
  g.lineWidth = 6.4;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-4.5, -5);
  g.lineTo(-6, -3.2);
  g.moveTo(4.5, -5);
  g.lineTo(6, -3.2);
  g.moveTo(-6, -15.5);
  g.lineTo(-13.5, -17.5 - wave);
  g.moveTo(6, -15);
  g.lineTo(13.5, -16.5);
  g.stroke();
  g.fillStyle = dough;
  oval(g, 0, -11.5, 8.6, 9, 0);
  disc(g, 2, -25, 7.2);

  paintScarf(g, on.scarf, hero.neck);

  g.strokeStyle = icing;
  g.lineWidth = 1.2;
  g.beginPath();
  g.moveTo(-10.4, -14.2 - wave * 0.75);
  g.lineTo(-11.6, -19.4 - wave * 0.75);
  g.moveTo(10.6, -13.6);
  g.lineTo(11.4, -18.8);
  g.moveTo(-8.6, -3.6);
  g.lineTo(-3.2, -1.2);
  g.moveTo(8.6, -3.6);
  g.lineTo(3.2, -1.2);
  g.stroke();
  g.beginPath();
  g.arc(3.8, -24.2, 3.1, Math.PI * 0.15, Math.PI * 0.85);
  g.stroke();
  g.fillStyle = icing;
  disc(g, 1.3, -26.8, 1.25);
  disc(g, 5.8, -26.6, 1.25);
  g.fillStyle = frozen ? ICE[1] : C.berry;
  disc(g, 1.5, -13.8, 1.7);
  g.fillStyle = frozen ? ICE[1] : C.holly;
  disc(g, 1.5, -8.6, 1.7);

  paintHat(g, on.hat, hero.crown[0], hero.crown[1]);
}

function paintPudding(g, on, hero, frozen, beat) {
  const coat = frozen ? [ICE[1], ICE[0], ICE[3]] : ['#5c3826', '#3f2518', C.snow];

  g.fillStyle = coat[1];
  oval(g, -4.5, -1.3 - beat * 2, 4.4, 2.4, 0);
  oval(g, 5, -1.3, 4.4, 2.4, 0);

  g.fillStyle = coat[0];
  disc(g, 0, -14, 13);
  g.save();
  g.beginPath();
  g.arc(0, -14, 13, 0, TAU);
  g.clip();
  g.fillStyle = coat[1];
  for (const [x, y] of [[-8, -9], [-3.5, -5], [3.5, -3.6], [10, -7.5], [-10, -14.5]]) disc(g, x, y, 1.2);
  // Brandy butter runs down from the top in three drips.
  g.fillStyle = coat[2];
  g.fillRect(-14, -28, 28, 9.5);
  disc(g, -7.5, -18.5, 3.3);
  disc(g, 0.5, -18, 4);
  disc(g, 8, -18.6, 3.1);
  g.restore();

  paintScarf(g, on.scarf, hero.neck);

  g.fillStyle = C.snow;
  disc(g, 4.8, -13.4, 2.1);
  disc(g, 9.8, -13.6, 2.1);
  g.fillStyle = C.ink;
  disc(g, 5.5, -13.4, 1);
  disc(g, 10.5, -13.6, 1);
  g.strokeStyle = C.snow;
  g.lineWidth = 1.1;
  g.lineCap = 'round';
  g.beginPath();
  g.arc(7.4, -11, 2.6, Math.PI * 0.15, Math.PI * 0.85);
  g.stroke();

  // With no hat on, the pudding wears its sprig of holly.
  paintHat(g, on.hat === 'no-hat' ? 'holly' : on.hat, hero.crown[0], hero.crown[1]);
}

function paintHero(g, x, y) {
  const tall = 1 + clamp(Math.abs(player.vy) / 3600, 0, 0.16) - player.squash * 0.25;
  const beat = Math.sin(player.wing * Math.PI);

  g.save();
  g.translate(x, y);
  g.save();
  if (player.spin) {
    g.translate(0, -14);
    g.rotate(player.spin);
    g.translate(0, 14);
  }
  g.scale(player.face / Math.sqrt(tall), tall);
  g.fillStyle = 'rgba(10, 28, 34, 0.3)';
  disc(g, 2.5, -11, 14);
  if (player.lift > 0 || player.ride || glory) paintWings(g);
  paintClimber(g, look(), player.frozen, beat);
  g.restore();
  if (player.pull > 0) paintPull(g);
  if (player.globe > 0) paintGlass(g);
  g.restore();
}

// Golden wings, for as long as a feather or a ride is carrying the climber up.
function paintWings(g) {
  const beat = calm ? 0.2 : Math.sin(clock * 28);
  for (const side of [-1, 1]) {
    g.save();
    g.translate(2.5 + side * 8, -16);
    g.rotate(side * (beat * 0.6 - 0.35));
    g.fillStyle = C.goldShade;
    oval(g, side * 12, 3.5, 9, 3.2, side * 0.3);
    g.fillStyle = C.gold;
    oval(g, side * 13, 0, 13, 4.4, 0);
    g.restore();
  }
}

// The gold tail under a climber who is being carried up: short for a feather, long for a ride.
function paintTail(g, long) {
  g.fillStyle = C.gold;
  shape(g, [player.x - 10, player.y - 9, player.x + 10, player.y - 9, player.x, player.y + long]);
  g.fillStyle = C.snow;
  shape(g, [player.x - 4.5, player.y - 7, player.x + 4.5, player.y - 7, player.x, player.y + long * 0.5]);
}

// Air streaking past a climber who is being carried up fast.
function paintStreaks(g, speed) {
  if (calm) return;
  const flicker = Math.floor(clock * 30);
  g.fillStyle = C.gold;
  g.globalAlpha = 0.3 * speed;
  for (let i = 0; i < 9; i++) {
    const x = 10 + ((i * 137 + flicker * 61) % 380);
    const y = cam.y + ((i * 211 + flicker * 97) % view.h);
    g.fillRect(x, y, 2, 50 + speed * 130);
  }
  g.globalAlpha = 1;
}

// A ride: the tail lengthens with the climber's speed.
function paintRide(g) {
  const speed = clamp(-player.vy / 2400, 0, 1);
  paintTail(g, 34 + speed * 150);
  paintStreaks(g, speed);
}

// The sleigh and its team at a size to carry a climber at x, y, who has the driver's seat: nose up
// by `tilt`, facing the way `face` says, and as solid as `alpha`. It turns about the climber, so
// they stay in the seat however steeply it climbs. With `side` only the near side of the sleigh
// is painted, to go over whoever is sitting in it.
function paintCarriage(g, x, y, face, tilt, alpha, side = false) {
  g.save();
  g.translate(x, y - 14);
  g.scale(face, 1);
  g.rotate(-tilt);
  g.scale(3, 3);
  g.translate(-0.8, 5.6);
  g.globalAlpha = alpha;
  if (side) {
    g.fillStyle = C.snow;
    g.beginPath();
    sleighBody(g);
    g.fill();
  } else {
    g.shadowColor = C.gold;
    g.shadowBlur = 14;
    paintTeam(g, C.snow, true);
  }
  g.restore();
}

// The sleigh ride: first the sleigh swooping in from behind and below, then the climb, with the
// nose higher the faster it goes.
function paintSleighRide(g, side = false) {
  const s = player.sleigh;
  if (s.t < SLEIGH_WAIT) {
    const near = 1 - (1 - s.t / SLEIGH_WAIT) ** 3;
    paintCarriage(g, lerp(player.x - 300 * s.face, player.x, near), lerp(player.y + 120, player.y, near), s.face, 0.4, 1, side);
    return;
  }
  const speed = clamp(-player.vy / 1500, 0, 1);
  if (!side) paintStreaks(g, speed);
  paintCarriage(g, player.x, player.y, s.face, 0.4 + 0.45 * speed, 1, side);
}

// And the sleigh leaving: on up and away to the side it faces, fading as it goes.
function paintDeparting(g) {
  if (!departing) return;
  const t = departing.t;
  paintCarriage(g, departing.x + departing.face * 300 * t, departing.y - 260 * t - 160 * t * t, departing.face, 0.4 + 0.3 * clamp(t * 2, 0, 1), clamp(1 - t / 1.3, 0, 1));
}

// The two heights marked on the sky of a climb. The best to beat is a string of fairy lights right
// across, which hangs a little in the middle: each light is where it is and its colour.
function strung(metres) {
  const y = -(metres + 1) * 10;
  const count = Math.round((13 * field.across) / W);
  return Array.from({ length: count }, (_, i) => {
    const x = field.lo + 16 + (i * (field.across - 32)) / (count - 1);
    return [x, y + 10 * (1 - ((x - W / 2) / (field.across / 2)) ** 2), [C.berry, C.gold, C.ice, C.snow][i % 4]];
  });
}

// Where the last climb ended is a pennant at the left, unless that climb is the best, which has
// the lights, or ended below where this one started.
const pennant = () => run.fell > run.base + 15 && (!run.mark || run.fell < run.mark - 15);

function paintMarks(g) {
  if (!run || !(state === 'run' || state === 'falling' || state === 'paused' || state === 'over' || state === 'finale')) return;
  g.font = "800 12px Nunito, 'Trebuchet MS', sans-serif";
  g.textAlign = 'left';
  const label = (text, x, y) => {
    g.fillStyle = C.ink;
    g.fillText(text, x + 1, y + 1);
    g.fillStyle = C.snow;
    g.fillText(text, x, y);
  };
  if (pennant() && !run.passed) {
    const y = -(run.fell + 1) * 10;
    g.strokeStyle = C.ice;
    g.lineWidth = 1.5;
    g.globalAlpha *= 0.4;
    g.setLineDash([3, 9]);
    g.beginPath();
    g.moveTo(field.lo, y);
    g.lineTo(field.hi, y);
    g.stroke();
    g.setLineDash([]);
    g.globalAlpha /= 0.4;
    g.fillStyle = C.ice;
    shape(g, [field.lo + 28, y, field.lo + 48, y, field.lo + 38 + Math.sin(clock * 5) * 2, y + 14]);
    label(`Last climb ${fmt(run.fell)} m`, field.lo + 54, y + 11);
  }
  if (!run.mark || run.mark <= run.base) return;
  const lights = strung(run.mark);
  const y = -(run.mark + 1) * 10;
  g.strokeStyle = C.holly;
  g.lineWidth = 1.5;
  g.lineCap = 'round';
  if (run.beaten) {
    // The string has been snapped in the middle: its two halves swing down and are gone.
    const gone = run.t - run.snap;
    if (gone > 0.7) return;
    g.globalAlpha *= 1 - gone / 0.7;
    for (const side of [-1, 1]) {
      g.beginPath();
      g.moveTo(W / 2 + side * (field.across / 2 + 6), y);
      g.quadraticCurveTo(W / 2 + side * (field.across / 4 + 60 * gone), y + 16 + 200 * gone, W / 2 + side * (12 + 150 * gone), y + 10 + 420 * gone * gone);
      g.stroke();
    }
    g.globalAlpha /= 1 - gone / 0.7;
    return;
  }
  g.beginPath();
  g.moveTo(field.lo - 6, y);
  g.quadraticCurveTo(W / 2, y + 20, field.hi + 6, y);
  g.stroke();
  lights.forEach(([x, at, colour], i) => {
    const lit = calm ? 0.85 : 0.7 + 0.3 * Math.sin(clock * 3 + i * 1.7);
    g.fillStyle = colour;
    g.globalAlpha *= 0.25 * lit;
    disc(g, x, at + 3, 8);
    g.globalAlpha /= 0.25 * lit;
    disc(g, x, at + 3, 3.4);
  });
  label(`${run.daily ? "Today's best" : 'Best'} ${fmt(run.mark)} m`, field.lo + 14, y - 8);
}

function draw() {
  const g = ctx;
  const travel = Math.max(0, -cam.y - view.h * rest.title);
  const metres = travel / 10;

  g.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  paintSky(g, metres);

  g.save();
  g.translate(view.left, 0);
  g.scale(view.scale, view.scale);
  g.beginPath();
  g.rect(field.lo, 0, field.across, view.h);
  g.clip();
  paintFar(g, travel, metres);

  g.save();
  g.translate(0, -cam.y);
  if (cam.zoom > 1.001) {
    // Close up on the climber, who stands at the middle of the roof.
    g.translate(W / 2, 0);
    g.scale(cam.zoom, cam.zoom);
    g.translate(-W / 2, 0);
  }
  if (cam.y + view.h > -80) tiled(g, () => paintStreet(g), cam.y);
  g.globalAlpha = run ? clamp(run.t * 4, 0, 1) : 1;
  paintShooting(g);
  paintFlypast(g);
  paintMarks(g);
  for (const p of world.plats) if (p.alive && p.type !== 'roof') paintLedge(g, p);
  for (const it of world.items) {
    if (it.taken) continue;
    if (it.kind === 'berry') paintBerry(g, it);
    else paintFind(g, it);
  }
  for (const f of world.foes) if (f.alive) paintFrostling(g, f);
  g.globalAlpha = 1;

  paintDeparting(g);
  if (player.ride) paintRide(g);
  else if (player.sleigh) paintSleighRide(g);
  else if (player.lift > 0) paintTail(g, 44 + Math.sin(clock * 30) * 6);
  paintHero(g, player.x, player.y);
  if (player.x < field.lo + 24) paintHero(g, player.x + field.across + 20, player.y);
  else if (player.x > field.hi - 24) paintHero(g, player.x - field.across - 20, player.y);
  if (player.sleigh) paintSleighRide(g, true);

  for (const p of particles) {
    const fade = 1 - p.life / p.ttl;
    g.globalAlpha = fade;
    g.fillStyle = p.colour;
    if (p.kind === 'puff' || p.kind === 'mist') {
      disc(g, p.x, p.y, p.size * (0.6 + fade));
    } else if (p.kind === 'ring') {
      g.strokeStyle = p.colour;
      g.lineWidth = 1 + fade * 3;
      g.beginPath();
      g.arc(p.x, p.y, p.size * (1 - fade * fade), 0, TAU);
      g.stroke();
    } else if (p.kind === 'fruit') {
      paintSprig(g, p.x, p.y, p.size / 4, C.berry, C.berryShade);
    } else if (p.kind === 'feather') {
      oval(g, p.x, p.y, p.size * 2.4, p.size * 0.8, p.life * 8 + p.size * 3);
    } else if (p.kind === 'glint') {
      glint(g, p.x, p.y, p.size * 0.5 * (0.4 + fade));
    } else if (p.kind === 'plus') {
      // What a berry was worth floats up from where it was picked.
      g.font = `800 ${p.size}px Nunito, 'Trebuchet MS', sans-serif`;
      g.textAlign = 'center';
      g.fillStyle = C.ink;
      g.fillText(p.text, p.x + 1, p.y + 1);
      g.fillStyle = p.colour;
      g.fillText(p.text, p.x, p.y);
    } else {
      shape(g, [p.x, p.y - p.size * 1.5, p.x + p.size, p.y, p.x, p.y + p.size * 1.5, p.x - p.size, p.y]);
    }
  }
  g.restore();

  tiled(g, () => paintNear(g, travel, metres));
  paintWeather(g, metres);
  if (field.lo < 0) paintWeather(g, metres, true);
  if (glory) {
    // The light of the star fills the sky for a moment and then settles to a glow.
    g.fillStyle = '#fff1cf';
    g.globalAlpha = 0.75 * ramp(glory.t, 2.4, 3.4) * (1 - 0.7 * ramp(glory.t, 3.6, 4.8));
    g.fillRect(field.lo, 0, field.across, view.h);
    g.globalAlpha = 1;
  }
  if (state === 'run' || state === 'falling' || state === 'finale' || state === 'paused' || state === 'tour') {
    g.fillStyle = hudShade;
    g.fillRect(field.lo, 0, field.across, 96);
  }
  g.restore();
  // Behind a menu a wide frame darkens towards its edges, where the words stand, and a little all
  // over behind any menu but the home screen. Nothing marks where a phone's screen would end.
  if (field.lo < 0 && dim > 0.01) {
    const over = 0.4 * wash;
    const tone = (a) => `rgba(6, 20, 26, ${(dim * Math.min(0.85, a)).toFixed(3)})`;
    const shade = g.createLinearGradient(0, 0, view.sw, 0);
    shade.addColorStop(0, tone(over + 0.6));
    shade.addColorStop(0.32, tone(over));
    shade.addColorStop(0.68, tone(over));
    shade.addColorStop(1, tone(over + 0.45));
    g.fillStyle = shade;
    g.fillRect(0, 0, view.sw, view.sh);
  }
}

function frame(now) {
  const dt = last ? Math.min(0.1, Math.max(0, (now - last) / 1000)) : 0;
  const camBefore = cam.y;
  last = now;
  tellPortal(state === 'run');
  dim += ((shown === 'hud' ? 0 : 1) - dim) * Math.min(1, dt * 5);
  wash += ((shown === 'hud' || shown === 'title' ? 0 : 1) - wash) * Math.min(1, dt * 5);
  playBells();
  beacon += ((state === 'title' ? 1 : 0) - beacon) * Math.min(1, dt * 4);
  if (flypast && state !== 'paused') stepFlypast(dt);
  if (departing && state !== 'paused' && (departing.t += dt) > 1.3) departing = null;
  if (shooting && state !== 'paused') stepShooting(dt);

  if (state === 'run' || state === 'falling' || state === 'finale') {
    if (state === 'run' && (steer === 'touch' || (steer === 'mouse' && pointer.locked)) && !player.ride) {
      const move = dragDx * 1.3;
      player.x += move;
      player.vx = lerp(player.vx, dt > 0 ? move / dt : 0, 0.4);
    }
    dragDx = 0;
    acc += dt;
    while (acc >= STEP) {
      acc -= STEP;
      if (state === 'run') stepRun(STEP);
      else if (state === 'falling') stepFall(STEP);
      else if (state === 'finale') stepFinale(STEP);
    }
    cullIn -= dt;
    if (cullIn < 0) {
      cullIn = 0.5;
      cull();
    }
  } else if (state === 'tour') {
    stepTour(dt);
  } else if (state !== 'paused') {
    idle(dt);
    if (opening) stepOpening(dt);
  }

  if (state !== 'paused') {
    clock += dt;
    const rush = dt > 0 ? (camBefore - cam.y) / dt : 0;
    // Snow falls of its own accord. Stardust, far above the clouds, mostly just drifts past.
    const settle = lerp(1, 0.15, ramp(-cam.y / 10, 1300, 2300));
    for (const f of flakes) {
      f.y += (f.fall * settle + Math.max(0, rush) * 0.3) * dt;
      f.x += Math.sin(clock * 0.8 + f.phase) * 8 * dt;
      if (f.y > view.h + 4) {
        f.y = -4;
        f.x = field.lo + Math.random() * field.across;
      }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.ttl) {
        particles.splice(i, 1);
        continue;
      }
      p.vy += (p.kind in DRIFT ? DRIFT[p.kind] : 500) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  draw();
  requestAnimationFrame(frame);
}

new ResizeObserver(resize).observe(stage);
// Whoever is holding a phone is told about fingers, not mice and keys.
if (press === 'Tap') $('how').textContent = HINTS.touch;
paintTitle();
paintSwitches();
resize();
world = newWorld(1);
cam.y = -view.h * rest.title;
document.fonts.ready.then(findPerch);
if (!save.plays && !save.opened) startOpening();
meetPortal();
meetGameDistribution();
meetPhone();
requestAnimationFrame(frame);
</script>
</body>
</html>
