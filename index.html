:root {
  /* One portrait playfield. Type sits on the night sky; every control lives on a snowdrift in the thumb zone. */
  --night: #0f2c36;
  --dusk: #3d5560;
  --snow: #f3eee2;
  --robin: #e5482d;
  --gold: #f2b53a;
  --ink: #0a1c22;
  --display: 'Caprasimo', 'Cooper Black', Georgia, serif;
  --body: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--ink);
  color: var(--snow);
  font: 700 16px/1.3 var(--body);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#stage { position: relative; height: 100%; overflow: hidden; }
#view, #finish { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
#view { transform-origin: 0 0; }
#finish { pointer-events: none; }

#frame {
  --u: 1;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 400px;
  transform: translateX(-50%);
  pointer-events: none;
}

/* The edges a notch or a rounded corner covers come from env(). Inside the CrazyGames app the game
   sits in a frame that env() cannot see out of, so the site passes them in as --safe-area-inset-*. */
.masthead {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;

   with the snow along its top like a phone's sheet. The goals go into the cards, and the controls
   up into the corner opposite the name. */
.wide .sheet {
  --card: min(calc(var(--u) * 620px), calc(100vw - var(--u) * 40px));
  left: calc(50% - var(--card) / 2);
  right: auto;
  bottom: calc(var(--u) * 18px);
  width: var(--card);
  padding: calc(var(--u) * 14px) calc(var(--u) * 24px) calc(var(--u) * 18px);
  border-radius: 0 0 calc(var(--u) * 18px) calc(var(--u) * 18px);
  box-shadow: 0 calc(var(--u) * 12px) calc(var(--u) * 34px) rgba(6, 20, 26, 0.5);
  font-size: max(15px, calc(var(--u) * 16px));
}
.wide .sheet .flag { font-size: max(13px, 0.85em); }
.wide #keys { top: calc(var(--u) * 22px); bottom: auto; padding-bottom: 0; }
.wide[data-shown="wardrobe"] #keys, .wide[data-shown="over"] #keys { display: none; }
.wide .lede[hidden], .wide[data-shown="over"] .lede, .wide[data-shown="pause"] .lede, .wide[data-shown="wardrobe"] .lede { display: none; }
/* A hint left over from the climb would stand under the pause card, so it waits. */
.wide[data-shown="pause"] #hint, .wide[data-shown="pause"] #coach { visibility: hidden; }

/* Home: the best height, the stages found and the berries along the top. Play has the next row to
   itself, with room for a ride's stage and price, and the daily climb and the wardrobe come
   smaller under it. The goals run along the foot. */
.wide #title {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr) minmax(0, 1fr);
  grid-template-areas:
    "best route berries"
    "go go go"
    "dock dock dock"
    "goals goals goals";
  column-gap: calc(var(--u) * 14px);
  row-gap: calc(var(--u) * 10px);
  align-items: center;
  padding-top: calc(var(--u) * 10px);
}
.wide #title .tally { display: contents; }
.wide #title-best { grid-area: best; }
.wide #title .tally > span:last-child { grid-area: berries; justify-self: end; }
.wide #title .route { grid-area: route; }
.wide #title .go { grid-area: go; }
.wide #title .dock { grid-area: dock; }
.wide #title .dock .btn { min-height: max(38px, calc(var(--u) * 40px)); font-size: max(14px, calc(var(--u) * 15px)); }
.wide #goals:not([hidden]) {
  grid-area: goals;
  display: block;
  margin: 0;
  font-size: max(14px, calc(var(--u) * 15px));
  line-height: 1.2;
}
.wide h1 { white-space: nowrap; }
/* A first visit has the stages and Play and nothing else, so its card is narrower. */
.wide .fresh #title {
  --card: min(calc(var(--u) * 440px), calc(100vw - var(--u) * 40px));
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "route" "go";
}
.wide .fresh #title .tally, .wide .fresh #title .dock { display: none; }

/* After a climb: what happened down the left, the goals down the right, the buttons along the foot. */
.wide #over { grid-template-columns: repeat(10, minmax(0, 1fr)); column-gap: calc(var(--u) * 12px); row-gap: 0; }
.wide #over > * { grid-column: 1 / 7; }
.wide #over-height { margin: calc(var(--u) * 2px) 0 calc(var(--u) * 6px); }
.wide #over-best { margin-bottom: calc(var(--u) * 8px); }
.wide #over-stage, .wide #over-ad { margin-bottom: calc(var(--u) * 6px); }
.wide #over-goals {
  display: grid;
  grid-column: 7 / -1;
  grid-row: 1 / span 5;
  align-self: start;
  gap: calc(var(--u) * 6px);
  margin: 0;
  padding-left: calc(var(--u) * 16px);
  border-left: 2px solid rgba(10, 28, 34, 0.12);
  line-height: 1.2;
}
.wide #over-goals .today { display: grid; justify-items: start; row-gap: calc(var(--u) * 4px); }
.wide #btn-again { grid-column: 1 / 4; align-self: start; margin-top: calc(var(--u) * 14px); padding: 0 0.4em; }
/* However many buttons there are beside it, they stand in one row. */
.wide #over .pair,
.wide #over .pair:has(> .btn:not([hidden]) ~ .btn:not([hidden]) ~ .btn:not([hidden]) ~ .btn:not([hidden])) {
  grid-column: 4 / -1;
  grid-template-columns: none;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  align-self: start;
  margin-top: calc(var(--u) * 14px);
}

/* Paused: a small card in the middle. */
.wide #pause {
  --card: min(calc(var(--u) * 360px), calc(100vw - var(--u) * 40px));
  top: 50%;
  bottom: auto;
  translate: 0 -50%;
}

/* During a climb the mouse steers the robin, which stands in for the pointer. It shows again over
   the pause button, and on every menu. */
#stage.playing { cursor: none; }
#stage.playing #btn-pause { cursor: pointer; }
/* With a mouse, a button lights a little when the pointer is over it. */
@media (hover: hover) {
  .btn:hover, .step:hover:not([aria-disabled="true"]), .item:hover:not([aria-pressed="true"]):not(.trying) { background: rgba(10, 28, 34, 0.07); }
  .btn.primary:hover { background: #f6c55e; }
  .icon:hover, .plain:hover { color: var(--ink); }
}
</style>

<script>
'use strict';

const W = 400;
const WRAP = W + 20;
const GRAVITY = 1500;
const BOUNCE = 720;
const CHIME_BOUNCE = 1160;
const FLAP = 420;
const LIFT_SPEED = 1000;
// One climb in four has a golden berry somewhere in it, worth the same wherever it turns up.
const GOLD_ODDS = 0.25;
const GOLD_WORTH = 100;
const STEP = 1 / 120;
const TAU = Math.PI * 2;
const SAVE_KEY = 'rooftop-robin';

const C = {
  snow: '#f3eee2', snowShade: '#b9cbc8', slab: '#1c4852',
  robin: '#e5482d', umber: '#74502f', umberDark: '#523621',
  gold: '#f2b53a', goldShade: '#a8720f', ink: '#0a1c22',
  berry: '#c2203a', berryShade: '#8f1529', holly: '#2f7d4f',
  ice: '#bfe3ea', iceShade: '#77afbd',
  cloud: '#d5e4df', cloudShade: '#94b4b4', frost: '#8fd3ea', frostShade: '#3d8fb3',
  storm: '#666a72', stormShade: '#3b3e46'
};
// The colours a frozen climber turns: mid, dark, pale and palest.
const ICE = ['#9cc7d3', '#7fb0be', '#cfe9ef', '#e8f6f8'];
const FAIRY = [C.berry, C.gold, '#49b071', C.snow];

// The stages of the climb and the height in metres where each begins. "as" is the name as it reads
// in the middle of a sentence, "worth" is what one berry counts for there, and "ride" is the price
// of being carried up to it from the roof.
const STAGES = [
  { at: 0, name: 'Rooftops', as: 'the rooftops', worth: 1, ride: 0 },
  { at: 250, name: 'Open sky', as: 'open sky', worth: 2, ride: 1000 },
  { at: 700, name: 'Cloud bank', as: 'the cloud bank', worth: 3, ride: 2500, cloudy: true },
  { at: 1200, name: 'Northern lights', as: 'the northern lights', worth: 5, ride: 5000 },
  { at: 2000, name: 'Among the stars', as: 'the stars', worth: 8, ride: 10000 },
  { at: 3000, name: 'Edge of space', as: 'the edge of space', worth: 12, ride: 20000 },
  { at: 4500, name: 'The Moon', as: 'the Moon', worth: 20, ride: 40000 },
  { at: 6500, name: 'Deep space', as: 'deep space', worth: 30, ride: 80000 },
  { at: 8000, name: 'The comet', as: 'the comet', worth: 50, ride: 150000 },
  { at: 10000, name: 'The Christmas star', as: 'the Christmas star', worth: 100, ride: 0 }
];

const HINTS = {
  keys: 'Arrow keys steer. Space gives one extra hop in mid-air.',
  mouse: 'Move the mouse to steer. Click for one extra hop in mid-air.',
  touch: 'Drag to steer. Tap for one extra hop in mid-air.'
};

const SCARVES = [
  { id: 'no-scarf', name: 'No scarf', cost: 0 },
  { id: 'mustard', name: 'Mustard', cost: 40, colours: ['#f2b53a', '#a8720f'] },
  { id: 'spruce', name: 'Spruce', cost: 80, colours: ['#2f7d4f', '#f3eee2'] },
  { id: 'frost', name: 'Frost', cost: 160, colours: ['#bfe3ea', '#f3eee2'] },
  { id: 'candy', name: 'Candy stripe', cost: 300, colours: ['#f3eee2', '#c2203a'] },
  { id: 'plum', name: 'Plum', cost: 600, colours: ['#7a3f78', '#f2b53a'] },
  { id: 'midnight', name: 'Midnight', cost: 1200, colours: ['#0a1c22', '#f2b53a'] },
  { id: 'tinsel', name: 'Tinsel', cost: 2500, colours: ['#d9dee0', '#f2b53a'] },
  { id: 'lights', name: 'Fairy lights', cost: 5000, colours: ['#0a1c22', '#0a1c22'], bulbs: true }
];

const HATS = [
  { id: 'no-hat', name: 'No hat', cost: 0 },
  { id: 'acorn', name: 'Acorn cap', cost: 60 },
  { id: 'holly', name: 'Holly sprig', cost: 120 },
  { id: 'bobble', name: 'Bobble hat', cost: 250 },
  { id: 'santa', name: 'Santa hat', cost: 500 },
  { id: 'topper', name: 'Top hat', cost: 1000 },
  { id: 'antlers', name: 'Antlers', cost: 2000 },
  { id: 'crown', name: 'Paper crown', cost: 4000 },
  { id: 'star', name: 'Tree star', cost: 8000 }
];

// The climbers all play alike and differ only in looks. "neck" is where a scarf sits on each one
// (how far along, how far up and how wide) and "crown" is the top of the head, where a hat goes.
const HEROES = [
  { id: 'robin', name: 'Robin', cost: 0, slip: 'The robin slipped.', as: 'the robin', boast: 'one small robin', paint: paintRobin, neck: [0, 0, 1], crown: [3, -26.5] },
  { id: 'father', name: 'Father Christmas', cost: 0, slip: 'Father Christmas slipped.', as: 'Father Christmas', boast: 'Father Christmas', paint: paintFather, neck: [0, 12, 1], crown: [4.5, -30.5] },
  { id: 'snowman', name: 'Snowman', cost: 400, slip: 'The snowman slipped.', as: 'the snowman', boast: 'one small snowman', paint: paintSnowman, neck: [1.5, 10.5, 0.66], crown: [1.5, -31.5] },
  { id: 'penguin', name: 'Penguin', cost: 1000, slip: 'The penguin slipped.', as: 'the penguin', boast: 'one small penguin', paint: paintPenguin, neck: [0.5, 6, 0.9], crown: [2, -27.5] },
  { id: 'reindeer', name: 'Reindeer', cost: 2500, slip: 'The reindeer slipped.', as: 'the reindeer', boast: 'one small reindeer', paint: paintReindeer, neck: [3.5, 8, 0.72], crown: [7, -30.5] },
  { id: 'elf', name: 'Elf', cost: 6000, slip: 'The elf slipped.', as: 'the elf', boast: 'one small elf', paint: paintElf, neck: [0, 11, 0.95], crown: [4.5, -29.5] },
  { id: 'ginger', name: 'Gingerbread man', cost: 12000, slip: 'The gingerbread man slipped.', as: 'the gingerbread man', boast: 'one gingerbread man', paint: paintGinger, neck: [1.5, 10.5, 0.62], crown: [2, -31.5] },

];

// Power-ups found on the climb, and the share of them each kind makes up.
const FINDS = [['cane', 0.34], ['feather', 0.26], ['gift', 0.22], ['globe', 0.18]];
const PULL_REACH = 150;

// Every power-up wears off, and berries make each last longer, a level at a time. "steps" is what
// each level gives: seconds of flight on a feather, seconds of pull from a candy cane, seconds a
// snow globe lasts, and how many berries a present holds, counted at what berries are worth at
// that height. "label" is how each reads after "the".
const KIT = [
  { id: 'feather', name: 'Longer flight', label: 'feather boost', steps: [1.6, 2, 2.4, 2.8], costs: [150, 600, 2500] },
  { id: 'cane', name: 'Longer pull', label: 'candy cane boost', steps: [8, 11, 14, 17], costs: [150, 600, 2500] },
  { id: 'globe', name: 'Longer globe', label: 'snow globe boost', steps: [12, 16, 20, 25], costs: [200, 800, 3000] },
  { id: 'gift', name: 'Bigger presents', label: 'present boost', steps: [10, 14, 18, 22], costs: [200, 800, 3000] }
];

// What the climber is told the first few times each power-up is caught.
const FIND_SAYS = {
  feather: () => 'Golden feather. Up you go.',
  cane: () => 'Candy cane. Berries fly to you for a while.',
  globe: () => `Snow globe. For ${kit('globe')} seconds it will save you from one fall or one frostling.`,
  // Outside the daily climb a present also says how many more it takes to call the sleigh.
  gift: () => {
    const inside = `A present with ${fmt(kit('gift') * worthNow())} berries in it.`;
    const more = SLEIGH_NEEDS - save.gifts;
    if (run.daily || player.sleigh) return inside;
    return `${inside} ${more > 1 ? `${more} more call` : more === 1 ? 'One more calls' : 'That calls'} the sleigh.`;
  }
};

// Today's goal: one a day, the same all day and counted over every climb in it. Each kind is offered
// once the climber has been high enough to meet what it asks for.
const TODAY = {
  far: { from: 0, n: () => clamp(Math.round((save.best * 5) / 500) * 500, 1500, 20000), say: (n) => `Climb ${fmt(n)} m` },
  hoard: { from: 0, n: () => clamp(Math.round((save.best * 0.6) / 50) * 50, 300, 20000), say: (n) => `Pick ${fmt(n)} berries` },
  find: { from: 150, n: () => 10, say: (n) => `Catch ${n} power-ups` },
  pop: { from: 300, n: () => 15, say: (n) => `Pop ${n} frostlings` },
  chime: { from: 700, n: () => 8, say: (n) => `Land on ${n} chime ledges` },
  crack: { from: 1000, n: () => 25, say: (n) => `Break ${n} ice ledges` }
};

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString('en-GB');
// A piece's name as it reads in the middle of a sentence. Santa and Christmas keep their capitals.
const mid = (name) => (/^(Santa|Christmas)/.test(name) ? name : name[0].toLowerCase() + name.slice(1));
// The stage a height falls in, as its place in the list.
const stageAt = (metres) => STAGES.filter((stage) => metres >= stage.at).length - 1;

const stage = $('stage');
const canvas = $('view');
const ctx = canvas.getContext('2d');
const finish = $('finish');
const finishPen = finish.getContext('2d');
const frameEl = $('frame');
const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const press = window.matchMedia('(pointer: coarse)').matches ? 'Tap' : 'Click';

const view = { scale: 1, h: 640, left: 0, sw: W, sh: 640, dpr: 1, wide: false };
// The playfield. A phone's is the 400 across that everything is drawn to. A wide frame's runs the
// width of the frame, the same distance either side of the middle of those 400.
const field = { lo: 0, hi: W, across: W };
const cam = { y: 0, zoom: 1 };

const keys = { left: false, right: false };

const particles = [];
// How fast each kind of particle falls. Any kind not listed drops like a stone.
const DRIFT = { plus: 0, ring: 0, feather: 130, glint: 70, mist: -40 };

let state = 'title';
let steer = 'keys';
let dragDx = 0;
let world = null;

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashString(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

const todayKey = () => new Date().toISOString().slice(0, 10);
// The daily climb has a twist, and it is a different one each day. The date is read off the
// device in one time zone for everyone, so the twist changes at midnight GMT and players
// anywhere get the same one.
const TWISTS = [
  { name: 'Moon boots', say: 'Today everything falls slowly.', gravity: 0.55 },
  { name: 'Blizzard', say: 'Today the sky is thick with frostlings.', foes: 5 },
  { name: 'Power surge', say: 'Today there is a power-up every few hops.', finds: 6 },
  { name: 'Ice age', say: 'Today every ledge is ice.', ledge: 'ice' },
  { name: 'Berry storm', say: 'Today there is a berry on every ledge.', berries: 1 },
  { name: 'Cloud nine', say: 'Today every ledge is a cloud.', ledge: 'cloud' },
  { name: 'Tightrope', say: 'Today the ledges are half as wide.', narrow: 0.5 }
];
// Every other climb has no twist.
const PLAIN = {};
// All seven come round in a week, in an order that shifts each week so that no day of the week
// is left with the same one.
const twistOf = (day) => {
  const n = Math.floor(Date.parse(day) / 864e5);
  return TWISTS[(n * 3 + Math.floor(n / 7)) % TWISTS.length];
};

function dayLabel(key) {
  return new Date(`${key}T00:00:00Z`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
}

function loadSave() {
  const fresh = {
    best: 0, berries: 0, owned: [], hero: 'robin', scarf: 'no-scarf', hat: 'no-hat',
    sound: true, bells: true, buzz: true, day: '', dayBest: 0, plays: 0, rules: 2,
    kit: {}, met: {}, top: 0, from: 0, today: null, sum: { metres: 0, berries: 0 }, stars: 0, opened: false,
    // Presents in hand towards a sleigh ride, and the height at which the last climb ended.
    gifts: 0, fell: 0
  };
  try {
    const kept = JSON.parse(localStorage.getItem(SAVE_KEY));
    // Heights from an older rule set are not comparable, so records restart when the rules change.
    if (kept && kept.rules !== fresh.rules) Object.assign(kept, { best: 0, dayBest: 0, rules: fresh.rules });
    return Object.assign(fresh, kept);
  } catch (err) {
    return fresh;
  }
}

const save = loadSave();
// In the wardrobe a piece can be tried on before it is bought. The first tap puts it on the
// climber and a second tap buys it.
let fitting = null;
// A save from before the stages were counted is credited with the ones its best climb passed.
save.top = Math.max(save.top, stageAt(save.best));
save.from = clamp(save.from, 0, Math.min(save.top, STAGES.length - 2));
const has = (piece) => piece.cost === 0 || save.owned.includes(piece.id);
const climber = () => HEROES.find((hero) => hero.id === save.hero) || HEROES[0];

// What the climber has on, with any piece being tried on in place of the one worn.
function look() {
  const on = { hero: save.hero, scarf: save.scarf, hat: save.hat };
  if (fitting && fitting.slot !== 'kit') on[fitting.slot] = fitting.id;
  return on;
}
const kitLevel = (id) => Math.min(save.kit[id] || 0, KIT.find((piece) => piece.id === id).costs.length);
const kit = (id) => KIT.find((piece) => piece.id === id).steps[kitLevel(id)];
// A ride to a stage already reached costs more than twenty times what the climb there earns, and
// far more than that for the stages nearest the roof. It is a treat for a climber with berries to
// burn, and never a sensible way up.
const rideCost = (stage) => STAGES[stage].ride;
// What one berry counts for at the height the climber has reached.
const worthNow = () => STAGES[stageAt(run.metres)].worth;
// Carrying on after a fall costs half the berries the climb has picked, to the nearest ten, and
// never less than thirty at the going rate for that height.
const carryCost = () => Math.max(30 * worthNow(), Math.round(run.berries / 20) * 10);
// Where the next climb rides to: the stage picked on the home screen, if there are berries for it.
const startStage = () => (save.berries >= rideCost(save.from) ? save.from : 0);

function persist() {
  const kept = JSON.stringify(save);
  try {
    localStorage.setItem(SAVE_KEY, kept);
  } catch (err) {
    // Storage can be blocked in private windows and embeds. The game still plays.
  }
  try {
    if (portal.kept) portal.sdk.data.setItem(SAVE_KEY, kept);
  } catch (err) {
    // The site's copy is the spare one.
  }
  if (portal.stow) portal.stow(kept);
}

// ---- the site the game is played on ----
// On CrazyGames the page carries the site's SDK. The game tells it when a climb is under way,
// keeps a copy of the save with it, goes quiet when it says so and asks it for ads. Anywhere else
// on the web there is no SDK, and nothing here does anything. On GameDistribution, and as an app
// on a phone, the ads come another way, further down.
const portal = {
  sdk: null, playing: false, muted: false, hush: false, kept: false,
  // Ads. `proven` is set once the site has answered a request in a way that shows it runs ads on
  // this visit, and `off` once it has said that it does not, or that they are blocked. Until the
  // first, no ad is offered to the player, so that a button for one never leads nowhere.
  proven: false, off: false, busy: false, askedAt: -Infinity, restUntil: 0,
  // When this visit's first climb began, how many climbs and result sheets there have been, and
  // what the sheet now showing offers for an ad.
  since: 0, climbs: 0, sheets: 0, offer: '',
  // What plays an ad when one is asked for: the site, or on a phone the app's own ad kit. Then
  // when the last ad of either kind ended, why the last one gave nothing, and how many ads that
  // nobody chose this visit has had.
  ads: null, phone: false, lastAd: -Infinity, why: '', forced: 0,
  // What puts a second copy of the save in a phone's own store, when the game is an app.
  stow: null
};

function meetPortal() {
  const sdk = window.CrazyGames && window.CrazyGames.SDK;
  if (!sdk || sdk.environment === 'disabled') return;
  Promise.resolve()
    .then(() => sdk.init())
    .then(() => {
      if (sdk.environment === 'disabled') return;
      portal.sdk = sdk;
      portal.ads = { play: (kind, heard) => sdk.ad.requestAd(kind, heard) };
      keepWithPortal();
      heedPortal();
      sdk.game.addSettingsChangeListener(heedPortal);
    })
    // Without the site the game plays on as it does anywhere else.
    .catch(() => {});
}

// A save kept somewhere else takes the place of the one on the device when it has more climbs
// behind it, and is of the same rules.
function adopt(theirs) {
  if (!theirs || theirs.rules !== save.rules || (theirs.plays || 0) <= save.plays) return;
  Object.assign(save, theirs);
  save.top = Math.max(save.top, stageAt(save.best));
  save.from = clamp(save.from, 0, Math.min(save.top, STAGES.length - 2));
  if (state === 'title') {
    paintTitle();
    paintSwitches();
  }
}

// The site keeps a copy of the save, so that a player signed in there finds their berries and
// their wardrobe on any device. Whichever of the two saves has more climbs behind it is the one
// kept, and from then on every change goes to both.
function keepWithPortal() {
  try {
    adopt(JSON.parse(portal.sdk.data.getItem(SAVE_KEY)));
    portal.kept = true;
    persist();
  } catch (err) {
    // The site's store can be switched off for a game. The save stays on the device.
  }
}

// The site is told when a climb starts and when it stops, once for each change.
function tellPortal(playing) {
  if (!portal.sdk || portal.playing === playing) return;
  portal.playing = playing;
  try {
    if (playing) portal.sdk.game.gameplayStart();
    else portal.sdk.game.gameplayStop();
  } catch (err) {
    // The climb goes on whether or not the site hears of it.
  }
}

// A new best, today's goal and the Christmas star are the moments the site is asked to
// celebrate.
function cheerPortal() {
  try {
    if (portal.sdk) portal.sdk.game.happytime();
  } catch (err) {
    // The moment is no less for that.
  }
}

// The site has a mute of its own, which the game's own switches do not undo.
function heedPortal() {
  try {
    portal.muted = Boolean(portal.sdk.game.settings.muteAudio);
  } catch (err) {
    portal.muted = false;
  }
  setGate();
}

// The gate that every sound goes out through is shut while the site asks for quiet and while an
// ad is playing.
function setGate() {
  if (audio.out) audio.out.gain.value = portal.muted || portal.hush ? 0 : VOLUME;
}

// Asks for an ad, of the site or of a phone's ad kit, and answers when it is over: true if it
// played to the end. Until then a veil lies over the game, so that nothing can be pressed.
function watchAd(kind) {
  return new Promise((done) => {
    let patience = 0;
    const end = (watched, code) => {
      if (!portal.busy) return;
      clearTimeout(patience);
      Object.assign(portal, { busy: false, hush: false, why: code, lastAd: performance.now() });
      setGate();
      $('veil').hidden = true;
      // Ads that are disabled or blocked will not come back this visit. An empty slot may fill.
      if (code === 'adsDisabled' || code === 'adblock') portal.off = true;
      else if (code !== 'other') portal.proven = true;
      done(watched);
    };
    Object.assign(portal, { busy: true, askedAt: performance.now() });
    $('veil').hidden = false;
    // A site that never answers is not waited on for ever.
    patience = setTimeout(() => end(false, 'other'), 12000);
    try {
      portal.ads.play(kind, {
        adStarted: () => {
          clearTimeout(patience);
          patience = setTimeout(() => end(false, 'other'), 240000);
          portal.hush = true;
          setGate();
        },
        adFinished: () => end(true, ''),
        adError: (error) => end(false, (error && error.code) || 'other')
      });
    } catch (err) {
      end(false, 'other');
    }
  });
}

// What the sheet at the end of a climb offers for watching an ad: to carry on, after a climb
// worth carrying on with, or else to double what the climb picked. On the site it is offered on
// every other sheet at most, and not for three minutes after one has been watched. On a phone the
// choice is the player's every time, so long as the kit has an ad ready to play.
function adOffer() {
  if (portal.phone) {
    if (!portal.ads.ready('rewarded')) return '';
  } else {
    // A site that can say whether an ad is waiting is asked. Otherwise it has to have shown one.
    const ready = portal.ads && (portal.ads.ready ? portal.ads.ready('rewarded') : portal.proven);
    if (!ready || portal.off || portal.sheets % 2 === 0 || performance.now() < portal.restUntil) return '';
  }
  if (!run.daily && !run.carried && run.cause !== 'star' && run.metres >= Math.max(100, 0.6 * run.mark)) return 'carry';
  return run.berries >= 20 && !run.doubled ? 'double' : '';
}

function paintAdOffer() {
  portal.offer = adOffer();
  $('btn-ad').hidden = !portal.offer;
  $('ad-for').textContent = portal.offer === 'carry' ? 'Carry on' : '2× berries';
  $('over-ad').hidden = true;
}

// The ad for what the sheet offers. Nothing is given for one that does not play to the end.
function takeAdOffer() {
  const offer = portal.offer;
  if (!offer || portal.busy || state !== 'over') return;
  watchAd('rewarded').then((watched) => {
    portal.offer = '';
    $('btn-ad').hidden = true;
    portal.restUntil = performance.now() + (watched ? 180000 : 120000);
    if (!watched) {
      $('over-ad').textContent = portal.why === 'early'
        ? 'The ad was closed before its end, so nothing is given.'
        : 'No ad to show just now, so nothing to watch.';
      $('over-ad').hidden = false;
    } else if (offer === 'carry') {
      carryOn(true);
    } else {
      doubleUp();
    }
  });
}

// An ad watched to the end doubles what the climb picked.
function doubleUp() {
  if (state !== 'over' || run.doubled) return;
  run.doubled = true;
  save.berries += run.berries;
  save.sum.berries += run.berries;
  persist();
  $('over-ad').textContent = `Doubled: ${fmt(run.berries)} more ${run.berries === 1 ? 'berry' : 'berries'}. You have ${fmt(save.berries)}.`;
  $('over-ad').hidden = false;
  sfx.gift();
}

// Climbing again from the sheet. Now and then the site's own ad comes first: never before the
// second climb of a visit is over or in its first two minutes, never from a sheet that offered an
// ad of the player's choosing, and never within three minutes of the last time one was asked for.
function climbAgain(device) {
  if (portal.busy) return;
  const daily = run.daily;
  const now = performance.now();
  const due = portal.ads && !portal.phone && !portal.off && !portal.offer && portal.sheets % 2 === 0 && portal.climbs >= 2
    && now - portal.since > 120000 && now - portal.askedAt > 185000;
  if (!due) {
    startRun(daily, device);
    return;
  }
  watchAd('midgame').then(() => {
    if (state === 'over') startRun(daily, device);
  });
}

// The ad nobody chose, as a phone shows it: after a fall and ahead of its sheet. Never in a
// visit's first two minutes or before its second fall, never within three minutes of another ad,
// three in a visit at most, and never ahead of a sheet with good news on it.
function forcedDue(goodNews) {
  const now = performance.now();
  return portal.phone && !goodNews && portal.climbs >= 2 && portal.forced < 3
    && now - portal.since > 120000 && now - portal.lastAd > 180000 && portal.ads.ready('midgame');
}

// ---- GameDistribution ----
// There the game is played inside many other sites, and its ads come through GameDistribution's
// own code, fetched once as the page opens. Their rules: an ad only after a press, never during a
// climb, and the game paused and silent while one plays. A reward is given only when they say the
// ad was watched to the end. The copy made for them writes the game's ID here. Everywhere else it
// is empty, and none of this runs.
const GAMEDISTRIBUTION = '';

function meetGameDistribution() {
  if (!GAMEDISTRIBUTION || portal.ads) return;
  const gd = { heard: null, watched: false, ready: false };
  // A reward is offered only once one has been fetched and is waiting.
  const fetchReward = () => {
    gd.ready = false;
    try {
      Promise.resolve(window.gdsdk.preloadAd('rewarded')).then(() => { gd.ready = true; }, () => {});
    } catch (err) {
      // Nothing is offered until a reward can be fetched.
    }
  };
  window.GD_OPTIONS = {
    gameId: GAMEDISTRIBUTION,
    onEvent: (event) => {
      if (event.name === 'SDK_READY') {
        fetchReward();
      } else if (event.name === 'SDK_REWARDED_WATCH_COMPLETE') {
        gd.watched = true;
      } else if (event.name === 'SDK_GAME_PAUSE') {
        if (state === 'run') pause();
        portal.hush = true;
        setGate();
        if (gd.heard) gd.heard.adStarted();
      } else if (event.name === 'SDK_GAME_START' && !portal.busy) {
        portal.hush = false;
        setGate();
      }
    }
  };
  portal.ads = {
    ready: (kind) => kind !== 'rewarded' || gd.ready,
    play: (kind, heard) => {
      const sdk = window.gdsdk;
      if (!sdk || typeof sdk.showAd !== 'function') throw new Error('GameDistribution is not there');
      gd.heard = heard;
      gd.watched = false;
      const settle = (code) => {
        if (gd.heard !== heard) return;
        gd.heard = null;
        if (code) heard.adError({ code });
        else heard.adFinished();
        if (kind === 'rewarded') fetchReward();
      };
      let asked;
      try {
        asked = kind === 'rewarded' ? sdk.showAd('rewarded') : sdk.showAd();
      } catch (err) {
        gd.heard = null;
        throw err;
      }
      // Word that a reward was earned can come a moment after the ad is over, so it is waited for.
      Promise.resolve(asked).then(
        () => setTimeout(() => settle(kind === 'rewarded' && !gd.watched ? 'early' : ''), 250),
        (err) => settle(/block/i.test(String(err && err.message ? err.message : err)) ? 'adblock' : 'unfilled')
      );
    }
  };
  const tag = document.createElement('script');
  tag.id = 'gamedistribution-jssdk';
  tag.src = 'https://html5.api.gamedistribution.com/main.min.js';
  document.head.appendChild(tag);
}

// ---- the app on a phone ----
// As an app the game has no site around it, and its ads come through Google's ad kit, which the
// app carries. The kit has to fetch an ad before it can show it, so one of each kind is kept
// ready, and an ad is offered or shown only when it is.
const ADS = {
  // Google's test ads. The app's own go here before it is sent to the App Store.
  midgame: 'ca-app-pub-3940256099942544/4411468910',
  rewarded: 'ca-app-pub-3940256099942544/1712485313'
};
const phone = {
  kit: null, started: false,
  // Which kinds are ready, who is waiting on the ad now playing, which kind that is and whether
  // it has been watched far enough to earn what it was chosen for.
  ready: { midgame: false, rewarded: false }, heard: null, kind: '', earned: false,
  // Which kinds are being fetched, how long each is left after the kit had none to give, and the
  // timer that asks again.
  fetching: { midgame: false, rewarded: false }, wait: { midgame: 0, rewarded: 0 }, retry: { midgame: 0, rewarded: 0 },
  // What the player has still to be asked: Google's form, Apple's question, both or neither. Then
  // whether the asking is under way, and when the app was last put away.
  form: false, follow: false, asking: false, leftAt: 0,
  // Whether the app can put Apple's question about a rating, pass a result on through the
  // phone's own sheet, and tap the hand that holds it.
  rates: false, shares: false, buzzes: false
};
const askKit = (what, how) => phone.kit.nativePromise('AdMob', what, how || {});

function meetPhone() {
  const kit = window.Capacitor;
  if (!kit || !kit.isNativePlatform || !kit.isNativePlatform()) return;
  const carries = (name) => (kit.PluginHeaders || []).some((plugin) => plugin.name === name);
  phone.kit = kit;
  phone.rates = carries('InAppReview');
  phone.shares = carries('Share');
  phone.buzzes = carries('Haptics');
  document.querySelector('.plain[data-switch="buzz"]').hidden = !phone.buzzes;
  if (carries('Preferences')) keepOnPhone();
  if (!carries('AdMob')) return;
  portal.phone = true;
  portal.ads = { ready: (kind) => phone.ready[kind], play: playOnPhone };
  const hear = (what, heard) => kit.addListener('AdMob', what, heard);
  hear('onRewardedVideoAdReward', () => {
    phone.earned = true;
  });
  hear('onRewardedVideoAdDismissed', () => endOnPhone(phone.earned ? '' : 'early'));
  hear('onRewardedVideoAdFailedToShow', () => endOnPhone('unfilled'));
  hear('interstitialAdDismissed', () => endOnPhone(''));
  hear('interstitialAdFailedToShow', () => endOnPhone('unfilled'));
  document.addEventListener('visibilitychange', () => (document.hidden ? wentAway() : cameBack()));
  // The app also says for itself when it is put away and when it is brought back.
  document.addEventListener('pause', wentAway);
  document.addEventListener('resume', cameBack);
  readPhone();
}

// A phone may clear out what a web view has stored when it runs short of room, so the app keeps
// a second copy of the save in the phone's own store. As with the site, whichever save has more
// climbs behind it is the one kept, and from then on every change goes to both.
function keepOnPhone() {
  phone.kit.nativePromise('Preferences', 'get', { key: SAVE_KEY })
    .then((found) => {
      try {
        adopt(JSON.parse(found.value));
      } catch (err) {
        // A copy that cannot be read is written over.
      }
      portal.stow = (kept) => phone.kit.nativePromise('Preferences', 'set', { key: SAVE_KEY, value: kept }).catch(() => {});
      persist();
    })
    .catch(() => {});
}

// A bounce and a hop are a light tap in the hand that holds the phone, and a fall a firmer one.
// The pause sheet has the switch for it.
function buzz(style) {
  if (!phone.buzzes || !save.buzz) return;
  phone.kit.nativePromise('Haptics', 'impact', { style }).catch(() => {});
}

// What has to be asked before an ad may be chosen to suit the player: in Britain and Europe a
// form of Google's, and on any iPhone Apple's question about being followed from app to app.
// Answers given on an earlier visit still stand, and then the ads are made ready at once.
function readPhone() {
  Promise.all([askKit('requestConsentInfo'), askKit('trackingAuthorizationStatus')])
    .then(([consent, follow]) => {
      phone.form = consent.status === 'REQUIRED' && Boolean(consent.isConsentFormAvailable);
      phone.follow = follow.status === 'notDetermined';
      $('btn-choices').hidden = consent.privacyOptionsRequirementStatus !== 'REQUIRED';
      if (!phone.form && !phone.follow && consent.canRequestAds) startAds();
    })
    // With no word from the kit there are no ads this visit.
    .catch(() => {});
}

// The asking waits for the first result sheet, and a moment more, so that nobody meets a form
// before they have played. Nothing in the game can be pressed while a question is up. A form that
// is slow to come is not waited on for ever, and its answer still counts when it does.
function askPhone() {
  if (!portal.phone || phone.asking || !(phone.form || phone.follow)) return;
  phone.asking = true;
  setTimeout(() => {
    if (state !== 'over' || portal.busy) {
      phone.asking = false;
      return;
    }
    const { form, follow } = phone;
    Object.assign(phone, { form: false, follow: false });
    portal.busy = true;
    $('veil').hidden = false;
    let lifted = false;
    const lift = () => {
      if (lifted) return;
      lifted = true;
      portal.busy = false;
      $('veil').hidden = true;
    };
    const patience = setTimeout(lift, 30000);
    Promise.resolve(form ? askKit('showConsentForm') : null)
      .catch(() => null)
      .then(() => (follow ? askKit('requestTrackingAuthorization') : null))
      .catch(() => null)
      .then(() => askKit('requestConsentInfo'))
      .then((consent) => {
        $('btn-choices').hidden = consent.privacyOptionsRequirementStatus !== 'REQUIRED';
        if (consent.canRequestAds) startAds();
      })
      .catch(() => {})
      .then(() => {
        clearTimeout(patience);
        phone.asking = false;
        lift();
      });
  }, 900);
}

// Starts the kit and has it fetch one ad of each kind. The ads are kept to those fit for anyone.
function startAds() {
  if (phone.started) return;
  phone.started = true;
  askKit('initialize', { maxAdContentRating: 'General' })
    .then(() => {
      makeReady('rewarded');
      makeReady('midgame');
    })
    .catch(() => {
      phone.started = false;
    });
}

// Has the kit fetch the next ad of a kind. When it has none to give it is asked again after a
// wait, which doubles each time up to ten minutes.
function makeReady(kind) {
  if (phone.fetching[kind]) return;
  phone.fetching[kind] = true;
  clearTimeout(phone.retry[kind]);
  askKit(kind === 'rewarded' ? 'prepareRewardVideoAd' : 'prepareInterstitial', { adId: ADS[kind] })
    .then(() => {
      phone.ready[kind] = true;
      phone.wait[kind] = 0;
    })
    .catch(() => {
      phone.wait[kind] = clamp(phone.wait[kind] * 2, 30000, 600000);
      phone.retry[kind] = setTimeout(() => makeReady(kind), phone.wait[kind]);
    })
    .then(() => {
      phone.fetching[kind] = false;
    });
}

// Shows the ad that is ready, which comes up at once. The kit says when it has been closed, and
// for an ad that was chosen whether it was watched far enough to earn.
function playOnPhone(kind, heard) {
  Object.assign(phone, { heard, kind, earned: false });
  phone.ready[kind] = false;
  heard.adStarted();
  askKit(kind === 'rewarded' ? 'showRewardVideoAd' : 'showInterstitial')
    .then(() => {
      if (kind === 'rewarded') phone.earned = true;
    })
    // An ad closed early is refused here as well as being reported closed. Either ends it.
    .catch((err) => endOnPhone(err && err.code === 'REWARDED_AD_CANCELLED' ? 'early' : 'unfilled'));
}

function endOnPhone(code) {
  const heard = phone.heard;
  if (!heard) return;
  phone.heard = null;
  if (code) heard.adError({ code });
  else heard.adFinished();
  makeReady(phone.kind);
}

// Apple's own question about a rating, which it shows or not as it sees fit and never more than
// three times in a year. It is put a moment after a sheet with good news on it, once the player
// has climbed ten times, and not again for sixty days. Nothing is given for answering it.
const ASKED_KEY = 'rooftop-robin-asked';

function askRating() {
  if (!phone.rates || save.plays < 10 || phone.form || phone.follow || phone.asking) return;
  let last = 0;
  try {
    last = Number(localStorage.getItem(ASKED_KEY)) || 0;
  } catch (err) {
    return;
  }
  if (Date.now() - last < 60 * 86400000) return;
  setTimeout(() => {
    if (state !== 'over' || portal.busy) return;
    try {
      localStorage.setItem(ASKED_KEY, String(Date.now()));
    } catch (err) {
      return;
    }
    phone.kit.nativePromise('InAppReview', 'requestReview', {}).catch(() => {});
  }, 1200);
}

// A visit, as far as the counting of ads goes, is over once the app has been put away for five
// minutes. Ads kept ready for as long as that may have gone stale, so fresh ones are fetched.
function wentAway() {
  if (!phone.leftAt) phone.leftAt = Date.now();
}

function cameBack() {
  const away = phone.leftAt ? Date.now() - phone.leftAt : 0;
  phone.leftAt = 0;
  if (away < 300000) return;
  Object.assign(portal, { since: performance.now(), climbs: 0, sheets: 0, forced: 0 });
  if (!phone.started) {
    readPhone();
    return;
  }
  makeReady('rewarded');
  makeReady('midgame');
}

// Everything the game plays goes out through one gate, so that this one number sets how loud it is.
const VOLUME = 0.5;
const audio = {
  ctx: null, out: null, master: null, fader: null, jingles: null, band: null, echo: null, reed: null, waver: null, noise: null, take: null, air: null,
  asleepSince: 0, fault: ''
};

// Browsers keep a page silent until it has been touched, so every tap, click and key press calls this.
// Waking or closing a context is answered later. A refusal needs nothing doing, as the next touch
// tries again, so it is let go rather than left to show as an error.
function quietly(answer) {
  if (answer && answer.catch) answer.catch(() => {});
}

function wakeAudio() {
  if (!save.sound && !save.bells) return;
  try {
    // Some phones leave the audio stuck asleep once the app has been away. If one touch has not
    // woken it within a second and a half, the next touch starts again with a fresh context.
    if (audio.ctx && audio.ctx.state !== 'running' && audio.asleepSince && performance.now() - audio.asleepSince > 1500) {
      quietly(audio.ctx.close());
      audio.ctx = null;
    }
    if (!audio.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audio.ctx = new Ctx();
      audio.out = audio.ctx.createGain();
      audio.out.gain.value = portal.muted || portal.hush ? 0 : VOLUME;
      audio.out.connect(audio.ctx.destination);
      audio.master = audio.ctx.createGain();
      audio.master.gain.value = 0.22;
      audio.master.connect(audio.out);
      audio.asleepSince = 0;
      audio.fader = null;
      audio.fault = '';
      Object.assign(bells, { ringing: false, scene: 'off', level: 0 });
      try {
        Object.assign(audio, bellsRig(audio.ctx, audio.out));
      } catch (err) {
        // The effects still play if the bells cannot be built.
        audio.fault = err.name;
      }
    }
    if (audio.ctx.state === 'running') {
      audio.asleepSince = 0;
    } else {
      quietly(audio.ctx.resume());
      if (!audio.asleepSince) audio.asleepSince = performance.now();
    }
  } catch (err) {
    audio.ctx = null;
    audio.fault = err.name;
  }
}

// One enveloped oscillator note. Every sound effect is built from these.
function ping(out, hz, at, dur, vol, type = 'sine', slideTo = hz) {
  const osc = audio.ctx.createOscillator();
  const gain = audio.ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(hz, at);
  if (slideTo !== hz) osc.frequency.exponentialRampToValueAtTime(slideTo, at + dur);
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(vol, at + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(gain).connect(out);
  osc.start(at);
  osc.stop(at + dur + 0.02);
}

function tone(from, to, dur, type = 'sine', vol = 0.6, delay = 0) {
  if (!save.sound || !audio.ctx) return;
  ping(audio.master, from, audio.ctx.currentTime + delay, dur, vol, type, to);
}

function hiss(dur, vol) {
  if (!save.sound || !audio.ctx) return;
  const length = Math.floor(audio.ctx.sampleRate * dur);
  const buffer = audio.ctx.createBuffer(1, length, audio.ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
  const src = audio.ctx.createBufferSource();
  const filter = audio.ctx.createBiquadFilter();
  const gain = audio.ctx.createGain();
  filter.type = 'highpass';
  filter.frequency.value = 2400;
  gain.gain.value = vol;
  src.buffer = buffer;
  src.connect(filter).connect(gain).connect(audio.master);
  src.start();
}

// Air rushing past, on a ride or at the start of a new stage: noise that swells and dies away,
// its pitch rising with the speed.
function rush(dur, vol = 0.16) {
  if (!save.sound || !audio.ctx) return;
  const now = audio.ctx.currentTime;
  const length = Math.floor(audio.ctx.sampleRate * dur);
  const buffer = audio.ctx.createBuffer(1, length, audio.ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
  const src = audio.ctx.createBufferSource();
  const filter = audio.ctx.createBiquadFilter();
  const gain = audio.ctx.createGain();
  filter.type = 'bandpass';
  filter.Q.value = 0.8;
  filter.frequency.setValueAtTime(260, now);
  filter.frequency.exponentialRampToValueAtTime(1400, now + dur * 0.5);
  filter.frequency.exponentialRampToValueAtTime(320, now + dur);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(vol, now + dur * 0.45);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.buffer = buffer;
  src.connect(filter).connect(gain).connect(audio.master);
  src.start();
}

const sfx = {
  bounce: () => tone(520, 360, 0.09, 'sine', 0.7),
  flap: () => tone(300, 520, 0.08, 'triangle', 0.5),
  // A berry sounds a note of the tune: the one it carries, or the one for its place in a run.
  berry: (streak, note) => {
    const hz = note || BERRY_NOTES[streak % BERRY_NOTES.length];
    tone(hz, hz, 0.16, 'sine', 0.5);
    tone(hz * 2, hz * 2, 0.06, 'sine', 0.14);
  },
  chime: () => {
    tone(1046, 1046, 0.7, 'sine', 0.7);
    tone(1568, 1568, 0.5, 'sine', 0.35, 0.02);
    tone(2093, 2093, 0.4, 'sine', 0.2, 0.04);
  },
  crack: () => hiss(0.14, 0.5),
  // A dark cloud going: a soft puff, and the first three notes of the tune for its silver lining.
  lining: () => {
    hiss(0.2, 0.28);
    BERRY_NOTES.slice(0, 3).forEach((hz, i) => tone(hz, hz, 0.16, 'sine', 0.45, i * 0.1));
  },
  pop: () => tone(340, 120, 0.12, 'square', 0.3),
  lift: () => tone(392, 784, 0.5, 'triangle', 0.5),
  ride: (span) => {
    tone(392, 784, 0.5, 'triangle', 0.5);
    rush(span);
  },
  gold: () => [1319, 1760, 2093, 2637].forEach((f, i) => tone(f, f, 0.18, 'sine', 0.4, i * 0.07)),
  // The bells at the star: twice up the chord, and then the whole chord left ringing.
  star: () => {
    [1047, 1319, 1568, 2093, 1568, 2093, 2637, 3136].forEach((f, i) => tone(f, f, 0.5, 'sine', 0.34, i * 0.15));
    [1047, 1319, 1568, 2093].forEach((f) => tone(f, f, 1.8, 'sine', 0.22, 1.35));
  },
  // Three notes up the chord the tune is in.
  layer: () => [587, 740, 880].forEach((f, i) => tone(f, f, 0.18, 'sine', 0.5, i * 0.09)),
  // A new stage arrives on a gust of wind.
  zone: () => {
    rush(1.3, 0.45);
    sfx.layer();
  },
  best: () => [880, 1175, 1480].forEach((f, i) => tone(f, f, i < 2 ? 0.14 : 0.45, 'triangle', 0.55, i * 0.08)),
  // Two soft notes for climbing past where the last climb ended.
  mark: () => [1175, 1760].forEach((f, i) => tone(f, f, 0.12, 'sine', 0.3, i * 0.07)),
  freeze: () => {
    hiss(0.3, 0.5);
    [2093, 1661, 1245].forEach((f, i) => tone(f, f * 0.94, 0.22, 'sine', 0.4, i * 0.06));
  },
  fall: () => tone(440, 110, 0.5, 'triangle', 0.6),
  buy: () => {
    tone(659, 659, 0.1, 'sine', 0.5);
    tone(988, 988, 0.16, 'sine', 0.5, 0.08);
  },
  cane: () => [1175, 1568, 2349].forEach((f, i) => tone(f, f, 0.12, 'sine', 0.45, i * 0.06)),
  gift: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.1, 'sine', 0.45, i * 0.05)),
  globe: () => {
    tone(1976, 1976, 0.5, 'sine', 0.4);
    tone(2960, 2960, 0.35, 'sine', 0.2, 0.03);
  },
  shatter: () => {
    hiss(0.2, 0.45);
    tone(2637, 1319, 0.25, 'sine', 0.4);
  },
  nope: () => tone(196, 160, 0.12, 'square', 0.22),
  // A run of high notes tumbling over one another, for something sparkling on its way down.
  shimmer: () => [3520, 2960, 3951, 2637, 3520, 2349, 2960, 1976, 2349, 1760].forEach((f, i) => tone(f, f, 0.3, 'sine', 0.4 - i * 0.02, i * 0.055)),
  // The sleigh comes over to the sound of its own bells.
  sleigh: () => {
    for (let i = 0; i < 6; i++) jingle((i * BEAT) / 2, 0.45 - i * 0.04);
  }
};

// The band. The game's tune is written out below as a score and played by the same small synth as
// the effects, so the game still ships no audio files. It goes round and round wherever the game
// is, one time as a music box over the sleigh bells and the next with the whole band, the robin
// whistling the tune, and it is kept well under the effects. A climb from the home screen starts
// it again from the top with the band.
const BEAT = 0.4;
const BELLS_LEVEL = 0.06;
const BAND_LEVEL = 0.3;
const NOTE_STEPS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

// The pitch in hertz of a note written as a letter, perhaps a sharp or a flat, and an octave.
function pitch(name) {
  const step = NOTE_STEPS[name[0]] + (name[1] === '#' ? 1 : name[1] === 'b' ? -1 : 0);
  return 440 * 2 ** ((step - 9) / 12 + Number(name.slice(-1)) - 4);
}

// Turns the bars of a part into lists of notes: the quaver each one starts on, its pitch, and how
// many quavers it lasts.
function score(bars) {
  return bars.map((bar) => {
    const notes = [];
    bar.split(' ').forEach((word, at) => {
      if (word === '-') notes[notes.length - 1][2]++;
      else if (word !== '.') notes.push([at, pitch(word), 1]);
    });
    return notes;
  });
}

// The tune is in D and sixteen bars long. Each line is one bar of eight quavers: a note name starts
// a note, a dash holds it and a dot is a rest. The first eight bars hop and the second eight soar.
const LEAD = score([
  'D5 - F#5 - A5 A5 B5 -',
  'C#6 C#6 B5 A5 E5 F#5 A5 -',
  'D5 - F#5 - B5 B5 D6 -',
  'E6 D6 B5 D6 B5 A5 G5 -',
  'D5 - F#5 - A5 A5 B5 -',
  'C#6 C#6 B5 A5 E5 F#5 A5 -',
  'B5 - D6 - E6 E6 C#6 -',
  'D6 D6 A5 F#5 A5 F#5 D5 -',
  'D6 - - - B5 D6 E6 D6',
  'C#6 - - - A5 - E6 -',
  'F#6 - - - E6 D6 E6 D6',
  'C#6 - - - A5 - - -',
  'D6 - - - B5 D6 E6 D6',
  'E6 - - - C#6 - E6 -',
  'D6 - D6 F6 E6 - E6 G6',
  'F#6 - - - - - . .'
]);
// How many beats it takes to go once round the tune.
const TURN = LEAD.length * 4;
// The notes of the tune in order, an octave up. A berry picked straight after another sounds the
// next one, so a line of berries plays the tune.
const BERRY_NOTES = LEAD.flatMap((bar) => bar.map(([, hz]) => hz * 2));
// Three presents call the sleigh. It takes a moment to arrive, and then carries the climber up
// 500 m over the first four bars of the tune.
const SLEIGH_NEEDS = 3;
const SLEIGH_WAIT = 0.9;
const SLEIGH_SPAN = 16 * BEAT;
const SLEIGH_RISE = 5000;
// How far through its climb the sleigh is, a part of the way through its time: slowly away, fast
// through the middle and gently to a stop.
const sleighPath = (u) => u * u * u * (u * (u * 6 - 15) + 10);
// A ride weaves about a line set back from the middle of the screen, away from the way the sleigh
// faces, so that the team out in front stays in the picture. Its first swing is backwards, while
// the sleigh is still slow and nearly level, which is when the team reaches furthest ahead.
const sleighWeave = (at, face) => W / 2 - face * (60 + 75 * Math.sin((at * TAU) / 3.2));
// Each chord is its bass note and the three notes held over it.
const CHORDS = {
  D: 'D3 F#4 A4 D5', A: 'A2 E4 A4 C#5', Bm: 'B2 F#4 B4 D5', G: 'G2 G4 B4 D5',
  'F#m': 'F#2 F#4 A4 C#5', Bb: 'Bb2 F4 Bb4 D5', C: 'C3 G4 C5 E5'
};
// The chords of the sixteen bars. A bar with two of them gives half to each.
const HARMONY = 'D A Bm G D A G+A D G A Bm F#m G A Bb+C D'.split(' ')
  .map((bar) => bar.split('+').map((name) => CHORDS[name].split(' ').map(pitch)));
// A strap of six small bells in two pitches, each a little out of tune with its neighbours as real
// ones are. Every bell also rings at the overtones listed, each a multiple of its pitch and a
// strength. The upper ones come in close pairs, as they do in a real bell.
const BELL_PITCHES = [2807, 2816, 2826, 3224, 3234, 3246];
const BELL_OVERTONES = [[1, 1], [2.01, 0.6], [2.58, 0.34], [2.66, 0.34], [3.5, 0.14], [3.95, 0.41], [4.06, 0.41], [4.41, 0.41], [4.49, 0.41]];
// How long before the loudest moment of a shake its sound begins.
const SHAKE_LEAD = 0.07;
const bells = { ringing: false, scene: 'off', level: 0, origin: 0, count: 0, cue: '', swinging: false };
const logoBells = document.querySelector('.bells');

// One bell struck once, as half a second of sound. It rings loudly for a hundredth of a second and
// then on quietly.
function bellRing(rate, pitch) {
  const ring = new Float32Array(Math.floor(rate * 0.5));
  for (let i = 0; i < ring.length; i++) {
    const t = i / rate;
    let sum = 0;
    for (const [times, strength] of BELL_OVERTONES) sum += strength * Math.sin(TAU * pitch * times * t);
    const loud = Math.exp(-t / 0.012) + 0.4 * Math.exp(-t / 0.16);
    ring[i] = sum * loud * Math.min(1, t / 0.001, (ring.length - i) / (rate * 0.02));
  }
  return ring;
}

// One shake of the strap is not one strike but a couple of dozen small ones. They gather over a few
// hundredths of a second as the strap swings, come thickest at the moment it turns, and trail off
// after. That gathering is what makes sleigh bells jingle. One clean strike sounds like a spoon on
// a bell.
function jingleSample(ctx, rings, seed) {
  const rand = mulberry32(seed);
  const rate = ctx.sampleRate;
  const sample = ctx.createBuffer(1, Math.floor(rate * 0.75), rate);
  const data = sample.getChannelData(0);
  const turn = Math.floor(rate * SHAKE_LEAD);
  const wait = (mean) => -Math.log(1 - rand()) * mean;
  for (let k = 0; k < 30; k++) {
    let from = turn;
    let size = 0.25 + 0.5 * rand();
    if (rand() < 0.25) {
      from += Math.floor(Math.min(wait(0.028), 0.12) * rate);
    } else {
      const early = Math.min(wait(0.026), SHAKE_LEAD - 0.005);
      from -= Math.floor(early * rate);
      size = (0.3 + 0.7 * rand()) * Math.exp(-early / 0.045);
    }
    const ring = rings[Math.floor(rand() * rings.length)];
    for (let i = 0; i < ring.length; i++) data[from + i] += size * ring[i];
    // Each small strike has a tick of the pellet with it: hiss with its lowest and highest
    // reaches taken off.
    let last = 0;
    let rattle = 0;
    for (let i = 0; i < rate * 0.03; i++) {
      const noise = rand() * 2 - 1;
      rattle += 0.4 * (noise - last - rattle);
      data[from + i] += size * 1.5 * rattle * Math.exp(-i / (rate * 0.008));
      last = noise;
    }
  }
  const peak = data.reduce((most, v) => Math.max(most, Math.abs(v)), 0);
  for (let i = 0; i < data.length; i++) data[i] /= peak;
  return sample;
}

function bellsRig(ctx, out) {
  const fader = ctx.createGain();
  fader.gain.value = 0;
  fader.connect(out);
  const rings = BELL_PITCHES.map((pitch) => bellRing(ctx.sampleRate, pitch));
  const jingles = [3, 7, 11, 19].map((seed) => jingleSample(ctx, rings, seed));
  // The band has a channel of its own, an echo a beat and a half behind the tune, a whistle's
  // tone and its slow waver, and a strip of hiss for the drums.
  const band = ctx.createGain();
  band.gain.value = 0;
  band.connect(out);
  const echo = ctx.createGain();
  const delay = ctx.createDelay(1);
  const again = ctx.createGain();
  echo.gain.value = 0.22;
  delay.delayTime.value = BEAT * 0.75;
  again.gain.value = 0.3;
  echo.connect(delay).connect(band);
  delay.connect(again).connect(delay);
  const reed = ctx.createPeriodicWave(new Float32Array(4), new Float32Array([0, 1, 0.16, 0.05]));
  const waver = ctx.createGain();
  const sway = ctx.createOscillator();
  waver.gain.value = 9;
  sway.frequency.value = 5.5;
  sway.connect(waver);
  sway.start();
  const noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return { fader, jingles, band, echo, reed, waver, noise, take: null, air: null };
}

// A fresh pair of channels for the band, one for the tune and one for everything else, with
// whatever was still sounding on the old pair faded out. The tune can then start again cleanly.
function retake(now) {
  for (const old of [audio.take, audio.air]) {
    if (!old) continue;
    old.gain.setTargetAtTime(0, now, 0.03);
    setTimeout(() => old.disconnect(), 600);
  }
  audio.take = audio.ctx.createGain();
  audio.air = audio.ctx.createGain();
  audio.take.connect(audio.band);
  audio.air.connect(audio.take);
  audio.air.connect(audio.echo);
}

// One held note: it comes in over "rise" seconds, stays level and lets go at the end. Its tone is
// one of the plain ones by name, or a wave of the band's own.
function hold(out, hz, at, dur, vol, tone, rise) {
  const osc = audio.ctx.createOscillator();
  const gain = audio.ctx.createGain();
  if (typeof tone === 'string') osc.type = tone;
  else osc.setPeriodicWave(tone);
  osc.frequency.setValueAtTime(hz, at);
  gain.gain.setValueAtTime(0, at);
  gain.gain.linearRampToValueAtTime(vol, at + rise);
  gain.gain.setValueAtTime(vol, at + dur - 0.06);
  gain.gain.linearRampToValueAtTime(0, at + dur);
  osc.connect(gain).connect(out);
  osc.start(at);
  osc.stop(at + dur + 0.02);
  return osc;
}

// One whistled note, which slides up into its pitch and wavers a little while it is held.
function whistle(hz, at, dur, vol) {
  const osc = hold(audio.air, hz, at, dur, vol, audio.reed, 0.02);
  osc.frequency.setValueAtTime(hz * 0.98, at);
  osc.frequency.exponentialRampToValueAtTime(hz, at + 0.03);
  audio.waver.connect(osc.detune);
}

// One stroke of a drum: a burst of hiss, kept to the part of the sound named by "kind" and "hz".
function tick(at, dur, vol, kind, hz) {
  const src = audio.ctx.createBufferSource();
  const filter = audio.ctx.createBiquadFilter();
  const gain = audio.ctx.createGain();
  src.buffer = audio.noise;
  filter.type = kind;
  filter.frequency.value = hz;
  gain.gain.setValueAtTime(vol, at);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  src.connect(filter).connect(gain).connect(audio.take);
  src.start(at);
  src.stop(at + dur + 0.02);
}

// Everything the band plays in one beat, which is two quavers of the score. Odd times round the
// tune are a music box. Even times are the whole band, which fills out for the second half.
function strike(n, at) {
  const full = n % (TURN * 2) >= TURN;
  const bar = Math.floor(n / 4) % LEAD.length;
  const quaver = (n % 4) * 2;
  const half = BEAT / 2;
  const chords = HARMONY[bar];
  const [bass, ...chord] = chords[quaver < 4 ? 0 : chords.length - 1];
  if (!quaver || (quaver === 4 && chords.length > 1)) {
    for (const hz of chord) hold(audio.take, hz, at, (8 / chords.length) * half, full ? 0.011 : 0.008, 'triangle', 0.06);
  }
  for (const [slot, hz, long] of LEAD[bar]) {
    if (slot !== quaver && slot !== quaver + 1) continue;
    const when = at + (slot - quaver) * half;
    if (full) {
      whistle(hz, when, long * half * 0.92, 0.045);
    } else {
      ping(audio.air, hz, when, 0.6 + long * half, 0.06);
      ping(audio.air, hz * 4, when, 0.12, 0.008);
    }
  }
  if (!full) return;
  // The bass bounces between the low note and the one an octave above it, and there is a drum on
  // every beat and a clap on every other one.
  ping(audio.take, bass, at, 0.22, 0.075, 'triangle');
  ping(audio.take, bass * 2, at + half, 0.2, 0.06, 'triangle');
  ping(audio.take, bass * 4, at + half, 0.1, 0.01, 'square');
  ping(audio.take, 150, at, 0.16, 0.11, 'sine', 45);
  if (n % 2) tick(at, 0.12, 0.05, 'bandpass', 1800);
  if (bar < 8) return;
  // The second half has a cymbal between the beats and a run of high notes from the chord.
  tick(at + half, 0.04, 0.018, 'highpass', 7000);
  [0, 1, 2, 1].forEach((note, k) => ping(audio.air, chord[note] * 4, at + (k * half) / 2, 0.1, 0.008));
}

// One shake of the sleigh bells among the effects, "delay" seconds from now.
function jingle(delay, vol) {
  if (!save.sound || !audio.ctx || !audio.jingles) return;
  const source = audio.ctx.createBufferSource();
  const gain = audio.ctx.createGain();
  source.buffer = audio.jingles[Math.floor(Math.random() * audio.jingles.length)];
  gain.gain.value = vol;
  source.connect(gain).connect(audio.master);
  source.start(audio.ctx.currentTime + delay);
}

function shake(count) {
  // The bells belong to the sleigh that crosses the moon, so they swell as it goes over.
  const pass = sleighPass();
  const near = pass < 0 ? 0 : Math.sin(pass * Math.PI);
  const source = audio.ctx.createBufferSource();
  const gain = audio.ctx.createGain();
  source.buffer = audio.jingles[Math.floor(Math.random() * audio.jingles.length)];
  // No hand shakes twice alike: each shake comes a touch early or late, and soft or firm.
  gain.gain.value = (0.4 + Math.random() * 0.6) * (0.7 + 0.3 * near);
  source.connect(gain).connect(audio.fader);
  source.start(Math.max(0, bells.origin + count * BEAT - SHAKE_LEAD + Math.random() * 0.04));
}

// Starts the band at one beat of the tune.
function strikeUp(from) {
  const now = audio.ctx.currentTime;
  bells.count = from;
  bells.origin = now + 0.12 - from * BEAT;
  retake(now);
}

// For a climb that has just beaten the best, the band jumps to the last four bars of the tune.
function fanfare() {
  if (bells.ringing) strikeUp(TURN * 2 - 16);
}

// Runs every frame. The tune goes round and round wherever the game is, well under the effects, so
// that the sound never drops away to nothing. A climb from the home screen starts it again from
// the top with the whole band. It is quiet while the game is paused and while the star's own
// bells ring.
function playBells() {
  const awake = Boolean(audio.ctx) && audio.ctx.state === 'running';
  const home = state === 'title' || state === 'wardrobe';
  // Browsers hold sound back until the page is touched, so the home screen says how to start it.
  // On a first visit the line has a better use: any touch starts the first climb.
  const starts = state === 'title' && !save.plays;
  const cue = audio.fault ? `Sound could not start (${audio.fault})` : starts ? `${press} anywhere to start` : save.bells && !awake ? `${press} anywhere for music` : '';
  if (cue !== bells.cue) {
    bells.cue = cue;
    $('cue').textContent = cue;
  }
  const heard = save.bells && home && awake && Boolean(audio.fader);
  if (heard !== bells.swinging) {
    bells.swinging = heard;
    logoBells.classList.toggle('ringing', heard);
  }
  if (!audio.fader) return;
  const now = audio.ctx.currentTime;
  const scene = !save.bells ? 'off' : home || state === 'tour' ? 'home' : 'climb';
  if (scene !== bells.scene) {
    // Switched on, the tune starts with the music box at home and with the band on a climb.
    if (bells.scene === 'off') strikeUp(scene === 'home' ? 0 : TURN);
    else if (scene === 'climb' && bells.scene === 'home') strikeUp(TURN);
    bells.scene = scene;
  }
  // The sleigh bells ring out on the home screen and sit back behind the band on a climb.
  const open = scene !== 'off' && state !== 'paused' && state !== 'finale';
  const level = !open ? 0 : scene === 'home' ? BELLS_LEVEL : BELLS_LEVEL / 2;
  if (level !== bells.level) {
    bells.level = level;
    audio.fader.gain.setTargetAtTime(level, now, level ? 0.1 : 0.08);
    audio.band.gain.setTargetAtTime(level ? BAND_LEVEL : 0, now, level ? 0.05 : 0.15);
  }
  bells.ringing = open;
  if (!open) return;
  // After a stall, such as a hidden tab or a pause, the beat is picked up from now with no catching up.
  const due = Math.ceil((now - 0.1 - bells.origin) / BEAT);
  if (due > bells.count) bells.count = due;
  while (bells.origin + bells.count * BEAT < now + 0.25) {
    shake(bells.count);
    strike(bells.count, bells.origin + bells.count * BEAT);
    bells.count++;
  }
}

// Every climb starts on the roof. One that rides up to a stage is set down on a wide ledge at that
// height, and "base" is where that is. The sky between the two is left empty.
function newWorld(seed, base = 0, twist = PLAIN) {
  const rand = mulberry32(seed);
  const plats = [{ type: 'roof', x: W / 2, y: 0, w: 150, vx: 0, alive: true, dip: 0 }];
  // On a wide playfield the houses next door are drawn as mirror images of the first, and their
  // roofs are as good to land on.
  if (field.lo < 0) for (const x of [-W / 2, W * 1.5]) plats.push({ type: 'roof', x, y: 0, w: 150, vx: 0, alive: true, dip: 0 });
  if (base) plats.push({ type: 'snow', x: W / 2, y: base, w: 150, vx: 0, alive: true, dip: 0 });
  return {
    rand,
    plats,
    items: [],
    foes: [],
    topY: base,
    chainX: W / 2,
    twist,
    findAt: base - (1400 + rand() * 600) / (twist.finds || 1),
    // The golden berry, in the climbs that have one, is somewhere in the first 900 m.
    goldAt: rand() < GOLD_ODDS ? base - 600 - rand() * 8400 : -Infinity,
    giftAt: -Infinity,
    frostAt: twist.foes ? base - 300 : Math.min(-2500, base - 600)
  };
}

// Every row adds one ledge within hopping range of the last, so the course is always climbable.
function extendWorld(w, untilY) {
  const rand = w.rand;
  const twist = w.twist;
  while (w.topY > untilY) {
    const climbed = -w.topY;
    const t = Math.min(1, climbed / 18000);
    // The very first climb starts gently. For its first 500 m the ledges are wider and nearer one
    // another, and what drifts, cracks or rings comes one thing at a time: clouds from 150 m, ice
    // from 300 m and a single chime ledge at 400 m.
    const soft = w.gentle && climbed < 5000;
    const gap = soft ? 46 + rand() * 32 : lerp(52, 86, t) + rand() * lerp(40, 68, t);
    const y = w.topY - gap;
    const x = clamp(w.chainX + (rand() * 2 - 1) * (soft ? 110 : lerp(150, 230, t)), field.lo + 46, field.hi - 46);
    const roll = rand();
    const drifting = 0.04 + lerp(0.1, 0.3, t);
    const zone = STAGES[stageAt(-y / 10)];

    // In the cloud bank nearly every ledge is a cloud, and most of them only idle along. About one
    // row in seven there is a dark one, which holds for a single landing.
    let type = 'snow';
    if (soft) {
      if (!w.rung && climbed > 4000) {
        type = 'chime';
        w.rung = true;
      } else if (climbed > 3000 && roll < 0.12) {
        type = 'ice';
      } else if (climbed > 1500 && roll < 0.2) {
        type = 'cloud';
      }
    } else if (climbed > 600 && roll < 0.04) type = 'chime';
    else if (zone.cloudy && roll < 0.19) type = 'storm';
    else if (zone.cloudy ? roll < 0.72 : climbed > 400 && roll < drifting) type = 'cloud';
    else if (climbed > 900 && roll < drifting + lerp(0.08, 0.3, t)) type = 'ice';
    if (twist.ledge && type !== 'chime') type = twist.ledge;
    // Power-ups and the golden berry sit over the usual kind of ledge, whatever that is today.
    const usual = twist.ledge || 'snow';

    const ledge = { type, x, y, w: type === 'chime' ? 48 : (lerp(78, 56, t) + rand() * 14 + (soft ? 22 : 0)) * (twist.narrow || 1), vx: 0, alive: true, dip: 0 };
    if (type === 'cloud' || type === 'storm') {
      ledge.vx = (rand() < 0.5 ? -1 : 1) * lerp(40, 105, t) * (0.7 + rand() * 0.6) * (soft ? 0.6 : 1);
      if (zone.cloudy) {
        ledge.w += 16 * (twist.narrow || 1);
        if (rand() < 0.6) ledge.vx *= 0.3;
      }
    }
    w.plats.push(ledge);

    // Berries are scarce by the rooftops and thicker higher up, and each is worth more in every
    // stage, so the higher the climb the faster they come in.
    const golden = type === usual && y < w.goldAt;
    if (type === 'chime') {
      for (let i = 1; i <= 5; i++) w.items.push({ kind: 'berry', worth: zone.worth, x, y: y - 40 - i * 52, bob: i });
    } else if (golden) {
      w.items.push({ kind: 'berry', worth: GOLD_WORTH, gold: true, x, y: y - 34, bob: rand() * TAU });
      w.goldAt = -Infinity;
    } else if (rand() < (twist.berries || 0.18 + 0.3 * ramp(-y, 0, 12000))) {
      w.items.push({ kind: 'berry', worth: zone.worth, x: x + (rand() - 0.5) * 30, y: y - 34, bob: rand() * TAU });
    }

    if (type === usual && !golden && y < w.giftAt) {
      w.items.push({ kind: 'gift', x, y: y - 58, bob: 0 });
      w.giftAt = -Infinity;
    } else if (type === usual && !golden && y < w.findAt) {
      let roll = rand();
      const kind = (FINDS.find(([, share]) => (roll -= share) < 0) || FINDS[0])[0];
      w.items.push({ kind, x, y: y - 58, bob: rand() * TAU });
      w.findAt = y - (1700 + rand() * 1500) / (twist.finds || 1);
    }

    if (rand() < (zone.cloudy ? 0.45 : lerp(0.55, 0.12, t))) {
      const spareX = clamp(field.lo + ((x - field.lo + 120 + rand() * 180) % field.across), field.lo + 46, field.hi - 46);
      const spare = {
        type: climbed > (soft ? 3000 : 900) && rand() < 0.3 ? 'ice' : 'snow',
        x: spareX, y: y + gap * (0.3 + rand() * 0.4), w: 58 + rand() * 16, vx: 0, alive: true, dip: 0
      };
      if (zone.cloudy) Object.assign(spare, { type: 'cloud', w: spare.w + 16, vx: (rand() < 0.5 ? -1 : 1) * (10 + rand() * 16) });
      if (twist.ledge) Object.assign(spare, { type: twist.ledge, vx: twist.ledge === 'cloud' ? (rand() < 0.5 ? -1 : 1) * (20 + rand() * 40) : 0 });
      spare.w *= twist.narrow || 1;
      if (Math.abs(spareX - x) > 80) w.plats.push(spare);
    }

    // A wide playfield has another ledge in most rows, well off to one side, and sometimes a
    // berry over it to make the trip worth it.
    for (let more = Math.round(field.across / W) - 1; more > 0; more--) {
      if (rand() > 0.75) continue;
      const farX = clamp(field.lo + ((x - field.lo + field.across * (0.3 + rand() * 0.4)) % field.across), field.lo + 46, field.hi - 46);
      const far = {
        type: climbed > (soft ? 3000 : 900) && rand() < 0.3 ? 'ice' : 'snow',
        x: farX, y: y + gap * (rand() - 0.5) * 0.8, w: 60 + rand() * 18, vx: 0, alive: true, dip: 0
      };
      if (zone.cloudy) Object.assign(far, { type: 'cloud', w: far.w + 16, vx: (rand() < 0.5 ? -1 : 1) * (10 + rand() * 30) });
      if (twist.ledge) Object.assign(far, { type: twist.ledge, vx: twist.ledge === 'cloud' ? (rand() < 0.5 ? -1 : 1) * (20 + rand() * 40) : 0 });
      far.w *= twist.narrow || 1;
      w.plats.push(far);
      if (rand() < 0.3) w.items.push({ kind: 'berry', worth: zone.worth, x: farX, y: far.y - 34, bob: rand() * TAU });
    }

    if (y < w.frostAt && (rand() < lerp(0.06, 0.17, t) * (twist.foes || 1) || (w.gentle && !w.met))) {
      w.met = true;
      w.foes.push({
        x: field.lo + 40 + rand() * (field.across - 80), y: y - gap * 0.4,
        vx: (rand() < 0.5 ? -1 : 1) * lerp(30, 80, t), spin: rand() * TAU, alive: true
      });
      // Frostlings keep their distance from one another, so the early ones arrive one at a time.
      w.frostAt = y - lerp(520, 220, t) / (twist.foes || 1);
    }

    w.chainX = x;
    w.topY = y;
  }
}

// Scatters bits from a point. "lift" throws them upwards as well, which turns a burst into a fountain.
function burst(kind, x, y, count, colour, lift = 60) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TAU;
    const speed = 40 + Math.random() * 110;
    particles.push({
      kind, colour, x, y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - lift,
      life: 0, ttl: 0.35 + Math.random() * 0.3, size: 2 + Math.random() * 2.5
    });
  }
}

// A ring that widens and fades, for the moment something is caught or broken.
function ripple(x, y, colour, size = 46) {
  particles.push({ kind: 'ring', colour, x, y, vx: 0, vy: 0, life: 0, ttl: 0.3 + size / 380, size });
}

function flap() {
  if (state !== 'run' || player.flapped || player.lift > 0 || player.ride || player.sleigh) return;
  player.flapped = true;
  if (run.hopAt < 0) run.hopAt = run.metres;
  player.vy = Math.max(player.vy - FLAP, -900);
  player.wing = 1;
  sfx.flap();
  buzz('LIGHT');
  burst('puff', player.x, player.y - 6, 3, C.snow);
}

function land(p) {
  player.y = p.y;
  player.vy = p.type === 'chime' ? -CHIME_BOUNCE : -BOUNCE;
  player.flapped = false;
  player.squash = 1;
  p.dip = 1;
  burst('puff', player.x, p.y, 4, C.snow);
  buzz('LIGHT');
  if (save.gifts >= SLEIGH_NEEDS) callSleigh();
  if (p.type === 'chime') {
    // A chime launch is too fast to steer, so nothing can freeze the climber on the way up.
    player.guard = 0.8;
    run.chimes++;
    tallyToday('chime');
    save.met.chime = (save.met.chime || 0) + 1;
    if (save.met.chime <= 2) hint('A chime ledge throws you high.');
    sfx.chime();
    burst('chip', p.x, p.y, 8, C.gold);
  } else if (p.type === 'storm') {
    // A dark cloud holds for one landing. It goes in a puff and pays out its silver lining: three
    // berries at the going rate.
    p.alive = false;
    const lining = 3 * worthNow();
    earn(lining);
    save.met.storm = (save.met.storm || 0) + 1;
    if (save.met.storm <= 3) hint('A dark cloud bursts under you. Its silver lining is yours.');
    sfx.lining();
    // It comes apart into puffs right across its width, which spread and thin out.
    for (let i = 0; i < 9; i++) {
      const across = i / 8 - 0.5;
      particles.push({
        kind: 'mist', colour: i % 2 ? C.stormShade : C.storm, x: p.x + across * p.w, y: p.y + 10 - Math.random() * 8,
        vx: across * 150, vy: -10 - Math.random() * 30, life: 0, ttl: 0.45 + Math.random() * 0.2, size: 7 + Math.random() * 4
      });
    }
    burst('glint', p.x, p.y, 8, C.snow, 20);
    particles.push({ kind: 'plus', text: `+${lining}`, colour: C.snow, x: p.x, y: p.y - 14, vx: 0, vy: -55, life: 0, ttl: 0.9, size: 15 });
    paintHud();
  } else if (p.type === 'ice') {
    p.alive = false;
    run.cracks++;
    tallyToday('crack');
    save.met.ice = (save.met.ice || 0) + 1;
    if (save.met.ice <= 2) hint('Ice holds for one landing, then cracks.');
    sfx.crack();
    burst('chip', p.x, p.y + 4, 9, C.ice);
  } else {
    if (p.type === 'cloud' && p.vx) {
      save.met.cloud = (save.met.cloud || 0) + 1;
      if (save.met.cloud <= 2) hint('Clouds drift. Ride along, or hop off.');
    }
    sfx.bounce();
  }
}

function earn(berries) {
  run.berries += berries;
  save.sum.berries += berries;
  tallyToday('hoard', berries);
}

// What each power-up does when the climber touches it, and the show it puts on.
function take(it) {
  if (it.kind === 'feather') {
    player.lift = kit('feather');
    player.flapped = false;
    sfx.lift();
    ripple(it.x, it.y, C.gold);
    burst('feather', it.x, it.y, 9, C.gold);
  } else if (it.kind === 'cane') {
    player.pull = kit('cane');
    sfx.cane();
    ripple(it.x, it.y, C.berry);
    burst('chip', it.x, it.y, 7, C.berry);
    burst('chip', it.x, it.y, 7, C.snow);
  } else if (it.kind === 'gift') {
    const inside = kit('gift') * worthNow();
    earn(inside);
    sfx.gift();
    ripple(it.x, it.y, C.gold);
    // The lid comes off and the berries go up like a fountain.
    burst('fruit', it.x, it.y, 12, C.berry, 240);
    burst('chip', it.x, it.y, 8, C.gold, 160);
    particles.push({ kind: 'plus', text: `+${inside}`, colour: C.snow, x: it.x, y: it.y - 16, vx: 0, vy: -55, life: 0, ttl: 1, size: 17 });
  } else {
    player.globe = kit('globe');
    sfx.globe();
    ripple(it.x, it.y, C.ice);
    burst('chip', it.x, it.y, 8, C.snow);
  }
  run.finds++;
  tallyToday('find');
  save.met[it.kind] = (save.met[it.kind] || 0) + 1;
  // Every present caught on an ordinary climb is one towards a sleigh ride, from one climb to the
  // next, and the third calls the sleigh.
  const counted = it.kind === 'gift' && !run.daily;
  if (counted) {
    save.gifts = Math.min(SLEIGH_NEEDS, save.gifts + 1);
    if (save.gifts >= SLEIGH_NEEDS) callSleigh();
    paintGifts();
  }
  if (save.met[it.kind] <= 3 || counted) hint(FIND_SAYS[it.kind]());
}

// The sleigh comes for a climber with three presents in hand, unless they are already being
// carried, in which case it comes when they next land.
function callSleigh() {
  if (state !== 'run' || run.daily || player.sleigh || player.ride) return;
  save.gifts = 0;
  save.met.sleigh = (save.met.sleigh || 0) + 1;
  // It comes in from the nearer side and flies with its nose towards the middle of the screen.
  player.sleigh = { t: 0, from: 0, x: 0, face: player.x > W / 2 ? -1 : 1, started: false };
  player.lift = 0;
  paintGifts();
  toast('Sleigh ride', true);
  sfx.sleigh();
}

// The ride. While the sleigh is on its way the climber hangs in the air. Then it climbs for four
// bars, and the band goes back to the top of the tune to play them. On its path there is a berry
// for every note of those bars, each one placed where the sleigh will be as the band plays that
// note and carrying the note, so catching them plays the tune along with the band. The climber
// steers from side to side to stay on the path. At the top they are set down on a wide ledge.
function sleighUp(dt) {
  const s = player.sleigh;
  s.t += dt;
  player.guard = 0.8;
  player.flapped = false;
  player.face = s.face;
  if (s.t < SLEIGH_WAIT) {
    player.vy = approach(player.vy, -40, 3000 * dt);
    return;
  }
  if (!s.started) {
    s.started = true;
    s.from = player.y;
    s.x = player.x;
    LEAD.slice(0, 4).forEach((bar, n) => {
      for (const [slot, hz] of bar) {
        // The band's first note comes a moment after it is asked for. A berry is caught as it
        // comes within reach, so it sits that much further up the path than the sleigh will be.
        const at = 0.12 + ((n * 8 + slot) * BEAT) / 2;
        const y = s.from - SLEIGH_RISE * sleighPath(at / SLEIGH_SPAN) - 38;
        const x = lerp(s.x, sleighWeave(at, s.face), ramp(at, 0, 1.4));
        world.items.push({ kind: 'berry', worth: STAGES[stageAt(-y / 10)].worth, x, y, bob: 0, note: hz * 2, trail: true });
      }
    });
    if (bells.ringing) strikeUp(TURN);
    rush(SLEIGH_SPAN);
  }
  const u = Math.min(1, (s.t - SLEIGH_WAIT) / SLEIGH_SPAN);
  player.vy = (s.from - SLEIGH_RISE * sleighPath(u) - player.y) / dt;
  if (Math.random() < 0.6) burst('chip', player.x - s.face * 30, player.y - 6, 1, C.gold);
  if (u < 1) return;
  player.sleigh = null;
  player.vy = -260;
  player.guard = 1.2;
  world.plats.push({ type: 'snow', x: clamp(player.x, field.lo + 80, field.hi - 80), y: player.y + 46, w: 150, vx: 0, alive: true, dip: 0 });
  // Its wake clears the frostlings out of the sky the climber is set down in.
  for (const f of world.foes) {
    if (!f.alive || f.y > player.y + 160 || f.y < player.y - 560) continue;
    f.alive = false;
    burst('chip', f.x, f.y, 9, C.frost);
  }
  departing = { x: player.x, y: player.y, face: s.face, t: 0 };
}

// The snow globe takes the blow in the climber's place, and is gone.
function shatter() {
  player.globe = 0;
  player.guard = 0.8;
  sfx.shatter();
  ripple(player.x, player.y - 14, C.ice);
  burst('chip', player.x, player.y - 14, 12, C.ice);
}

function die(cause) {
  state = 'falling';
  run.cause = cause;
  run.deadFor = 0;
  if (cause === 'frozen') {
    player.frozen = true;
    player.vy = -380;
    sfx.freeze();
  }
  sfx.fall();
  buzz('HEAVY');
}

// A ride carries the climber from the roof to just above the first ledge of the stage, gathering
