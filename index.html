// speed and then easing off, and sets them down over the middle of it.
function rideUp(dt) {
  const ride = player.ride;
  ride.t += dt;
  const u = Math.min(1, ride.t / ride.span);
  const height = ride.top * (u * u * u * (u * (u * 6 - 15) + 10));
  const sway = u * TAU * 1.5;
  player.vy = (height - player.y) / dt;
  player.x = W / 2 + Math.sin(sway) * 40 * (1 - u);
  player.face = Math.cos(sway) < 0 ? -1 : 1;
  player.wing = (ride.t * 3) % 1;
  player.guard = 0.8;
  if (Math.random() < 0.6) burst('chip', player.x, player.y, 1, C.gold);
  if (u < 1) return;
  player.ride = null;
  player.vy = -260;
  const stage = STAGES[stageAt(run.base)];
  toast(stage.name);
  hint(`Berries count ${stage.worth} each up here.`);
  sfx.layer();
}

function stepRun(dt) {
  const w = world;
  const riding = Boolean(player.ride);
  run.t += dt;

  for (const p of w.plats) {
    if (p.vx) {
      const edge = p.w / 2 + 6;
      p.x += p.vx * dt;
      if (p.x < field.lo + edge || p.x > field.hi - edge) {
        p.vx = -p.vx;
        p.x = clamp(p.x, field.lo + edge, field.hi - edge);
      }
    }
    if (p.dip > 0) p.dip = Math.max(0, p.dip - dt * 7);
  }
  for (const f of w.foes) {
    f.x += f.vx * dt;
    if (f.x < field.lo + 22 || f.x > field.hi - 22) {
      f.vx = -f.vx;
      f.x = clamp(f.x, field.lo + 22, field.hi - 22);
    }
    f.spin += dt * 1.3;
  }

  // On the way up a ride does the steering.
  if (riding) {
    player.vx = 0;
  } else if (steer === 'keys') {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    player.vx = approach(player.vx, dir * 340, (dir ? 2600 : 1900) * dt);
    player.x += player.vx * dt;
  } else if (steer === 'mouse' && !pointer.locked && pointer.mouseX !== null) {
    // The climber keeps under the pointer, as closely as under a finger.
    const off = clamp(pointer.mouseX, field.lo + 8, field.hi - 8) - player.x;
    const want = Math.abs(off) < 1 ? 0 : clamp(off * 60, -6000, 6000);
    player.vx = approach(player.vx, want, 300000 * dt);
    player.x += player.vx * dt;
  }
  // The sleigh keeps to the screen, and far enough back on it that its team does too. A climber
  // on foot who goes off one side comes back on the other.
  if (player.sleigh) {
    const ahead = W / 2 + player.sleigh.face * 30;
    player.x = player.sleigh.face > 0 ? clamp(player.x, field.lo + 36, ahead) : clamp(player.x, ahead, field.hi - 36);
  } else if (player.x < field.lo - 10) player.x += field.across + 20;
  else if (player.x >= field.hi + 10) player.x -= field.across + 20;
  if (Math.abs(player.vx) > 30) player.face = player.vx > 0 ? 1 : -1;

  const before = player.y;
  if (riding) {
    rideUp(dt);
  } else if (player.sleigh) {
    sleighUp(dt);
  } else if (player.lift > 0) {
    player.lift -= dt;
    player.guard = 0.6;
    player.vy = -LIFT_SPEED;
    if (Math.random() < 0.5) burst('chip', player.x, player.y, 1, C.gold);
  } else {
    player.guard = Math.max(0, player.guard - dt);
    player.vy += GRAVITY * (run.twist.gravity || 1) * dt;
  }
  player.y += player.vy * dt;
  // A candy cane or a globe that runs out goes with a puff.
  if ((player.pull > 0 && player.pull <= dt) || (player.globe > 0 && player.globe <= dt)) burst('puff', player.x, player.y - 14, 5, C.snow);
  player.pull = Math.max(0, player.pull - dt);
  player.globe = Math.max(0, player.globe - dt);
  player.squash = Math.max(0, player.squash - dt * 5);
  player.wing = Math.max(0, player.wing - dt * 3.4);

  if (player.vy > 0) {
    for (const p of w.plats) {
      if (!p.alive || before > p.y || player.y < p.y || Math.abs(player.x - p.x) > p.w / 2 + 9) continue;
      land(p);
      break;
    }
  }

  for (const it of w.items) {
    if (it.taken) continue;
    let dx = player.x - it.x;
    let dy = player.y - 14 - it.y;
    if (it.sent) {
      // A present from the sleigh falls free for a moment and then makes its way to the climber,
      // quicker the further it has to go.
      it.age += dt;
      const far = Math.hypot(dx, dy);
      const step = it.age < 0.5 ? 0 : Math.min(far, clamp(far * 1.2, 110, 300) * dt) / (far || 1);
      it.x += dx * step;
      it.y += dy * step + (it.age < 0.5 ? 60 * dt : 0);
      dx = player.x - it.x;
      dy = player.y - 14 - it.y;
      if (Math.random() < 0.2) spark(it.x, it.y, (Math.random() - 0.5) * 50);
    }
    if (player.pull > 0 && it.kind === 'berry' && !(it.trail && player.sleigh)) {
      // A candy cane draws in every berry within reach, but leaves the trail of a ride where it
      // is, on the beat.
      const far = Math.hypot(dx, dy);
      if (far > 1 && far < PULL_REACH) {
        const step = Math.min(far, 640 * dt) / far;
        it.x += dx * step;
        it.y += dy * step;
        dx -= dx * step;
        dy -= dy * step;
        if (Math.random() < 0.06) burst('chip', it.x, it.y, 1, C.snow);
      }
    }
    // From the sleigh a berry of its trail is caught as it comes level, anywhere under the sleigh.
    if (it.trail && player.sleigh ? Math.abs(dx) > 44 || dy > 24 || dy < -40 : dx * dx + dy * dy > 576) continue;
    it.taken = true;
    if (it.kind === 'berry') {
      run.streak = run.t - run.lastBerry < 0.7 ? run.streak + 1 : 0;
      run.lastBerry = run.t;
      earn(it.worth);
      if (it.gold) {
        sfx.gold();
        burst('chip', it.x, it.y, 14, C.gold);
        save.met.gold = (save.met.gold || 0) + 1;
        if (save.met.gold <= 3) hint(`A golden berry. Worth ${GOLD_WORTH}.`);
      } else {
        sfx.berry(run.streak, it.note);
        burst('chip', it.x, it.y, 4, C.berry);
      }
      if (it.worth > 1) {
        particles.push({
          kind: 'plus', text: `+${it.worth}`, colour: it.gold ? C.gold : C.snow, x: it.x, y: it.y - 12,
          vx: 0, vy: -55, life: 0, ttl: it.gold ? 1.1 : 0.7, size: it.gold ? 18 : 13
        });
      }
    } else {
      take(it);
    }
    paintHud();
  }

  if (!run.warned && save.plays < 8 && w.foes.some((f) => f.y > cam.y)) {
    run.warned = true;
    hint(`Frostling ahead. ${{ keys: 'Press Space', mouse: 'Click', touch: 'Tap' }[steer]} to hop through it, or land on it.`);
  }
  for (const f of w.foes) {
    if (!f.alive) continue;
    const dx = player.x - f.x;
    const dy = player.y - 14 - f.y;
    if (dx * dx + dy * dy > 625) continue;
    // A frostling only bites a slow climber: land on it, tap through it, or hit it at speed.
    const stomped = player.vy > 0 && dy < 2;
    const charging = player.guard > 0 || player.wing > 0.2 || player.vy < -BOUNCE - 20;
    if (!stomped && !charging) {
      if (player.globe <= 0) {
        die('frozen');
        return;
      }
      shatter();
    }
    f.alive = false;
    sfx.pop();
    burst('chip', f.x, f.y, 9, C.frost);
    run.pops++;
    tallyToday('pop');
    earn(3 * worthNow());
    paintHud();
    if (stomped) {
      player.vy = -760;
      player.flapped = false;
      player.squash = 1;
    }
  }

  if (player.y < run.peak) run.peak = player.y;
  const lead = player.y - view.h * 0.45;
  if (lead < cam.y) cam.y = lead;
  extendWorld(w, cam.y - 400);

  const metres = Math.floor(-run.peak / 10);
  if (metres !== run.metres) {
    // Metres ridden are not metres climbed, and the stages a ride passes go by unannounced.
    if (!riding) {
      save.sum.metres += metres - run.metres;
      tallyToday('far', metres - run.metres);
    }
    run.metres = metres;
    paintHud();
    while (run.stage < STAGES.length && metres >= STAGES[run.stage].at) {
      if (!riding) {
        toast(STAGES[run.stage].name);
        // The star is where the climb ends, so there are no berries to count beyond it.
        if (run.stage < STAGES.length - 1) hint(`Berries count ${STAGES[run.stage].worth} each from here.`);
        sfx.zone();
        if (!calm) shooting = { t: 0 };
      }
      run.stage++;
      $('hud-stage').textContent = STAGES[run.stage - 1].name;
    }
    if (!run.beaten && run.mark > 0 && metres > run.mark) {
      run.beaten = true;
      run.snap = run.t;
      strung(run.mark).forEach(([x, y, colour]) => burst('chip', x, y, 2, colour, 30));
      toast('New best', true);
      celebrate();
      cheerPortal();
    }
    if (!run.passed && run.fell > 0 && metres > run.fell) {
      run.passed = true;
      if (pennant()) {
        ripple(38, -(run.fell + 1) * 10 + 6, C.ice, 30);
        burst('chip', 38, -(run.fell + 1) * 10 + 6, 6, C.ice, 30);
        sfx.mark();
      }
    }
  }

  if (run.metres >= STAGES[STAGES.length - 1].at) {
    arrive();
    return;
  }

  if (player.y > cam.y + view.h + 50) {
    if (player.globe > 0) {
      // The globe carries the climber back up from a fall, once.
      shatter();
      player.lift = 0.6;
      player.flapped = false;
      sfx.lift();
    } else if (run.first && !run.caught) {
      // On the very first climb, the first slip is forgiven: the climber is carried back up.
      run.caught = true;
      player.lift = 0.6;
      player.flapped = false;
      player.guard = 1.2;
      sfx.lift();
      ripple(player.x, player.y - 14, C.gold);
      hint('Caught you. Steer onto a ledge on the way down.');
    } else {
      die('fell');
    }
  }
}

// The end of the climb. At the Christmas star the climber is drawn up to its heart, the star
// flares, the bells ring out and gold comes down like snow, and then the result is shown.
function arrive() {
  state = 'finale';
  player.sleigh = null;
  run.cause = 'star';
  glory = { t: 0, rings: 0, x: player.x, y: player.y };
  keys.left = keys.right = false;
  sfx.star();
  cheerPortal();
}

// The show at the star, which the tour puts on as well: rings spreading from its heart and a drift
// of gold across the sky.
function stepGlory(dt) {
  const heart = cam.y + view.h * 0.2;
  glory.t += dt;
  if (glory.t > glory.rings * 0.5 && glory.rings < 9) {
    glory.rings++;
    ripple(W / 2, heart, '#ffd98a', 70 + glory.rings * 26);
  }
  if (Math.random() < dt * 40) burst('feather', field.lo + Math.random() * field.across, cam.y + Math.random() * view.h * 0.6, 1, '#ffd98a', 0);
}

function stepFinale(dt) {
  stepGlory(dt);
  const up = ramp(glory.t, 0, 1.8);
  const ease = up * up * (3 - 2 * up);
  player.x = lerp(glory.x, W / 2, ease);
  player.y = lerp(glory.y, cam.y + view.h * 0.2 + 44, ease) + Math.sin(glory.t * 2.2) * 3 * up;
  player.vy = up < 1 ? -420 : 0;
  player.face = 1;
  player.wing = (glory.t * 2.4) % 1;
  if (glory.t > 4.8) endRun();
}

function stepFall(dt) {
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  player.spin += dt * 9 * player.face;
  run.deadFor += dt;
  if (run.deadFor > 1.1 || (run.deadFor > 0.35 && player.y > cam.y + view.h + 90)) endRun();
}

function idle(dt) {
  if (state === 'over') return;
  cam.y = lerp(cam.y, -view.h * rest[state], Math.min(1, dt * 7));
  // The wardrobe looks at the climber close up.
  cam.zoom = lerp(cam.zoom, state === 'wardrobe' ? 1.7 : 1, Math.min(1, dt * 7));
  // The climber hops on the spot, landing on every other shake when the sleigh bells are going.
  const span = 2 * BEAT;
  const inTime = bells.ringing && audio.ctx.state === 'running';
  const beat = inTime ? (((audio.ctx.currentTime - bells.origin + 0.36) % span) + span) % span : clock % 1.8;
  player.y = beat < 0.36 ? -Math.sin((beat / 0.36) * Math.PI) * 11 : 0;
  // On the home screen the climber leans back to look up at the star. In the wardrobe they turn to
  // show both sides.
  const gazing = state === 'title';
  player.face = gazing || clock % 7.2 < 3.6 ? 1 : -1;
  player.spin = gazing ? -0.3 + Math.sin(clock * 0.8) * 0.04 : 0;
}

function cull() {
  const floor = cam.y + view.h + 140;
  world.plats = world.plats.filter((p) => p.alive && p.y < floor);
  world.items = world.items.filter((it) => !it.taken && it.y < floor);
  world.foes = world.foes.filter((f) => f.alive && f.y < floor);
}

function startRun(daily, device) {
  endOpening();
  const day = todayKey();
  if (!portal.since) portal.since = performance.now();
  // Climbing again straight from the result sheet starts from the next place.
  if (state === 'over') newCity();
  glory = null;
  flypast = null;
  shooting = null;
  departing = null;
  // The daily climb is the same for everyone, so nobody rides up in it.
  const from = daily ? 0 : startStage();
  const base = STAGES[from].at;
  dealToday();
  if (from) {
    // A ride is bought one climb at a time, so the next climb is back to starting on foot.
    save.berries -= rideCost(from);
    save.from = 0;
    persist();
  }
  const twist = daily ? twistOf(day) : PLAIN;
  world = newWorld(daily ? hashString(`robin ${day}`) : (Math.random() * 2 ** 32) >>> 0, -base * 10, twist);
  // Until a player has picked their first golden berry, every climb has one a little way up.
  if (!daily && !save.met.gold) world.goldAt = -base * 10 - 250 - Math.random() * 350;
  // And until they have had their first sleigh ride, every climb has a present lower still.
  if (!daily && !save.met.sleigh) world.giftAt = -base * 10 - 500 - Math.random() * 500;
  // The very first climb starts gently, and its first frostling waits until 320 m.
  if (!daily && !save.plays) Object.assign(world, { gentle: true, frostAt: -3200 });
  run = {
    daily, day, base, twist,
    mark: daily ? (save.day === day ? save.dayBest : 0) : save.best,
    t: 0, metres: 0, peak: 0, berries: 0, streak: 0, lastBerry: -1,
    stage: 1, beaten: false, warned: false, cause: '', deadFor: 0,
    pops: 0, chimes: 0, cracks: 0, finds: 0, hopAt: -1, extra: 0, over: false, carried: false, banked: 0,
    // The very first climb forgives one slip.
    first: !daily && !save.plays, caught: false,
    // Where the last climb ended, whether this one has passed it, and when the string of lights
    // at the best was snapped.
    fell: daily ? 0 : save.fell, passed: false, snap: -1,
    // Whether an ad has doubled what the climb picked.
    doubled: false
  };
  Object.assign(player, {
    x: W / 2, y: 0, vx: 0, vy: -BOUNCE, face: 1,
    flapped: false, lift: 0, guard: 0, pull: 0, globe: 0, squash: 1, wing: 0, spin: 0, frozen: false,
    // The further the ride, the longer it takes: three seconds to open sky, six and a half to the comet.
    ride: from ? { top: -base * 10 - 46, t: 0, span: 2.5 + from * 0.5 } : null,
    sleigh: null
  });
  cam.y = -view.h * rest.title;
  cam.zoom = 1;
  particles.length = 0;
  keys.left = keys.right = false;
  pointer.id = null;
  dragDx = 0;
  acc = 0;
  steer = device;
  if (steer === 'mouse') holdPointer();
  extendWorld(world, cam.y - 400);
  state = 'run';
  $('hud-mode').hidden = !daily;
  $('hud-stage').textContent = STAGES[from].name;
  paintHud();
  paintGifts();
  paintKeys();
  show('hud');
  if (from) {
    sfx.ride(player.ride.span);
  } else {
    if (daily) {
      toast(twist.name);
      hint(twist.say);
    } else if (save.plays < 3) {
      coach(device);
    }
    sfx.bounce();
  }
  if (document.activeElement) document.activeElement.blur();
}

function endRun() {
  state = 'over';
  overAt = performance.now();
  run.over = true;
  const metres = run.metres;
  const mark = run.mark;
  // A climb that was carried on has had its first part banked already.
  save.berries += run.berries - run.banked;
  run.banked = run.berries;
  save.best = Math.max(save.best, metres);
  save.top = Math.max(save.top, stageAt(metres));
  save.plays++;
  const atStar = run.cause === 'star';
  if (atStar) save.stars++;
  if (run.daily) {
    save.day = run.day;
    save.dayBest = Math.max(mark, metres);
  } else {
    save.fell = atStar ? 0 : metres;
  }
  persist();

  const who = climber().as;
  $('over-cause').textContent = atStar ? `${who[0].toUpperCase()}${who.slice(1)} made it.` : run.cause === 'frozen' ? 'Frozen by a frostling.' : climber().slip;
  $('over-height').textContent = atStar ? 'You reached the Christmas star' : `You ${run.base ? 'reached' : 'climbed'} ${fmt(metres)} m`;
  const best = $('over-best');
  best.textContent = '';
  if (metres > mark) {
    const flag = document.createElement('span');
    flag.className = 'flag';
    flag.textContent = run.daily ? 'New best today' : 'New best';
    best.append(flag);
    if (mark) best.append(` Up from ${fmt(mark)} m`);
  } else {
    best.textContent = run.daily ? `Today's best ${fmt(mark)} m` : `Best ${fmt(mark)} m`;
  }
  const at = stageAt(metres);
  const next = STAGES[at + 1];
  // The stage above is named only once the climber has been there. Until then it is a height to
  // aim for, and the star does not give even that away.
  const ahead = !next ? ''
    : at < save.top ? `Next stop: ${next.as}, at ${fmt(next.at)} m.`
    : at === STAGES.length - 2 ? 'The Christmas star is close now.'
    : `Something new begins at ${fmt(next.at)} m.`;
  $('over-stage').textContent = atStar
    ? `${fmt(STAGES[at].at)} m above the rooftops.${save.stars > 1 ? ` That makes ${save.stars} times.` : ''}`
    : [at ? `You reached ${STAGES[at].as}.` : '', ahead].filter(Boolean).join(' ');

  paintToday($('over-goals'));
  // The berries are measured against the next thing they cannot yet buy.
  const want = shelf().find((piece) => piece.cost > save.berries);
  const reach = want ? `, ${fmt(want.cost - save.berries)} short of the ${want.label}.` : '.';
  $('over-berries').textContent = `Picked ${fmt(run.berries)} ${run.berries === 1 ? 'berry' : 'berries'}${run.extra ? `, plus ${fmt(run.extra)} for today's goal` : ''}. You have ${fmt(save.berries)}${reach}`;
  // A result can be passed on from the app, which has the phone's own sheet for it.
  $('btn-share').hidden = !phone.shares;
  // A second chance, once a climb. Not at the star, and not in the daily climb, which has to be
  // the same for everyone.
  const price = carryCost();
  const berry = document.createElement('i');
  berry.className = 'berry';
  $('carry-note').textContent = '';
  $('carry-note').append(berry, fmt(price));
  $('btn-carry').hidden = run.daily || run.carried || atStar || save.berries < price;
  portal.climbs++;
  portal.sheets++;
  // On a phone the ad that nobody chose comes here, between the fall and its sheet. One that
  // does not play is not waited for.
  const goodNews = atStar || metres > mark;
  if (forcedDue(goodNews)) {
    watchAd('midgame').then((played) => {
      if (played) portal.forced++;
      showOver(false);
    });
    return;
  }
  showOver(goodNews);
}

// The result sheet, with whatever an ad would earn on it. Presses wait a moment from here, so
// that a tap meant for the close button of an ad does not land on the sheet instead.
function showOver(goodNews) {
  overAt = performance.now();
  paintAdOffer();
  show('over');
  $('btn-again').focus({ preventScroll: true });
  askPhone();
  if (goodNews) askRating();
}

// A second chance: the berries are paid, the result is taken back, and the climber is carried up
// from the foot of the screen at the height where they fell.
function carryOn(free = false) {
  const price = free ? 0 : carryCost();
  if (state !== 'over' || run.carried || save.berries < price) return;
  // The climb is not over after all. What it has picked stays banked, and its end adds the rest.
  save.berries -= price;
  save.plays--;
  persist();
  Object.assign(run, { carried: true, over: false, cause: '', deadFor: 0 });
  Object.assign(player, {
    x: clamp(player.x, field.lo + 40, field.hi - 40), y: cam.y + view.h - 30, vx: 0, vy: -LIFT_SPEED,
    lift: 0.8, guard: 1.4, frozen: false, spin: 0, flapped: false, squash: 0
  });
  state = 'run';
  show('hud');
  if (steer === 'mouse') holdPointer();
  paintHud();
  sfx.lift();
  ripple(player.x, player.y, C.gold);
}

function goHome() {
  state = 'title';
  tour = null;
  glory = null;
  flypast = null;
  shooting = null;
  departing = null;
  newCity();
  frameEl.classList.remove('touring');
  world = newWorld(1);
  Object.assign(player, { x: W / 2, y: 0, vx: 0, vy: 0, face: 1, lift: 0, guard: 0, pull: 0, globe: 0, squash: 0, wing: 0, spin: 0, frozen: false, ride: null, sleigh: null });
  particles.length = 0;
  paintTitle();
  show('title');
  cam.y = -view.h * rest.title;
  $('btn-play').focus({ preventScroll: true });
}

// Metres climbed per second at each height of the tour, so the busy low stages get the most time.
const TOUR_PACE = [[0, 70], [250, 110], [1200, 150], [2000, 200], [3000, 230], [4500, 260], [6500, 330], [9300, 190], [10000, 80]];
let tour = null;
// The arrival at the Christmas star, while it is going on: how many seconds in, and where the
// climber set off from.
let glory = null;
// The sleigh's low pass after a new best, while it is going on: how many seconds in, and whether
// the present has been let go.
let flypast = null;
// The sleigh on its way off after a ride: where it left the climber, which way it faced and how
// long ago.
let departing = null;
const FLYPAST = 4.4;

// A climb that passes the best there has been is made much of: four bars from the band, a shower
// of sparks round the climber, and the sleigh over low to let a present go.
function celebrate() {
  sfx.best();
  // A climber who is in the sleigh already is handed the present, and the band plays on.
  if (!player.sleigh) {
    sfx.sleigh();
    fanfare();
  }
  firework(player.x, player.y - 14, C.gold);
  if (calm || player.sleigh) {
    send(player.x, cam.y + view.h * 0.3);
    return;
  }
  flypast = { t: 0, sent: false };
  // Three more bursts go up across the top of the sky, one after another.
  [[0.22, 0.34, C.snow], [0.78, 0.3, C.gold], [0.5, 0.42, C.berry]].forEach(([x, y, colour], i) => {
    setTimeout(() => state === 'run' && firework(W * x, cam.y + view.h * y, colour), 200 + i * 220);
  });
}

// A burst of sparks that hang in the air and drift down.
function firework(x, y, colour) {
  ripple(x, y, colour, 70);
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * TAU;
    const speed = 50 + Math.random() * 150;
    particles.push({
      kind: 'glint', colour, x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 40,
      life: 0, ttl: 0.7 + Math.random() * 0.6, size: 3 + Math.random() * 3
    });
  }
}

// Where the sleigh is on its way over, and how far through the pass: it comes in from the left
// under the words "New best", dips towards the middle and is gone to the right.
function flypastAt() {
  const u = flypast.t / FLYPAST;
  return [lerp(field.lo - 180, field.hi + 30, u), cam.y + view.h * (0.28 + 0.05 * Math.sin(u * Math.PI)), u];
}

function stepFlypast(dt) {
  flypast.t += dt;
  const [x, y, u] = flypastAt();
  // Sparks fall away behind it all the way across.
  if (Math.random() < dt * 45) spark(x - 26 + Math.random() * 12, y + Math.random() * 12, -30 - Math.random() * 40);
  // The present is let go as the sleigh passes over the climber, or near the end if it never does.
  if (!flypast.sent && (x > player.x || u > 0.8)) {
    flypast.sent = true;
    send(x, y + 14);
  }
  if (u >= 1) flypast = null;
}

// A golden shooting star crosses the sky as each new stage begins, on the same gust of wind that
// is heard: how many seconds in. It is quick and keeps to the top of the sky, between the score
// and the name of the stage, so that it never draws the eye from the climb.
let shooting = null;
const SHOOT = 0.9;
// How far down the screen it comes in on the left and goes out on the right.
const SHOOT_PATH = [0.19, 0.12];

// Where the shooting star is, and how far across.
function shootingAt() {
  const u = shooting.t / SHOOT;
  return [lerp(field.lo - 60, field.hi + 150, u), cam.y + view.h * lerp(SHOOT_PATH[0], SHOOT_PATH[1], u), u];
}

function stepShooting(dt) {
  shooting.t += dt;
  const [x, y, u] = shootingAt();
  spark(x - 12 - Math.random() * 30, y + 2 + Math.random() * 6, -20 - Math.random() * 30, 0.25 + Math.random() * 0.25);
  if (u >= 1) shooting = null;
}

function paintShooting(g) {
  if (!shooting) return;
  const [x, y] = shootingAt();
  // Its tail lies back along the way it has come and thins out to nothing.
  const back = [x - 150, y + (150 * view.h * (SHOOT_PATH[0] - SHOOT_PATH[1])) / (field.across + 210)];
  const tail = g.createLinearGradient(x, y, back[0], back[1]);
  tail.addColorStop(0, 'rgba(255, 226, 150, 0.9)');
  tail.addColorStop(0.3, 'rgba(242, 181, 58, 0.5)');
  tail.addColorStop(1, 'rgba(242, 181, 58, 0)');
  g.save();
  g.fillStyle = tail;
  shape(g, [x, y - 3.2, back[0], back[1], x, y + 3.2]);
  g.shadowColor = C.gold;
  g.shadowBlur = 18;
  g.fillStyle = '#fff1cf';
  glint(g, x, y, 4.2);
  disc(g, x, y, 3.4);
  g.restore();
}

// A present from the sleigh. It comes down to the climber of its own accord.
function send(x, y) {
  world.items.push({ kind: 'gift', sent: true, age: 0, x, y, bob: 0 });
  sfx.shimmer();
  burst('glint', x, y, 10, C.gold, 20);
}

// One spark, drifting down and going out.
function spark(x, y, vx, ttl = 0.5 + Math.random() * 0.5) {
  particles.push({
    kind: 'glint', colour: Math.random() < 0.6 ? C.gold : C.snow, x, y, vx, vy: 10 + Math.random() * 30,
    life: 0, ttl, size: 2.6 + Math.random() * 2.6
  });
}

// A ride up through every stage, for looking over the backdrops.
function startTour() {
  state = 'tour';
  tour = { rise: 0, stage: 1, lingered: 0 };
  glory = null;
  flypast = null;
  shooting = null;
  world = newWorld(1);
  Object.assign(player, { x: W / 2, y: 0, vx: 0, vy: -LIFT_SPEED, face: 1, flapped: false, lift: 0, guard: 0, pull: 0, globe: 0, squash: 0, wing: 0, spin: 0, frozen: false, ride: null, sleigh: null });
  particles.length = 0;
  cam.zoom = 1;
  frameEl.classList.add('touring');
  $('hud-mode').hidden = true;
  show('hud');
  hint(`${press} anywhere to go back`);
  if (document.activeElement) document.activeElement.blur();
  sfx.lift();
}

function stepTour(dt) {
  if (tour.rise < 10250) {
    tour.rise += track(TOUR_PACE, tour.rise) * dt;
  } else {
    // At the top the tour puts on the show a climber gets for arriving.
    if (!glory) {
      glory = { t: 0, rings: 0 };
      sfx.star();
    }
    tour.lingered += dt;
    if (tour.lingered > 6) {
      goHome();
      return;
    }
  }
  while (tour.stage < STAGES.length && tour.rise >= STAGES[tour.stage].at) {
    toast(STAGES[tour.stage].name);
    sfx.layer();
    tour.stage++;
  }
  $('hud-height').textContent = Math.floor(tour.rise);
  cam.y = -view.h * rest.title - tour.rise * 10;
  player.x = W / 2 + Math.sin(clock * 0.7) * 70;
  player.y = cam.y + view.h * 0.62 + Math.sin(clock * 1.9) * 8;
  player.face = Math.cos(clock * 0.7) > 0 ? 1 : -1;
  if (Math.random() < 0.6) burst('chip', player.x, player.y, 1, C.gold);
  if (glory) stepGlory(dt);
}

// Today's goal, dealt the first time the game is opened each day after the first climb.
// Everyone who has been as high gets the same one on the same day.
function dealToday() {
  const day = todayKey();
  if (!save.plays || (save.today && save.today.day === day)) return;
  const open = Object.keys(TODAY).filter((kind) => save.best >= TODAY[kind].from);
  const kind = open[Math.floor(Date.parse(day) / 864e5) % open.length];
  // What it pays goes up with what berries are worth at the climber's highest stage.
  save.today = { day, kind, n: TODAY[kind].n(), count: 0, done: false, pay: Math.max(1000, 250 * STAGES[save.top].worth) };
  persist();
}

// Counts towards the day's goal. Each quarter of the way is shown in passing, and the goal is paid
// the moment it is met.
function tallyToday(kind, by = 1) {
  const today = save.today;
  if (!run || !today || today.done || today.kind !== kind || today.day !== todayKey()) return;
  const quarter = Math.floor((4 * today.count) / today.n);
  today.count = Math.min(today.n, today.count + by);
  if (today.count < today.n) {
    if (Math.floor((4 * today.count) / today.n) > quarter && state === 'run') {
      celebrate(`Today's goal: ${TODAY[kind].say(today.n)}, ${fmt(Math.floor(today.count))} so far`);
    }
    return;
  }
  today.done = true;
  save.berries += today.pay;
  run.extra += today.pay;
  persist();
  celebrate("Today's goal done", today.pay);
  sfx.gold();
  cheerPortal();
}

// The opening, played once on a first visit: the robin on its roof looks up at the star, in four
// shots of the home screen, and then the first climb begins. A click, a tap or a key at any point
// starts the climb at once. Each shot: when it starts, what it looks at, how close it is at its
// start and at its end, and the line said over it.
const SHOTS = [
  { at: 0, on: 'roof', from: 1, to: 1.06, say: 'One small robin looked up…' },
  { at: 2.2, on: 'robin', from: 2.1, to: 2.3, say: '…and dreamed' },
  { at: 4.4, on: 'star', from: 2.6, to: 2.85, say: 'of reaching the Christmas star.' },
  { at: 6.6, on: 'robin', from: 1.5, to: 1, say: 'Tonight, the climb begins.' }
];
const OPENING = 8.6;
let opening = null;

function startOpening() {
  opening = { t: 0, shot: -1 };
  frameEl.classList.add('opening');
  resize();
}

function endOpening() {
  if (!opening) return;
  opening = null;
  save.opened = true;
  persist();
  frameEl.classList.remove('opening', 'close');
  $('caption').classList.remove('on');
  canvas.style.transform = '';
  resize();
}

// Where on the screen a shot looks: the roof, the robin's head, or the star.
function shotAim(on) {
  const x = (at) => view.left + at * view.scale;
  if (on === 'star') return [x(BEACON.x), BEACON.y * view.scale];
  // The roof, not the robin hopping on it, so that the camera holds still.
  const y = -cam.y * view.scale;
  return on === 'robin' ? [x(player.x), y - 22 * view.scale] : [x(W / 2), y - 70 * view.scale];
}

function stepOpening(dt) {
  opening.t += dt;
  if (opening.t >= OPENING) {
    startRun(false, pointer.kind);
    return;
  }
  let k = 0;
  while (k + 1 < SHOTS.length && opening.t >= SHOTS[k + 1].at) k++;
  const shot = SHOTS[k];
  const end = k + 1 < SHOTS.length ? SHOTS[k + 1].at : OPENING;
  const line = $('caption');
  if (k !== opening.shot) {
    opening.shot = k;
    line.textContent = shot.say;
    line.classList.add('on');
    frameEl.classList.toggle('close', k > 0);
  }
  // Each line goes just before its cut.
  if (end - opening.t < 0.3) line.classList.remove('on');
  if (calm) return;
  // The camera moves in at an even pace by ratio, over the finished picture, and never shows past
  // its edges.
  const zoom = shot.from * (shot.to / shot.from) ** ((opening.t - shot.at) / (end - shot.at));
  const [cx, cy] = shotAim(shot.on);
  const tx = Math.min(0, Math.max(view.sw * (1 - zoom), view.sw / 2 - cx * zoom));
  const ty = Math.min(0, Math.max(view.sh * (1 - zoom), view.sh / 2 - cy * zoom));
  canvas.style.transform = zoom > 1.001 ? `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${zoom.toFixed(4)})` : '';
}

// The day's goal as a row, on the home screen and after a climb.
function paintToday(list) {
  list.textContent = '';
  const today = save.today;
  if (!today || today.day !== todayKey()) return;
  const part = (text, className) => {
    const span = document.createElement('span');
    span.className = className;
    span.append(text);
    return span;
  };
  const row = document.createElement('li');
  if (today.done) {
    row.className = 'today done';
    row.append("Today's goal done", part('A new one tomorrow', 'next'));
  } else {
    const berry = document.createElement('i');
    berry.className = 'berry';
    const pay = part('', 'pay');
    pay.append(berry, fmt(today.pay));
    const tail = part(`${fmt(Math.floor(today.count))} of ${fmt(today.n)}`, 'along');
    row.className = 'today';
    row.append(part("Today's goal", 'label'), part(TODAY[today.kind].say(today.n), 'what'), tail, pay);
  }
  list.append(row);
}

// News of the day's goal shows across the top for a moment, and when it is met its berries fly
// to the purse. News that comes together takes its turn.
const cheers = [];
let cheering = false;
function celebrate(text, pay = 0) {
  cheers.push({ text, pay });
  if (!cheering) nextCheer();
}

function nextCheer() {
  const cheer = cheers.shift();
  const el = $('banner');
  if (!cheer) {
    cheering = false;
    return;
  }
  cheering = true;
  $('banner-what').textContent = cheer.text;
  const pay = $('banner-pay');
  pay.textContent = '';
  if (cheer.pay) {
    const berry = document.createElement('i');
    berry.className = 'berry';
    pay.append(berry, `+${fmt(cheer.pay)}`);
    setTimeout(() => flyBerries(pay, 8), 350);
  }
  el.classList.toggle('grand', Boolean(cheer.pay));
  el.hidden = false;
  void el.offsetWidth;
  el.classList.add('on');
  setTimeout(() => {
    el.classList.remove('on');
    setTimeout(nextCheer, 300);
  }, cheer.pay ? 3200 : 2200);
}

function flyBerries(from, count) {
  const to = $('hud-berries');
  if (calm || $('hud').hidden || !to.offsetWidth) return;
  const home = stage.getBoundingClientRect();
  const a = from.getBoundingClientRect();
  const b = to.getBoundingClientRect();
  const dx = b.left + b.width / 2 - (a.left + a.width / 2);
  const dy = b.top + b.height / 2 - (a.top + a.height / 2);
  for (let i = 0; i < count; i++) {
    const berry = document.createElement('i');
    berry.className = 'berry flying';
    berry.style.left = `${a.left - home.left + a.width / 2}px`;
    berry.style.top = `${a.top - home.top + a.height / 2}px`;
    stage.append(berry);
    const flight = berry.animate([
      { transform: 'translate(0, 0) scale(1)' },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 30}px) scale(1.15)`, offset: 0.45 },
      { transform: `translate(${dx}px, ${dy}px) scale(0.7)` }
    ], { duration: 700, delay: i * 80, easing: 'ease-in', fill: 'forwards' });
    flight.onfinish = () => {
      berry.remove();
      const purse = to.parentElement;
      purse.classList.remove('fed');
      void purse.offsetWidth;
      purse.classList.add('fed');
    };
  }
}

// Everything not yet bought, cheapest first, each named as it reads after "the".
function shelf() {
  return [
    ...HEROES.map((piece) => ({ cost: piece.cost, label: mid(piece.name), mine: has(piece) })),
    ...SCARVES.map((piece) => ({ cost: piece.cost, label: `${mid(piece.name)} scarf`, mine: has(piece) })),
    ...HATS.map((piece) => ({ cost: piece.cost, label: mid(piece.name), mine: has(piece) })),
    ...KIT.map((piece) => ({ cost: piece.costs[kitLevel(piece.id)], label: piece.label, mine: kitLevel(piece.id) === piece.costs.length }))
  ].filter((piece) => !piece.mine).sort((a, b) => a.cost - b.cost);
}

// The strip on the home screen: a stop for each stage found so far, then a dotted trail on to the
// Christmas star. How far off the star is, and what lies on the way, is left for the climb to show.
function paintRoute() {
  const last = STAGES.length - 1;
  const won = save.top === last;
  const found = Math.min(save.top, last - 1);
  const here = 10 + found * 22;
  const stops = $('route-stops');
  stops.textContent = '';
  for (let i = 0; i <= found; i++) {
    const stop = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    stop.setAttribute('class', 'stop');
    stop.setAttribute('cx', 10 + i * 22);
    stop.setAttribute('cy', 12);
    stop.setAttribute('r', 3.4);
    stops.append(stop);
  }
  $('route-done').setAttribute('d', `M10 12H${won ? 296 : here}`);
  $('route-ahead').setAttribute('d', `M${here + 13} 12H296`);
  $('route-ahead').toggleAttribute('hidden', won);
  $('route-here').setAttribute('cx', here);
  $('route-here').toggleAttribute('hidden', won);
  const said = save.best ? 'The Christmas star is higher still.' : 'The Christmas star is up there somewhere.';
  $('route-note').textContent = won ? 'You reached the Christmas star.' : said;
}

function stepStart(by) {
  const to = clamp(save.from + by, 0, Math.min(save.top, STAGES.length - 2));
  if (to === save.from) return;
  save.from = to;
  persist();
  paintStart();
  sfx.bounce();
}

function pause() {
  if (state !== 'run') return;
  state = 'paused';
  keys.left = keys.right = false;
  paintKeys();
  show('pause');
  $('btn-resume').focus({ preventScroll: true });
}

function resume() {
  if (state !== 'paused') return;
  state = 'run';
  show('hud');
  if (steer === 'mouse') holdPointer();
  document.activeElement.blur();
}

function openWardrobe() {
  state = 'wardrobe';
  paintWardrobe();
  show('wardrobe');
}

function closeWardrobe() {
  state = 'title';
  fitting = null;
  paintTitle();
  show('title');
  $('btn-wardrobe').focus({ preventScroll: true });
}

// What a piece costs, or null once there is nothing left of it to buy.
function priceOf(slot, piece) {
  if (slot === 'kit') return kitLevel(piece.id) < piece.costs.length ? piece.costs[kitLevel(piece.id)] : null;
  return has(piece) ? null : piece.cost;
}

function choose(slot, piece) {
  const price = priceOf(slot, piece);
  let lacking = false;
  if (price === null) {
    fitting = null;
    if (slot !== 'kit') save[slot] = piece.id;
  } else if (!fitting || fitting.id !== piece.id) {
    fitting = { slot, id: piece.id };
    sfx.bounce();
  } else if (save.berries < price) {
    // The shortfall is written on the piece itself. A toast would sit behind this sheet.
    lacking = true;
    sfx.nope();
  } else {
    save.berries -= price;
    if (slot === 'kit') {
      save.kit[piece.id] = kitLevel(piece.id) + 1;
    } else {
      save.owned.push(piece.id);
      save[slot] = piece.id;
    }
    fitting = null;
    sfx.buy();
  }
  persist();
  paintWardrobe();
  const button = $(`wear-${piece.id}`);
  button.classList.toggle('lacking', lacking);
  button.focus({ preventScroll: true });
}

// Where the app can be had, which goes on the end of a result that is shared. It stays empty until
// the app is in the App Store.
const HOME = { app: '' };

function shareResult() {
  let text = `Rooftop Robin daily climb, ${dayLabel(run.day)} (${run.twist.name}): ${run.metres} m. Can you get higher?`;
  if (!run.daily) {
    text = run.cause === 'star'
      ? 'Rooftop Robin: all the way up to the Christmas star. Can you get there?'
      : `Rooftop Robin: ${run.metres} m up from the rooftops. Can you get higher?`;
  }
  if (!phone.shares) return;
  // The phone's own sheet does the passing on. Putting it away again is no fault.
  phone.kit.nativePromise('Share', 'share', HOME.app ? { text, url: HOME.app } : { text }).catch(() => {});
}

function flip(what) {
  save[what] = !save[what];
  persist();
  paintSwitches();
  wakeAudio();
  if (what === 'sound') sfx.berry(0);
  if (what === 'buzz') buzz('LIGHT');
}

// The game's name heads the home screen. In a wide frame it has the left margin to itself, and
// stays there except during a climb, when the height takes its place.
const named = (name) => (view.wide ? name !== 'hud' : name === 'title');
let shown = '';
function show(name) {
  shown = name;
  if (name !== 'hud') freePointer();
  stage.dataset.shown = name;
  stage.classList.toggle('playing', name === 'hud');
  for (const id of ['title', 'hud', 'pause', 'over', 'wardrobe']) $(id).hidden = id !== name;
  $('masthead').hidden = !named(name);
  const panel = $(name);
  if (panel.classList.contains('sheet')) {
    panel.classList.remove('rise');
    void panel.offsetWidth;
    panel.classList.add('rise');
  }
  findPerch();
}

// Keeps the climber clear of whichever menu is open, at any frame size. The roof never stands more
// than 92 above the menu, which keeps the snow on its eaves tucked out of sight behind it. Where
// the gap under the title is tight, the roof sits low enough in it for the climber's head to clear.
function findPerch() {
  if (state !== 'title' && state !== 'wardrobe') return;
  const top = $(state).offsetTop / view.scale;
  const head = state === 'title' && !view.wide ? $('masthead').offsetHeight / view.scale : 0;
  const drop = clamp((top - head) * 0.45, 24, 92);
  rest[state] = Math.max(top - drop, Math.min(head + 50, top - 24)) / view.h;
}

let toastTimer = 0;
function toast(text, grand = false) {
  const el = $('toast');
  el.textContent = text;
  el.classList.toggle('grand', grand);
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), grand ? 2800 : 1600);
}

let hintTimer = 0;
let hintAt = 0;
let hintWait = 0;
let coachUntil = 0;
function hint(text) {
  clearTimeout(hintWait);
  if ($('coach').classList.contains('on')) {
    hintWait = setTimeout(() => hint(text), Math.max(100, coachUntil - performance.now() + 300));
    return;
  }
  const el = $('hint');
  el.textContent = text;
  el.classList.add('on');
  $('coach').classList.remove('on');
  hintAt = performance.now();
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.remove('on'), 5500);
}

function paintHud() {
  $('hud-height').textContent = run.metres;
  $('hud-berries').textContent = run.berries;
}

// The pictures that teach the controls, one for steering and one for the extra hop, drawn for
// whatever the player has in hand: a mouse, the keys or a finger.
const MOUSE = '<rect x="27" y="5" width="24" height="36" rx="12"/><path d="M39 5v13"/>';
const ARROWS = '<path d="M19 23H7m5-5-5 5 5 5M59 23h12m-5-5 5 5-5 5"/>';
const PICTURES = {
  mouse: [`${ARROWS}${MOUSE}`, `<path class="lit" d="M39 5v13H27v-1a12 12 0 0 1 12-12z"/>${MOUSE}`],
  keys: [
    '<rect x="10" y="10" width="26" height="26" rx="6"/><path class="lit" d="M27 16v14l-9-7z"/><rect x="42" y="10" width="26" height="26" rx="6"/><path class="lit" d="M51 16v14l9-7z"/>',
    '<rect x="5" y="11" width="68" height="24" rx="6"/><text x="39" y="27.5">Space</text>'
  ],
  touch: [
    `${ARROWS}<circle class="lit" cx="39" cy="23" r="9"/>`,
    '<circle class="lit" cx="39" cy="23" r="7"/><circle cx="39" cy="23" r="13"/><circle cx="39" cy="23" r="19" opacity="0.5"/>'
  ]
};
function pictures(device) {
  const row = (inside, says) => `<p><svg viewBox="0 0 78 46" aria-hidden="true">${inside}</svg>${says}</p>`;
  return row(PICTURES[device][0], 'Steer') + row(PICTURES[device][1], 'Extra hop');
}

// At the start of a first few climbs the pictures come up over the playfield.
let coachTimer = 0;
function coach(device) {
  const el = $('coach');
  el.innerHTML = pictures(device);
  el.classList.add('on');
  $('hint').classList.remove('on');
  clearTimeout(coachTimer);
  coachUntil = performance.now() + 5500;
  coachTimer = setTimeout(() => el.classList.remove('on'), 5500);
}

// In a wide frame they also stay in the right margin, for whichever way the player is steering,
// with a word about the other way.
let keysFor = '';
function paintKeys() {
  const device = run ? steer : press === 'Tap' ? 'touch' : 'mouse';
  if (device === keysFor) return;
  keysFor = device;
  const also = { mouse: 'Or arrow keys and Space.', keys: 'Or the mouse.', touch: '' }[device];
  $('keys').innerHTML = pictures(device) + (also ? `<p class="also">${also}</p><p class="also">P or Esc pauses.</p>` : '');
}

function fillRack(rack, pieces, slot, [on, off]) {
  rack.textContent = '';
  for (const piece of pieces) {
    const price = priceOf(slot, piece);
    const worn = slot !== 'kit' && save[slot] === piece.id;
    const trying = Boolean(fitting) && fitting.id === piece.id;
    const button = document.createElement('button');
    const picture = document.createElement('canvas');
    const note = document.createElement('small');
    button.type = 'button';
    button.id = `wear-${piece.id}`;
    button.className = `item${trying ? ' trying' : ''}${trying && price > save.berries ? ' dear' : ''}`;
    button.setAttribute('aria-pressed', worn);
    note.textContent = worn ? on
      : price === null ? off
      : !trying ? `${fmt(price)} berries`
      : price > save.berries ? `${fmt(price - save.berries)} more needed`
      : `Buy for ${fmt(price)}`;
    picture.width = picture.height = 96;
    paintPicture(picture.getContext('2d'), slot, piece);
    button.append(picture, piece.name, note);
    button.addEventListener('click', () => {
      wakeAudio();
      choose(slot, piece);
    });
    rack.append(button);
  }
}

  g.fillStyle = '#1b4650';

  if (slot !== 'kit') {
    paintClimber(g, { hero: look().hero, scarf: 'no-scarf', hat: 'no-hat', [slot]: piece.id }, false, 0);

  piece.costs.forEach((cost, i) => {
    g.fillStyle = i < kitLevel(piece.id) ? C.gold : '#4f7078';
    disc(g, (i - (piece.costs.length - 1) / 2) * 8, -4.5, 2.2);

function resize() {
  const sw = stage.clientWidth || W;
  const sh = stage.clientHeight || 640;
  // Going into or out of full screen, or turning a phone, in the middle of a climb pauses it. A
  // phone's toolbar coming and going changes only the height, and does not.
  if (state === 'run' && view.sw && Math.abs(sw - view.sw) > 2) pause();
  // The opening moves in close, so it is drawn with more pixels while it plays.
  view.dpr = Math.min(window.devicePixelRatio || 1, 2) * (opening && !calm ? 1.6 : 1);
  canvas.width = Math.round(sw * view.dpr);
  canvas.height = Math.round(sh * view.dpr);
  // A wide frame shows less of the climb, so that everything in it is larger, and keeps at least
  // half a playfield's width either side for what is written there.
  view.wide = sw / sh >= 1.25;
  view.h = view.wide ? clamp((sh * 800) / sw, 480, 640) : sh / sw >= 1.5 ? Math.min((sh * W) / sw, 960) : 640;
  view.scale = sh / view.h;
  view.sw = sw;
  view.sh = sh;
  view.left = (sw - W * view.scale) / 2;
  const across = view.wide ? Math.min(sw / view.scale, 900) : W;
  if (across !== field.across) {
    Object.assign(field, { lo: (W - across) / 2, hi: (W + across) / 2, across });
    for (const f of flakes) f.x = field.lo + Math.random() * across;
  }
  frameEl.style.width = `${W * view.scale}px`;
  frameEl.style.setProperty('--u', view.scale.toFixed(3));
  frameEl.style.setProperty('--fh', `${sh}px`);
  frameEl.style.setProperty('--side', `${view.left.toFixed(1)}px`);
  frameEl.classList.toggle('short', sh < 620);
  stage.classList.toggle('wide', view.wide);
  if (shown) $('masthead').hidden = !named(shown);
  paintFinish();
  hangLights();
  findPerch();
}

const fieldX = (e) => (e.clientX - stage.getBoundingClientRect().left - view.left) / view.scale;
const deviceOf = (e) => (e.detail === 0 ? 'keys' : pointer.kind);

// While a climb is steered with the mouse, the pointer is held inside the game, as it would
// otherwise run off onto the page around it in the middle of a climb. The climber then moves with
// the mouse as it moves under a finger, and goes off one side to come back on the other. Esc lets
// the pointer go and the climb waits. Where the browser will not hold it, the climber follows the
// pointer instead.
function holdPointer() {
  if (!stage.requestPointerLock || document.pointerLockElement === stage) return;
  try {
    const asked = stage.requestPointerLock();
    if (asked && asked.catch) asked.catch(() => {});
  } catch (err) {
    // Not held, then: the climber follows the pointer.
  }
}

function freePointer() {
  if (document.pointerLockElement === stage) document.exitPointerLock();
}

document.addEventListener('pointerlockchange', () => {
  pointer.locked = document.pointerLockElement === stage;
  dragDx = 0;
  if (!pointer.locked && state === 'run') pause();
});

window.addEventListener('pointerdown', (e) => {
  pointer.kind = e.pointerType === 'mouse' ? 'mouse' : 'touch';
}, true);

stage.addEventListener('pointerdown', (e) => {
  wakeAudio();
  if (e.target.closest('button')) return;
  // A first visit: a touch anywhere starts the first climb.
  if (state === 'title' && !save.plays) {
    startRun(false, pointer.kind);
    return;
  }
  if (state !== 'run') return;
  if (e.pointerType === 'mouse') {
    steer = 'mouse';
    if (!pointer.locked) {
      pointer.mouseX = fieldX(e);
      holdPointer();
    }
    flap();
    return;
  }
  steer = 'touch';
  if (pointer.id !== null) {
    flap();
    return;
  }
  pointer.id = e.pointerId;
  pointer.lastX = e.clientX;
  pointer.downAt = e.timeStamp;
  pointer.moved = 0;
});

stage.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') {
    if (pointer.locked) dragDx += e.movementX / view.scale;
    else pointer.mouseX = fieldX(e);
    return;
  }
  if (e.pointerId !== pointer.id) return;
  const dx = (e.clientX - pointer.lastX) / view.scale;
  pointer.lastX = e.clientX;
  pointer.moved += Math.abs(dx);
  dragDx += dx;
});

function liftFinger(e) {
  if (e.pointerId !== pointer.id) return;
  pointer.id = null;
  if (e.type === 'pointerup' && e.timeStamp - pointer.downAt < 220 && pointer.moved < 8) flap();
}
stage.addEventListener('pointerup', liftFinger);
stage.addEventListener('pointercancel', liftFinger);
// A phone only counts a touch as a gesture once the finger lifts, so audio is woken on release too.
window.addEventListener('pointerup', wakeAudio, true);
window.addEventListener('touchend', wakeAudio, true);
stage.addEventListener('contextmenu', (e) => e.preventDefault());
// Where the pointer is not held, a mouse that runs off the game in a climb, onto the page around it
// or down to the taskbar, would leave the climber with no one steering. The climb waits instead.
stage.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'mouse' && steer === 'mouse' && !pointer.locked && state === 'run') pause();
});
// The tour has no button: it is for looking over the backdrops, and players find the stages by
// climbing to them. Five quick taps on the title start it, and any tap or click ends it. Both wait
// for the click, so the tap cannot land on the menu beneath.
const knock = { count: 0, at: 0 };
stage.addEventListener('click', (e) => {
  if (state === 'tour' && !e.target.closest('button')) {
    goHome();
    return;
  }
  const name = document.querySelector('h1').getBoundingClientRect();
  if (state !== 'title' || e.clientX < name.left || e.clientX > name.right || e.clientY < name.top || e.clientY > name.bottom) return;
  knock.count = e.timeStamp - knock.at < 600 ? knock.count + 1 : 1;
  knock.at = e.timeStamp;
  if (knock.count === 5) startTour();
});

const PLAY_KEYS = ['Space', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'KeyA', 'KeyD', 'KeyW'];
// On a site the game sits in a frame, and these would move the page around it: the keys that
// scroll, the wheel and the menu on a right click. A button still takes its Space, and the two
// places that scroll or hold text keep what is theirs.
const within = (e, selector) => e.target instanceof Element && e.target.closest(selector);
window.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown'].includes(e.code) && !within(e, 'button, textarea, .fit')) e.preventDefault();
});
window.addEventListener('wheel', (e) => {
  if (!within(e, '.fit')) e.preventDefault();
}, { passive: false });

  if (!within(e, 'textarea')) e.preventDefault();
});

window.addEventListener('keydown', (e) => {
  if (portal.busy) return;
  wakeAudio();
  const key = e.code;
  if (state === 'tour' && !e.repeat) {
    goHome();
    return;
  }
  // P pauses, and so does Escape, as players expect. In full screen the browser keeps Escape for
  // leaving it, and the climb pauses then because its frame changes width.
  if (key === 'KeyP' || key === 'Escape') {
    if (state === 'run') pause();
    else if (state === 'paused') resume();
    return;
  }
  // A first visit: any key that plays the game starts the first climb.
  if (state === 'title' && !save.plays && PLAY_KEYS.includes(key) && !e.repeat) {
    startRun(false, 'keys');
    e.preventDefault();
    return;
  }
  if (state !== 'run') return;
  if (key === 'ArrowLeft' || key === 'KeyA') keys.left = true;
  else if (key === 'ArrowRight' || key === 'KeyD') keys.right = true;
  else if (key === 'Space' || key === 'ArrowUp' || key === 'KeyW') {
    if (!e.repeat) flap();
  } else return;
  steer = 'keys';
  e.preventDefault();
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;

function disc(g, x, y, r) {
  g.beginPath();
  g.arc(x, y, r, 0, TAU);
  g.fill();
}

function oval(g, x, y, rx, ry, tilt) {
  g.beginPath();
  g.ellipse(x, y, rx, ry, tilt, 0, TAU);
  g.fill();
}

function bar(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
  g.fill();
}

function shape(g, points) {
  g.beginPath();
  for (let i = 0; i < points.length; i += 2) g.lineTo(points[i], points[i + 1]);
  g.closePath();
  g.fill();
}

const rgb = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
};
const blend = (a, b, t) => `rgb(${a.map((v, c) => Math.round(lerp(v, b[c], t))).join(',')})`;
const rgba = (hex, alpha) => `rgba(${rgb(hex).join(',')},${alpha})`;
// 0 below "from", 1 above "to", a straight ramp between.
const ramp = (v, from, to) => clamp((v - from) / (to - from), 0, 1);
// Fades in over a to b and out again over c to d.
const during = (v, a, b, c, d) => ramp(v, a, b) * (1 - ramp(v, c, d));

// Reads a value off a list of [height, value] pairs, with straight lines between them.
function track(points, at) {
  let i = 0;
  while (i < points.length - 2 && at >= points[i + 1][0]) i++;
  const [a, low] = points[i];
  const [b, high] = points[i + 1];
  return lerp(low, high, clamp((at - a) / (b - a), 0, 1));
}
